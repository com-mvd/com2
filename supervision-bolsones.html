<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>COM 2</title>
<link rel="icon" type="image/png" href="assets/logo-ciemsa.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

</head>
<body>
<div class="cargador" id="cargador">Cargando datos…</div>
<header class="barra">
  <div class="barra-in">
    <div class="titulo">
      <span class="ico" aria-hidden="true">♻</span>
      <h1>Supervisión de Bolsones</h1>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- Categorías: cada botón muestra uno de los bloques .cat de abajo -->
  <nav class="cats" id="cats">
    <button data-cat="organizacion" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Organización del servicio</button>
    <button data-cat="pendientes"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Pendientes</button>
    <button data-cat="atrasados"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></svg>Atrasados</button>
    <button data-cat="borrar"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>Para borrar</button>
    <button data-cat="ingreso"><svg viewBox="0 0 24 24"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M4 13 6.5 5h11L20 13v6H4z"/><path d="M12 3v7M9.5 7.5 12 10l2.5-2.5"/></svg>Seguimiento ingreso</button>
    <button data-cat="informe"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 13 2 2 4-4"/></svg>Informe realizados</button>
    <button data-cat="operacion"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Operación del día</button>
    <button data-cat="buscador"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>Buscador dirección</button>
  </nav>

  <!-- Datos fijos del servicio: municipios y planta de cada día, vaciados fijos -->
  <div class="cat on" data-cat="organizacion">
  <section class="semana" id="semana"></section>
  </div>

  <!-- Todo lo que está en estado Nuevo: a la izquierda cuántos hay por municipio (filtra el mapa) -->
  <div class="cat" data-cat="pendientes">
  <div class="card mapa-card pen-card">
    <aside class="pen-lado" id="penLado"></aside>
    <div class="pen-mapa"><div class="mapa" id="penMapa"></div><div class="ficha" id="penFicha"></div></div>
  </div>
  </div>

  <!-- Réplica de la hoja "Atrasados": vaciados pendientes por antigüedad y municipio, y el detalle -->
  <div class="cat" data-cat="atrasados">
  <section class="card atr-card">
    <div class="hm-wrap"><div class="hm" id="hmAtraso"></div></div>
  </section>
  <section class="card atr-card">
    <div id="atLista"></div>
  </section>
  <!-- Mapa de los atrasados (solo si hay alguno) -->
  <div class="card mapa-card mapa-op" id="atrMapaCard" hidden>
    <div class="mapa" id="atrMapa"></div>
    <div class="ficha" id="atrFicha"></div>
  </div>
  </div>

  <!-- Hoy: mapa como la hoja "Realizar hoy" y seguimiento de gestiones (el contenido lo arma vistaHTML) -->
  <div class="cat" data-cat="operacion" id="vOp"></div>

  <!-- Lo mismo para un día que ya pasó (como la hoja "Informe realizados"). Solo días anteriores a hoy -->
  <div class="cat" data-cat="informe">
  <div id="vInf"></div>
  </div>

  <!-- Réplica de la hoja "Repetidos": direcciones con más de una solicitud abierta y descripciones que piden borrar -->
  <div class="cat" data-cat="borrar">
  <section class="card atr-card">
    <div class="sec-t">Direcciones repetidas</div>
    <div id="repLista"></div>
  </section>
  <section class="card atr-card">
    <div class="sec-t">Descripción para borrar</div>
    <div id="borLista"></div>
  </section>
  </div>

  <!-- Réplica de la hoja "Seguimiento ingreso": solicitudes ingresadas en la fecha elegida -->
  <div class="cat" data-cat="ingreso">
  <section class="card atr-card">
    <div class="ing-bar">
      <label class="ing-f">Fecha <input type="date" id="ingDia"></label>
      <span class="ing-tot" id="ingTot"></span>
    </div>
    <div class="tabla-wrap"><table class="tabla tabla-ing" id="tIngFalta"></table></div>
    <div class="tabla-wrap"><table class="tabla tabla-ing" id="tIngOk"></table></div>
  </section>
  </div>

  <!-- Buscar una dirección o edificio y ver todas sus solicitudes, con las columnas de Operación del día -->
  <div class="cat" data-cat="buscador">
  <section class="card atr-card">
    <div class="ing-bar">
      <label class="ing-f bus-f">Dirección o edificio <span class="bus-caja"><input type="search" id="busQ" placeholder="Ej: Quijote 2562 o Cecoed" autocomplete="off"><div class="bus-lista" id="busLista" hidden></div></span></label>
      <span class="ing-tot" id="busTot"></span>
    </div>
    <div class="tabla-wrap"><table class="tabla tabla-ges" id="busTabla"></table></div>
  </section>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Fuente de datos: la base pública de Bolsones (sin datos personales) que sube n8n a Supabase
// Storage con el botón Actualizar de la portada. Lo privado (teléfonos, notas) se abre aparte
// con la contraseña del sitio (ver privados()).
const CONFIG = {
  fuente: 'https://srgduwdvkgqrrmhxpzlx.supabase.co/storage/v1/object/public/bases/bolsones.json',   // Supabase Storage (desde el 10/11/2026)
};

// ── Calendario del servicio (se edita a mano acá) ──
// Un día por entrada, de lunes a domingo, en ese orden. En cada día: qué municipios se atienden y en qué
// planta descargan, y los vaciados fijos (detalle es opcional: líneas de texto debajo del nombre).
// Hasta el 10/11/2026 estaba en bolsones-calendario.json del repo com-mvd/bases.
const CALENDARIO = [
  { dia: 'Lunes',
    municipios: [{ municipio: 'B', planta: 'La Paloma' }, { municipio: 'F', planta: 'Geminis' }],
    vaciadosFijos: [
      { nombre: 'Cooperativa Mesa 1', municipio: 'F' },
      { nombre: 'Plaza Alba Roballo', municipio: 'F', detalle: ['14:00 a 21:00'] },
      { nombre: 'Torre de los Caudillos', municipio: 'CH', detalle: ['Retiro por Enrique Rodó 2395 bis', '10:00 a 12:00'] },
      { nombre: 'Edificio IM', municipio: 'B' },
    ] },
  { dia: 'Martes',
    municipios: [{ municipio: 'A', planta: 'La Paloma' }, { municipio: 'G', planta: 'Duran' }],
    vaciadosFijos: [
      { nombre: 'PTI Cerro', municipio: 'A', detalle: ['Edificio Verde 217 - Solytex', '10:30 a 15:00', 'Descargar en Durán'] },
      { nombre: 'Viviendas BPS', municipio: 'G', detalle: ['Bv. José Batlle y Ordóñez 6320', '8:00'] },
      { nombre: 'Edificio IM', municipio: 'B' },
    ] },
  { dia: 'Miércoles',
    municipios: [{ municipio: 'E', planta: 'Geminis' }],
    vaciadosFijos: [
      { nombre: 'Cooperativa Mesa 1', municipio: 'F' },
      { nombre: 'Edificio IM', municipio: 'B' },
    ] },
  { dia: 'Jueves',
    municipios: [{ municipio: 'C', planta: 'Burgues' }, { municipio: 'D', planta: 'Duran' }],
    vaciadosFijos: [
      { nombre: 'Recorrido La Teja', municipio: 'A', detalle: ['Primer jueves del mes: de mañana', 'Tercer jueves del mes: de tarde'] },
      { nombre: 'Edificio IM', municipio: 'B' },
    ] },
  { dia: 'Viernes',
    municipios: [{ municipio: 'CH', planta: 'Geminis' }],
    vaciadosFijos: [
      { nombre: 'Cooperativa Mesa 1', municipio: 'F' },
      { nombre: 'Torre de los Caudillos', municipio: 'CH', detalle: ['Retiro por Enrique Rodó 2395 bis', '10:00 a 12:00'] },
      { nombre: 'Edificio IM', municipio: 'B' },
    ] },
  { dia: 'Sábado',
    municipios: [{ municipio: 'CH', planta: 'Usina 5' }],
    vaciadosFijos: [] },
  { dia: 'Domingo',
    municipios: [],
    vaciadosFijos: [] },
];
// ─────────────────────────────────────────────────────────────────────────────

const MUNIS = ['A', 'B', 'C', 'CH', 'D', 'E', 'F', 'G'];

// Color de cada municipio: el mismo del formato condicional de la hoja Indicadores
// de SUPERVISION BOLSONES. Se usa en todas las etiquetas de municipio de la página.
const COLOR_MUNI = { A: '#C2A289', B: '#FFE599', C: '#B6D7A8', CH: '#6D9EEB', D: '#F9CB9C', E: '#93C47D', F: '#B4A7D6', G: '#A64D79' };
// Etiqueta de municipio: fondo neutro con la marca de color a la izquierda (como los vaciados fijos)
const chipMuni = (m, largo) => `<span class="mb" style="border-left-color:${COLOR_MUNI[m] || 'var(--gris)'}">${largo ? 'Municipio ' : ''}${esc(m)}</span>`;
// Día de servicio de cada municipio (ISO: 1 = lunes). CH va viernes y sábado;
// la planilla toma el sábado para calcular el atraso, se replica igual.
const DIA_SERVICIO = { B: 1, F: 1, A: 2, G: 2, E: 3, C: 4, D: 4, CH: 6 };
const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const ATRASO = [
  { n: 'Sin atraso', c: '#F2C29C' },
  { n: '1 semana', c: '#E98A4F' },
  { n: '2 semanas', c: '#D45E26' },
  { n: '3 semanas', c: '#A8431A' },
  { n: '4 semanas o más', c: '#6E2A0F' },
];
const COL = { pend: '#eb6834', atr: '#d03b3b', asig: '#2a78d6', hecho: '#1baf7a', gris: '#B5AFA6' };
const RE_ENTREGA = /entrega|cambio/i;

const st = {
  munis: new Set(), q: '',  // filtros por municipio y búsqueda (sin controles por ahora)
  ingDia: null,             // fecha elegida en la pestaña Ingreso (por defecto hoy)
  infDia: null,             // día elegido en Informe realizados (por defecto ayer)
};
let D, HOY, HOYk;

// ── utilidades ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString('es-UY', { maximumFractionDigits: 1 });
const pad = n => String(n).padStart(2, '0');
const clave = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const desdeClave = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const sumarDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diaISO = d => (d.getDay() + 6) % 7 + 1;
const fCorta = d => d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}` : '';
const fHora = d => d ? `${fCorta(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
const diasEntre = (a, b) => Math.round((b - a) / 864e5);
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const nomTransp = t => (t || '').replace(/-\d+$/, '').trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function preparar(json) {
  const ix = Object.fromEntries(json.columnas.map((c, i) => [c, i]));
  const filas = json.registros.map(a => {
    const r = {};
    for (const c in ix) r[c] = a[ix[c]];
    r.fSolD = r.fSol ? new Date(r.fSol) : null;
    r.fGesD = r.fGes ? new Date(r.fGes) : null;
    r.solK = r.fSolD ? clave(r.fSolD) : '';
    r.gesK = r.fGesD ? clave(r.fGesD) : '';
    r.entrega = RE_ENTREGA.test(r.nota);
    r.pendiente = r.estado === 'Nuevo' || r.estado === 'Asignado';
    r.txt = norm([r.dir, r.edif, r.transp, r.nota, r.obs, r.mun].join(' '));
    return r;
  });
  const gen = new Date(json.generado);
  // "Hoy" va según el reloj de Montevideo: generado es la fecha más nueva de los datos,
  // y a primera hora todavía no hay solicitudes del día (quedaba en ayer)
  HOYk = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Montevideo' });
  HOY = desdeClave(HOYk);
  // Atraso igual que la hoja "Atrasados": semanas desde el último día de
  // servicio del municipio anterior a hoy (si hoy es el día, cuenta el de la semana pasada).
  // A diferencia de la planilla, también cuentan las entregas y cambios (pedido del usuario).
  for (const r of filas) {
    r.semanas = null;
    if (r.estado !== 'Nuevo' || !r.fSolD) continue;
    const delta0 = ((diaISO(HOY) - (DIA_SERVICIO[r.mun] || 1)) % 7 + 7) % 7;
    const prev = sumarDias(HOY, -(delta0 === 0 ? 7 : delta0));
    const d = desdeClave(r.solK);
    r.semanas = d >= prev ? 0 : Math.min(4, Math.ceil(diasEntre(d, prev) / 7));
  }
  return { filas, calendario: [], generado: gen };
}

// ── filtros ─────────────────────────────────────────────────────────────────
const pasaMuni = r => !st.munis.size || st.munis.has(r.mun);
const pasaQ = r => !st.q || r.txt.includes(st.q);
const base = () => D.filas.filter(r => pasaMuni(r) && pasaQ(r));

// ── conjuntos que replican las hojas de la planilla ─────────────────────────
function conjuntos() {
  const B = base();
  return {
    B,
    pendientes: B.filter(r => r.pendiente),
    atrasados: B.filter(r => r.semanas >= 1).sort((a, b) => a.fSolD - b.fSolD),
  };
}

// ── semana ──────────────────────────────────────────────────────────────────

function renderSemana(C) {
  // El calendario es fijo: "Hoy" va según el reloj, no según la fecha de la copia de datos
  const hoyIso = diaISO(new Date());
  $('semana').innerHTML = D.calendario.slice(0, 6).map((c, i) => {
    const fijos = c.vaciadosFijos || [];
    return `<div class="dia ${i + 1 === hoyIso ? 'hoy' : ''}">
      <div class="dia-n"><span>${DIAS[i]}</span>${i + 1 === hoyIso ? '<span class="dia-hoy">Hoy</span>' : ''}</div>
      <div class="dia-sec dia-sec-cols"><span>Municipios</span><svg class="dia-fl" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg><span>Descarga</span></div>
      <div class="dia-rows">${c.municipios.map(x => `
        ${chipMuni(x.municipio, true)}
        <svg class="dia-fl" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
        <span class="dia-p">${esc(x.planta)}</span>`).join('')}
      </div>
      <div class="dia-sec sig">Vaciados fijos</div>
      <div class="dia-fijos">${fijos.length ? fijos.map(v => `
        <div class="fv" style="--c:${COLOR_MUNI[v.municipio] || COL.gris}">
          <span class="mb">${esc(v.municipio)}</span>
          <div class="fv-n">${esc(v.nombre)}</div>
        </div>`).join('') : '<div class="dia-vacio">Sin vaciados fijos</div>'}
      </div></div>`;
  }).join('');
}

// ── ficha de un punto del mapa ──────────────────────────────────────────────
// Operación del día e Informe realizados. Arriba de la línea, igual que la ficha de Pendientes
// (dirección, edificio y tipo, municipio en su renglón); abajo, el estado, la fecha de gestión y el
// transportista (pedido del 05/11)
function fichaHTML(r) {
  const estado = r.estado === 'Nuevo' && r.semanas >= 1 ? ['Atrasado ' + (r.semanas >= 4 ? '4+ sem.' : r.semanas + ' sem.'), COL.atr, '#F9E1E0']
    : r.estado === 'Nuevo' ? ['Nuevo', COL.pend, '#FCE9DF']
    : r.estado === 'Asignado' ? ['Asignado', COL.asig, '#E1ECFA'] : [r.estado, '#0f7a55', '#DDF3EA'];
  const fila = (k, v) => v || v === 0 ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
  const transp = r.transp === '-' ? '' : nomTransp(r.transp);
  const datos = fila('Fecha de gestión', r.fGesD ? fHora(r.fGesD) : '') + fila('Transportista', transp);
  return fichaArriba(r) + `
    <div style="margin-bottom:.5rem"><span class="est" style="--c:${estado[1]};--bg-c:${estado[2]}">${esc(estado[0])}</span></div>
    ${datos ? `<dl>${datos}</dl>` : ''}`;
}

// Lo de arriba de la línea gris, igual en todas las fichas: dirección, edificio y tipo, y el municipio
function fichaArriba(r) {
  const edif = [r.edif && norm(r.edif) !== norm(r.dir) ? r.edif : '', r.tipoEdif].filter(Boolean).join(' · ');
  return `<button class="ficha-x" aria-label="Cerrar">×</button>
    <h3>${esc(r.dir)}</h3>
    ${edif ? `<div class="sub">${esc(edif)}</div>` : ''}
    <div class="sub" style="margin-top:6px">${chipMuni(r.mun, true)}</div>
    <hr>`;
}

// ── mapa y seguimiento de un día (Operación del día = hoy, Informe realizados = un día pasado) ──
// Las dos pestañas muestran lo mismo; cada una tiene su propio mapa, gráficas y tabla (prefijo p en los id).
// arriba: lo que va primero en el panel de la izquierda (en Informe, la fecha).
// conGraficas: las tres gráficas van solo en Informe realizados
function vistaHTML(p, arriba = '', conGraficas = true) {
  return `
  <div class="card mapa-card mapa-op pen-card">
    <aside class="pen-lado vista-lado">${arriba}<div class="op-munis" id="${p}Munis"></div><div class="seg seg-modo" id="${p}Modo"></div><div class="toggles" id="${p}Toggles"></div><div class="ley" id="${p}Ley"></div></aside>
    <div class="pen-mapa"><div class="mapa" id="${p}Mapa"></div><div class="ficha" id="${p}Ficha"></div></div>
  </div>
  ${conGraficas ? `<section class="graficas tres" style="margin-top:14px">
    <div class="card g g-col">
      <div class="g-h"><div class="g-t">Solicitudes por transportista</div></div>
      <div class="g-c"><canvas id="${p}Transp"></canvas></div>
      <div class="g-tot" id="${p}TranspTot"></div>
    </div>
    <div class="card g g-col">
      <div class="g-h"><div class="g-t">Bolsones por transportista</div></div>
      <div class="g-c"><canvas id="${p}BolT"></canvas></div>
      <div class="g-tot" id="${p}BolTTot"></div>
    </div>
    <div class="card g g-col">
      <div class="g-h"><div class="g-t">Bolsones por planta</div></div>
      <div class="g-c"><canvas id="${p}Planta"></canvas></div>
      <div class="g-tot" id="${p}PlantaTot"></div>
    </div>
  </section>` : ''}
  <section class="card atr-card" style="margin-top:14px">
    <div class="tabla-wrap"><table class="tabla tabla-ges" id="${p}Tabla"></table></div>
  </section>`;
}

// dia() da la clave del día que muestra la vista; nombre() lo que va antes de los municipios.
// pasado: en un día que ya pasó no se puede saber qué estaba asignado, así que no hay grupo Asignados,
// y no se muestra el día ni el aviso de "no hay municipios" (la fecha ya está en el selector)
function crearVista(p, contenedor, dia, nombre, pasado = false, arriba = '') {
  $(contenedor).innerHTML = vistaHTML(p, arriba, pasado);
  return { p, dia, nombre, pasado, mapa: null, capa: null, marc: new Map(), sel: null, encuadrar: false,
    grupo: (r, d) => r.gesK === d ? 'realizados' : !pasado && r.estado === 'Asignado' ? 'asignados' : 'pendientes',
    modo: 'estado',      // 'estado' o 'transp' (selector arriba a la derecha del mapa)
    ocultos: new Set(), // transportistas apagados en el filtro (arranca con todos prendidos)
    verPend: true,     // pendientes visibles en el modo Transportistas
    verTipo: { realizados: true, asignados: true }, // filtro de la referencia de círculos (modo Transportistas)
    rend: L.canvas({ padding: .3 }), // cada mapa necesita su propio dibujador
    ver: { realizados: true, asignados: true, pendientes: true } };
}
const VOp = crearVista('op', 'vOp', () => HOYk, () => ''); // "Hoy" se sobreentiende
const VInf = crearVista('inf', 'vInf', () => st.infDia, () => '', true,
  `<div class="lado-fecha"><label class="ing-f">Fecha <input type="date" id="infDia"></label></div>`);

// Hoja "Realizar hoy": municipios que se atienden ese día según el calendario, solicitudes Nuevo o
// Asignado de antes de ese día. Se suman las que se gestionaron ese día en esos municipios.
// En un día pasado, lo que se gestionó después estaba pendiente en ese momento.
// Un día sin servicio (domingo) no tiene pendientes: solo lo que se gestionó igual ese día.
// Con gestión ese día = realizado, aunque siga "Asignado" sin cerrar (igual que la hoja "Informe realizados")
// otros: también lo realizado y lo asignado en municipios que no tocan ese día (solo Operación del día,
// pedido del 05/11: que se vea si se trabajó o se asignó algo fuera del calendario). Los pendientes
// siguen siendo solo los de los municipios del día.
const munisDe = dia => (D.calendario[diaISO(desdeClave(dia)) - 1]?.municipios || []).map(x => x.municipio);
const realizarDia = (dia, munis, otros = false) => base().filter(r =>
  (munis.length && munis.includes(r.mun) && (r.gesK === dia || (r.solK < dia && (r.pendiente || r.gesK > dia))))
  || ((otros || !munis.length) && r.gesK === dia)
  || (otros && r.estado === 'Asignado'));

function renderVista(v) {
  renderSeguimiento(v); renderMapa(v);
}

// Dos formas de ver el mapa (selector arriba a la derecha):
//  - Estado: cada punto con el color de su estado y los botones Realizados / Asignados / Pendientes.
//  - Transportistas: cada transportista con su color (realizados rellenos, asignados con borde);
//    los pendientes en naranja. Se puede filtrar por transportista.
// Las líneas que unían los puntos de cada transportista están apagadas a prueba (CON_LINEAS).
const CON_LINEAS = false;
// Número de orden en los realizados del modo Transportistas (Operación del día e Informe realizados)
const CON_NUMEROS = true;
// El mapa se crea recién cuando la pestaña está visible (Leaflet necesita tamaño real).
// Devuelve true la primera vez, para encuadrar los puntos.
function prepararMapa(v) {
  if (v.mapa) { v.mapa.invalidateSize(); return false; }
  // Sin botones de zoom (se hace con la rueda) ni el texto de créditos de abajo a la derecha.
  // zoomSnap en cuartos: al encuadrar los puntos el mapa se acerca lo justo, sin dejar tanto borde vacío
  v.mapa = L.map(v.p + 'Mapa', { zoomControl: false, attributionControl: false, preferCanvas: true, zoomSnap: .25 }).setView([-34.86, -56.16], 12);
  L.tileLayer(SupervisionMapa.teselas, {
    maxNativeZoom: 18, maxZoom: 20, subdomains: 'abcd',
  }).addTo(v.mapa);
  v.capa = L.layerGroup().addTo(v.mapa);
  v.mapa.on('click', () => cerrarFicha(v));
  return true;
}

function renderMapa(v) {
  const p = v.p;
  if (!$(p + 'Mapa').offsetWidth) return;
  const primera = prepararMapa(v);
  const dia = v.dia(), munis = munisDe(dia), todos = realizarDia(dia, munis, !v.pasado);
  const nom = v.nombre();
  // Sin etiquetas de municipio (pedido del usuario); solo se avisa si ese día no hay servicio
  $(p + 'Munis').innerHTML = munis.length ? esc(nom) : (nom ? nom + ': no' : 'No') + ' hay municipios de servicio';
  $(p + 'Munis').hidden = v.pasado || (munis.length && !nom);

  $(p + 'Modo').innerHTML = [['estado', 'Estado'], ['transp', 'Transportistas']]
    .map(([k, l]) => `<button class="${v.modo === k ? 'on' : ''}" data-m="${k}">${l}</button>`).join('');
  $(p + 'Modo').querySelectorAll('button').forEach(b => b.onclick = () => { v.modo = b.dataset.m; v.encuadrar = true; renderVista(v); });

  // Operación del día, modo Transportistas: abajo de los filtros, qué es cada círculo. También filtra
  // (como los demás: el primer toque deja solo ese), para ver por ejemplo solo los asignados
  $(p + 'Ley').innerHTML = v.modo === 'transp' && !v.pasado
    ? [['realizados', '', 'Realizado'], ['asignados', 'asig', 'Asignado']]
      .map(([k, c, l]) => `<button class="tg ${v.verTipo[k] ? '' : 'off'}" data-k="${k}"><i class="${c}"></i>${l}</button>`).join('') : '';
  // Al dejar solo uno, arriba quedan prendidos solo los transportistas que tienen de eso (y los pendientes
  // apagados); con los dos, vuelven todos
  $(p + 'Ley').querySelectorAll('button').forEach(b => b.onclick = () => {
    elegirFiltro(['realizados', 'asignados'], k => v.verTipo[k], (k, si) => v.verTipo[k] = si, b.dataset.k);
    const ambos = v.verTipo.realizados && v.verTipo.asignados;
    v.ocultos = new Set(ambos ? [] : Object.keys(v.porT || {}).filter(t => !v.porT[t][v.verTipo.asignados ? 'asignados' : 'realizados'].length));
    v.verPend = ambos;
    v.encuadrar = true;
    renderVista(v);
  });

  v.capa.clearLayers(); v.marc.clear();
  const P = v.modo === 'transp' ? mapaTransportistas(v, todos, dia, munis.length) : mapaEstado(v, todos, dia, munis.length);
  // Los botones del panel pueden haber cambiado el alto de la tarjeta (y con él el del mapa)
  v.mapa.invalidateSize();
  // Al abrir, al cambiar de día, de modo o de filtro, el mapa se acomoda a los puntos
  if ((primera || v.encuadrar) && P.length) v.mapa.fitBounds(L.latLngBounds(P.map(r => [r.lat, r.lng])), { padding: [30, 30] });
  v.encuadrar = false;
  if (v.sel) { if (v.marc.has(v.sel.id)) seleccionar(v, v.sel); else cerrarFicha(v); }
}

// ── pestaña Pendientes: todas las solicitudes en estado Nuevo ────────────────
// Cada punto con el color de su municipio (los de la hoja Indicadores). A la izquierda del mapa, un
// panel con el total y cuántas hay por municipio (solo informativo).
const VPen = { p: 'pen', mapa: null, capa: null, marc: new Map(), sel: null, encuadrar: false,
  rend: L.canvas({ padding: .3 }), ficha: fichaPendiente };

function renderPendientes() {
  const v = VPen;
  if (!$('penMapa').offsetWidth) return;
  const primera = prepararMapa(v);
  const nuevos = base().filter(r => r.estado === 'Nuevo' && r.lat && r.lng);
  const n = {};
  for (const r of nuevos) n[r.mun] = (n[r.mun] || 0) + 1;

  // Municipios en el orden en que se atienden en la semana (según el calendario): B F A G E C D CH
  const orden = [...new Set(D.calendario.flatMap(c => c.municipios.map(x => x.municipio)))].filter(m => MUNIS.includes(m));
  $('penLado').innerHTML = `
    <div class="pen-tot"><span>Total</span><b class="num">${nuevos.length}</b></div>
    ${orden.map(m => `<div class="pen-fila" style="--c:${COLOR_MUNI[m]}"><span>Municipio ${m}</span><b class="num">${n[m] || 0}</b></div>`).join('')}`;

  v.capa.clearLayers(); v.marc.clear();
  for (const r of nuevos) punto(v, r, COLOR_MUNI[r.mun] || COL.gris);
  // Al abrir, el mapa se centra para que entren todos los puntos. Se repite en el cuadro siguiente,
  // cuando la página ya terminó de acomodarse, por si el mapa cambió de tamaño al aparecer.
  if (primera && nuevos.length) {
    const encuadrar = () => v.mapa.fitBounds(L.latLngBounds(nuevos.map(r => [r.lat, r.lng])), { padding: [24, 24], maxZoom: 15 });
    encuadrar();
    requestAnimationFrame(() => { v.mapa.invalidateSize(); encuadrar(); });
  }
  if (v.sel) { if (v.marc.has(v.sel.id)) seleccionar(v, v.sel); else cerrarFicha(v); }
}

// Ficha de un punto de Pendientes: sin etiqueta de estado (todos son Nuevo), el municipio en su propio
// renglón y solo fecha de solicitud, cantidad de bolsones y observaciones
function fichaPendiente(r) {
  const fila = (k, val) => val || val === 0 ? `<dt>${k}</dt><dd>${esc(val)}</dd>` : '';
  return fichaArriba(r) + `
    <dl>
      ${fila('Fecha de solicitud', r.fSolD ? fHora(r.fSolD) : '')}
      ${fila('Cantidad de bolsones', r.cantSol != null ? fmt(r.cantSol) : '')}
      ${fila('Observaciones', r.nota)}
    </dl>`;
}

// Un punto del mapa. relleno/borde: color de adentro y del contorno
// n: número que va escrito adentro (el punto se agranda para que entre)
function punto(v, r, relleno, borde = '#fff', n = null) {
  const m = L.circleMarker([r.lat, r.lng], {
    renderer: v.rend, radius: n == null ? 6 : 9, color: borde, weight: borde === '#fff' ? 1.5 : 2.5, fillColor: relleno, fillOpacity: .95,
  }).bindTooltip(esc(r.dir), { direction: 'top', offset: [0, -6] })
    .on('click', e => { L.DomEvent.stopPropagation(e); seleccionar(v, r); });
  m.borde = { color: borde, weight: borde === '#fff' ? 1.5 : 2.5 };
  m.addTo(v.capa); v.marc.set(r.id, m);
  // El número va encima y deja pasar el mouse al punto (tooltip y clic siguen siendo del punto)
  if (n != null) L.marker([r.lat, r.lng], { interactive: false, keyboard: false,
    icon: L.divIcon({ className: 'pt-num', html: n, iconSize: [18, 18] }) }).addTo(v.capa);
}

// Filtros del panel izquierdo: arrancan todos prendidos. Con todos prendidos, tocar uno deja solo ese;
// después cada toque suma o saca. Si se apagan todos, vuelven a prenderse todos.
// esta(k): si k está prendido; poner(k, si): lo prende o apaga
function elegirFiltro(claves, esta, poner, k) {
  if (claves.every(esta)) claves.forEach(c => poner(c, c === k));
  else {
    poner(k, !esta(k));
    if (!claves.some(esta)) claves.forEach(c => poner(c, true));
  }
}

// conServicio: el día tiene municipios de servicio (si no, no hay pendientes y no va ese botón)
function mapaEstado(v, todos, dia, conServicio) {
  const p = v.p, grupoDe = v.grupo;
  const n = { realizados: 0, asignados: 0, pendientes: 0 };
  for (const r of todos) n[grupoDe(r, dia)]++;
  const def = [['realizados', 'Realizados', COL.hecho], ['asignados', 'Asignados', COL.asig], ['pendientes', 'Pendientes', COL.pend]]
    .filter(([k]) => !(k === 'asignados' && v.pasado) && !(k === 'pendientes' && !conServicio));
  $(p + 'Toggles').innerHTML = def.map(([k, l, c]) => `<button class="tg ${v.ver[k] ? '' : 'off'}" data-k="${k}" style="--c:${c}"><i></i>${l}<b class="num">${n[k]}</b></button>`).join('');
  $(p + 'Toggles').querySelectorAll('.tg').forEach(b => b.onclick = () => {
    elegirFiltro(def.map(d => d[0]), k => v.ver[k], (k, si) => v.ver[k] = si, b.dataset.k);
    renderVista(v);
  });

  const P = todos.filter(r => r.lat && r.lng && v.ver[grupoDe(r, dia)]);
  const orden = { realizados: 1, asignados: 2, pendientes: 3 };
  const color = { realizados: COL.hecho, asignados: COL.asig, pendientes: COL.pend };
  for (const r of P.sort((a, b) => orden[grupoDe(a, dia)] - orden[grupoDe(b, dia)])) punto(v, r, color[grupoDe(r, dia)]);
  return P;
}

// Colores de los transportistas: ninguno parecido al naranja de los pendientes
const COLOR_TRANSP = ['#6250d6', '#0e7490', '#be185d', '#4d7c0f', '#a16207', '#1e293b', '#b91c1c', '#0284c7', '#a21caf', '#65a30d'];

function mapaTransportistas(v, todos, dia, conServicio) {
  const p = v.p, grupoDe = v.grupo;
  const porT = transportistasDe(v, todos, dia);
  const nombres = Object.keys(porT).sort();
  const colorT = Object.fromEntries(nombres.map((t, i) => [t, COLOR_TRANSP[i % COLOR_TRANSP.length]]));
  const pend = todos.filter(r => grupoDe(r, dia) === 'pendientes' && r.lat && r.lng);
  v.porT = porT; // para que la referencia de círculos sepa quién tiene qué
  // El número de cada transportista cuenta lo que deja ver la referencia de círculos
  const cuenta = t => (v.verTipo.realizados ? porT[t].realizados.length : 0) + (v.verTipo.asignados ? porT[t].asignados.length : 0);
  // En Informe realizados (día pasado) este modo muestra solo transportistas: los pendientes quedan en Estado
  const conPend = conServicio && !v.pasado;

  // Filtro (ver elegirFiltro): los transportistas y, si hay, los pendientes (sin transportista)
  $(p + 'Toggles').innerHTML = nombres.map(t => `<button class="tg ${CON_LINEAS ? 'tg-t' : ''} ${v.ocultos.has(t) ? 'off' : ''}" data-t="${esc(t)}" style="--c:${colorT[t]}"><i></i>${esc(t)}<b class="num">${cuenta(t)}</b></button>`).join('')
    + (conPend ? `<button class="tg ${v.verPend ? '' : 'off'}" data-pend="1" style="--c:${COL.pend}"><i></i>Pendientes<b class="num">${pend.length}</b></button>` : '');
  $(p + 'Toggles').querySelectorAll('.tg').forEach(b => b.onclick = () => {
    // '' = Pendientes (ningún transportista se llama así)
    const claves = [...nombres, ...(conPend ? [''] : [])];
    elegirFiltro(claves, k => k ? !v.ocultos.has(k) : v.verPend,
      (k, si) => k ? (si ? v.ocultos.delete(k) : v.ocultos.add(k)) : v.verPend = si,
      b.dataset.pend ? '' : b.dataset.t);
    v.encuadrar = true;
    renderVista(v);
  });

  const elegidos = nombres.filter(t => !v.ocultos.has(t));
  if (CON_LINEAS) dibujarRecorridos(v, porT, elegidos, colorT);
  const P = [];
  if (conPend && v.verPend) for (const r of pend) { punto(v, r, COL.pend); P.push(r); }
  // Realizados con relleno del color del transportista; asignados con relleno blanco y borde de su color.
  // Cada realizado lleva el orden en que lo hizo ese transportista
  // (la referencia de círculos puede dejar solo realizados o solo asignados)
  const numerar = CON_NUMEROS;
  for (const t of elegidos) {
    if (v.verTipo.asignados) for (const r of porT[t].asignados) { punto(v, r, '#fff', colorT[t]); P.push(r); }
    if (!v.verTipo.realizados) continue;
    const hechos = numerar ? [...porT[t].realizados].sort((a, b) => a.fGesD - b.fGesD) : porT[t].realizados;
    hechos.forEach((r, i) => { punto(v, r, colorT[t], '#fff', numerar ? i + 1 : null); P.push(r); });
  }
  return P;
}

// Realizados y asignados de cada transportista (los pendientes no tienen transportista)
function transportistasDe(v, todos, dia) {
  const porT = {};
  for (const r of todos) {
    const t = nomTransp(r.transp), g = v.grupo(r, dia);
    if (!t || r.transp === '-' || !r.lat || !r.lng || g === 'pendientes') continue;
    ((porT[t] ||= { realizados: [], asignados: [] })[g]).push(r);
  }
  return porT;
}

// Recorrido de cada transportista: línea llena uniendo sus realizados en el orden en que los hizo, y
// desde el último, línea punteada por sus asignados (del más cercano al siguiente más cercano).
// Primero se dibuja en línea recta y en cuanto llega el camino por las calles se reemplaza.
function dibujarRecorridos(v, porT, nombres, colorT) {
  const lejos = (a, b) => (a.lat - b.lat) ** 2 + (a.lng - b.lng) ** 2;
  for (const t of nombres) {
    const hechos = porT[t].realizados.sort((a, b) => a.fGesD - b.fGesD);
    const linea = (pts, punteada) => {
      const ll = pts.map(r => [r.lat, r.lng]);
      const pl = L.polyline(ll, {
        renderer: v.rend, color: colorT[t], weight: 3, opacity: .8, dashArray: punteada ? '6 7' : null,
      }).bindTooltip(esc(t), { sticky: true }).addTo(v.capa);
      porCalles(ll).then(camino => { if (camino && v.capa.hasLayer(pl)) pl.setLatLngs(camino); });
    };
    if (hechos.length > 1) linea(hechos, false);
    if (!porT[t].asignados.length) continue;
    // Orden de los asignados: siempre al más cercano, arrancando desde el último realizado
    const falta = [...porT[t].asignados], ruta = [];
    let actual = hechos.at(-1) || null;
    if (actual) ruta.push(actual);
    while (falta.length) {
      const k = actual ? falta.reduce((m, r, j) => lejos(r, actual) < lejos(falta[m], actual) ? j : m, 0) : 0;
      actual = falta.splice(k, 1)[0]; ruta.push(actual);
    }
    if (ruta.length > 1) linea(ruta, true);
  }
}

// Camino por las calles entre los puntos, del servidor público de OSRM (gratis, pide no más de un
// pedido por segundo). Va en tramos de hasta 25 puntos. Se guarda por sesión para no volver a pedirlo;
// si falla, la línea queda recta.
const OSRM = 'https://router.project-osrm.org/route/v1/driving/';
const caminos = new Map();
let proximoPedido = 0;
function porCalles(ll) {
  const k = ll.map(([a, b]) => `${b.toFixed(5)},${a.toFixed(5)}`).join(';');
  if (!caminos.has(k)) {
    let guardado = null;
    try { guardado = JSON.parse(sessionStorage.getItem('camino:' + k)); } catch {}
    caminos.set(k, guardado ? Promise.resolve(guardado) : pedirCamino(ll).then(c => {
      try { sessionStorage.setItem('camino:' + k, JSON.stringify(c)); } catch {}
      return c;
    }).catch(() => { caminos.delete(k); return null; }));
  }
  return caminos.get(k);
}
async function pedirCamino(ll) {
  const camino = [];
  for (let i = 0; i < ll.length - 1; i += 24) {
    const tramo = ll.slice(i, i + 25);
    const espera = proximoPedido - Date.now();
    proximoPedido = Math.max(Date.now(), proximoPedido) + 1100;
    if (espera > 0) await new Promise(r => setTimeout(r, espera));
    const res = await fetch(OSRM + tramo.map(([a, b]) => `${b.toFixed(5)},${a.toFixed(5)}`).join(';') + '?overview=full&geometries=geojson');
    const j = await res.json();
    if (j.code !== 'Ok') throw new Error(j.code);
    camino.push(...j.routes[0].geometry.coordinates.map(([b, a]) => [a, b]));
  }
  return camino;
}

function seleccionar(v, r) {
  v.sel = r;
  v.marc.forEach((m, id) => m.setStyle(id === r.id ? { color: tinta(), weight: 3 } : m.borde));
  v.marc.get(r.id)?.bringToFront();
  const f = $(v.p + 'Ficha');
  f.innerHTML = (v.ficha || fichaHTML)(r);
  f.classList.add('on');
  f.querySelector('.ficha-x').onclick = () => cerrarFicha(v);
}
function cerrarFicha(v) {
  v.sel = null; $(v.p + 'Ficha').classList.remove('on');
  v.marc.forEach(m => m.setStyle(m.borde));
}

// ── gráficas ────────────────────────────────────────────────────────────────
Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif";
Chart.defaults.font.size = 12;
// Modo oscuro (12/11): textos y barras azules toman los colores del tema al dibujarse
const oscuro = () => document.documentElement.dataset.theme === 'dark';
const tinta = () => oscuro() ? '#ECEAE6' : '#1A1714';
Chart.defaults.color = () => oscuro() ? '#B3ADA5' : '#5F5A54';
Chart.defaults.plugins.tooltip.enabled = false; // sin etiquetas negras al pasar el mouse
const graficas = {};
const AZUL_BARRA = () => oscuro() ? '#5b84c4' : '#1b3f74'; // el azul de la barra del título (más claro en oscuro)
window.addEventListener('com2:tema', () => Object.values(graficas).forEach(g => g?.update('none')));

function grafica(id, cfg, vacio) {
  graficas[id]?.destroy();
  const cont = $(id).parentElement;
  cont.querySelector('.g-vacio')?.remove();
  if (vacio) { cont.insertAdjacentHTML('beforeend', '<div class="g-vacio">Sin datos</div>'); graficas[id] = null; return; }
  graficas[id] = new Chart($(id), cfg);
}

// Escribe el total al final de cada barra (suma de todas las series de esa fila)
const totalAlFinal = {
  id: 'totalAlFinal',
  afterDatasetsDraw(chart) {
    const { ctx } = chart, metas = chart.data.datasets.map((_, i) => chart.getDatasetMeta(i));
    ctx.save();
    ctx.font = `600 12px ${Chart.defaults.font.family}`;
    ctx.fillStyle = tinta();
    ctx.textBaseline = 'middle';
    chart.data.labels.forEach((_, i) => {
      const total = chart.data.datasets.reduce((s, d) => s + (d.data[i] || 0), 0);
      const fin = Math.max(...metas.map(m => m.data[i]?.x ?? 0));
      ctx.fillText(fmt(total), fin + 6, metas[0].data[i].y);
    });
    ctx.restore();
  },
};

// Si la gráfica tiene un total abajo (id + 'Tot'), lo alinea: "Total" termina donde terminan los nombres
// y el número arranca donde arrancan las barras; se repite cada vez que la gráfica cambia de tamaño
const alinearTotal = {
  id: 'alinearTotal',
  afterLayout(chart) {
    const el = document.getElementById(chart.canvas.id + 'Tot');
    if (el) el.style.gridTemplateColumns = `${chart.chartArea.left}px 1fr`;
  },
};

// Barras horizontales sin líneas de fondo ni números abajo: el valor va escrito al final de cada barra
// Nombres largos ("Gerardo Albano & Brian Albano") en dos renglones, cortando en el espacio más cercano a la mitad
const partirNombre = s => {
  if (s.length <= 16) return s;
  const esp = [...s.matchAll(/ /g)].map(m => m.index);
  if (!esp.length) return s;
  const corte = esp.reduce((m, i) => Math.abs(i - s.length / 2) < Math.abs(m - s.length / 2) ? i : m);
  return [s.slice(0, corte), s.slice(corte + 1)];
};

function barrasH(id, etiquetas, series) {
  const dos = etiquetas.some(e => partirNombre(e) !== e);
  // Alto justo para las barras (sin lugar vacío arriba); vacía, un renglón para el "Sin datos", así
  // las tres tarjetas no quedan con blanco de más cuando hay pocos datos
  $(id).parentElement.style.height = (etiquetas.length ? etiquetas.length * (dos ? 36 : 30) : 40) + 'px';
  grafica(id, {
    type: 'bar',
    data: { labels: etiquetas.map(partirNombre), datasets: series.map(s => ({ borderRadius: 4, borderSkipped: false, maxBarThickness: 18, categoryPercentage: .8, barPercentage: .9, ...s })) },
    options: {
      indexAxis: 'y', maintainAspectRatio: false, animation: { duration: 250 },
      layout: { padding: { right: 36 } }, // lugar para el total
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false, stacked: true, beginAtZero: true },
        // Sin el margen que Chart.js deja arriba y abajo para los nombres: cada nombre entra en su renglón
        y: { stacked: true, grid: { display: false }, border: { display: false }, ticks: { padding: 6 },
          afterFit: s => { s.paddingTop = 0; s.paddingBottom = 0; } },
      },
    },
    plugins: [totalAlFinal, alinearTotal],
  }, !etiquetas.length);
}

// ── seguimiento de gestiones: misma lógica que la hoja "Seguimiento gestiones" ──
// Gestiones con fecha de gestión en el día de la vista, ordenadas por transportista y hora.
// Arriba tres gráficas; abajo el detalle de cada gestión.

function renderSeguimiento(v) {
  const p = v.p;
  const transp = r => r.transp === '-' ? '' : nomTransp(r.transp);
  // Lo mismo que muestra el filtro del mapa: en Estado, nada si Realizados está apagado;
  // en Transportistas, sin los transportistas apagados
  // (y si la referencia de círculos deja solo asignados, la tabla queda vacía: son todas gestiones hechas)
  const pasa = r => v.modo === 'transp' ? !v.ocultos.has(nomTransp(r.transp)) && v.verTipo.realizados : v.ver.realizados;
  // Orden de la hoja: por transportista y después por fecha de gestión (los sin transportista al final)
  const G = base().filter(r => r.gesK === v.dia() && pasa(r))
    .sort((a, b) => (!transp(a) - !transp(b)) || transp(a).localeCompare(transp(b)) || a.fGesD - b.fGesD);

  // Suma por categoría, de mayor a menor
  const agrupar = (clave, valor) => {
    const t = {};
    for (const r of G) { const k = clave(r); if (k) t[k] = (t[k] || 0) + valor(r); }
    return Object.entries(t).sort((a, b) => b[1] - a[1]);
  };
  // Abajo de cada gráfica, la suma de sus barras (nada si está vacía)
  const barras = (id, filas, color) => {
    barrasH(p + id, filas.map(x => x[0]), [{ data: filas.map(x => x[1]), backgroundColor: color }]);
    const tot = filas.reduce((s, x) => s + x[1], 0);
    $(p + id + 'Tot').innerHTML = filas.length ? `<span>Total</span><b class="num">${fmt(tot)}</b>` : '';
  };

  // Las gráficas solo están en Informe realizados
  if ($(p + 'Transp')) {
    // Cuántas solicitudes gestionó cada transportista (con o sin bolsones)
    barras('Transp', agrupar(transp, () => 1), AZUL_BARRA);
    // "Cantidad transportada" sumada por transportista y por planta
    barras('BolT', agrupar(transp, r => r.cantT || 0).filter(x => x[1] > 0), AZUL_BARRA);
    barras('Planta', agrupar(r => r.planta, r => r.cantT || 0).filter(x => x[1] > 0), AZUL_BARRA);
  }

  tablaGestiones(p + 'Tabla', G, 'No hay gestiones ese día');
}

// Detalle de gestiones: mismas columnas y en el mismo orden que la hoja "Seguimiento gestiones".
// La usan Operación del día, Informe realizados y el Buscador de dirección.
// conSolicitud: suma "Edificio" y "Fecha de solicitud" después de la dirección (solo el Buscador; la
// fecha con el año porque ahí aparecen solicitudes de cualquier momento)
function tablaGestiones(id, G, vacio, conSolicitud = false) {
  const transp = r => r.transp === '-' ? '' : nomTransp(r.transp);
  const cab = ['Municipio', 'Dirección completa', ...(conSolicitud ? ['Edificio', 'Fecha de solicitud'] : []), 'Datos de solicitud', 'Gestión', 'Cantidad bolsones', 'Tipo bolsón', 'Fecha de gestión', 'Observaciones', 'Transportista', 'Planta', 'Cantidad transportada', 'Hora'];
  const fSol = d => d ? `${fCorta(d)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
  $(id).innerHTML = `<thead><tr>${cab.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${G.length ? G.map(r => `<tr>
      <td>${chipMuni(r.mun)}</td>
      <td class="dir">${esc(r.dir)}</td>
      ${conSolicitud ? `<td class="obs">${esc(r.edif)}</td><td class="hora">${fSol(r.fSolD)}</td>` : ''}
      <td class="desc">${esc(r.nota)}</td>
      <td>${esc(r.gestion)}</td>
      <td class="num">${r.cantB != null ? fmt(r.cantB) : ''}</td>
      <td>${esc(r.tipoB)}</td>
      <td class="hora">${fHora(r.fGesD)}</td>
      <td class="obs">${esc(r.obs)}</td>
      <td class="obs">${esc(transp(r))}</td>
      <td>${esc(r.planta)}</td>
      <td class="num">${r.cantT ? fmt(r.cantT) : ''}</td>
      <td class="hora">${esc(r.hora)}</td></tr>`).join('')
    : `<tr><td colspan="${cab.length}" class="at-vacio">${vacio}</td></tr>`}</tbody>`;
}

// ── Buscador de dirección: todas las solicitudes de una dirección ──
// Mientras se escribe, abajo del campo aparecen las direcciones que coinciden (por dirección o por
// edificio; cada palabra tiene que aparecer, sin importar tildes ni mayúsculas). Al elegir una, la tabla
// muestra todas las solicitudes de esa dirección, de la más vieja a la más nueva.
const BUS_MAX = 12; // opciones en la lista
let busOpc = [], busSel = -1;

// En una misma dirección puede haber edificios distintos: cada uno va como opción aparte.
// claveEdif junta las formas de escribir el mismo nombre ("Spazio IV" = "EDIFICIO SPAZIO IV").
// Si el edificio está vacío, es solo "Edificio" o repite la dirección, queda sin nombre ('').
const limpiarEdif = s => norm(s).replace(/[^a-z0-9ñ]+/g, ' ').replace(/\b(edificio|edficio|edif|ed)\b/g, ' ').replace(/\s+/g, ' ').trim();
function claveEdif(r) {
  const e = limpiarEdif(r.edif);
  return !e || limpiarEdif(r.dir).includes(e) ? '' : e;
}

// Direcciones (y edificios) que coinciden con lo escrito, con cuántas solicitudes tiene cada una
function opcionesBuscador(texto) {
  const q = norm(texto).split(/[\s·]+/).filter(Boolean);
  if (q.join('').length < 3) return [];
  const porDir = new Map();
  for (const r of base()) {
    if (!r.dir || !q.every(w => norm(r.dir + ' ' + r.edif).includes(w))) continue;
    const clave = r.dir + '|' + claveEdif(r);
    const o = porDir.get(clave) || { dir: r.dir, clave: claveEdif(r), mun: r.mun, nombres: new Map(), n: 0 };
    // Como nombre se muestra la forma más usada
    if (o.clave) o.nombres.set(r.edif, (o.nombres.get(r.edif) || 0) + 1);
    o.n++;
    porDir.set(clave, o);
  }
  const ops = [...porDir.values()];
  // Cuántos edificios distintos hay en cada dirección, para avisar en las que tienen más de uno
  const edifPorDir = new Map();
  for (const o of ops) {
    o.edif = o.clave ? [...o.nombres].sort((a, b) => b[1] - a[1])[0][0] : '';
    edifPorDir.set(o.dir, (edifPorDir.get(o.dir) || 0) + 1);
  }
  for (const o of ops) o.varios = edifPorDir.get(o.dir) > 1;
  // Primero las que empiezan con lo escrito y después las de más solicitudes;
  // los edificios de una misma dirección quedan juntos
  const empieza = o => norm(o.dir).startsWith(q[0]) ? 0 : 1;
  const totDir = new Map();
  for (const o of ops) totDir.set(o.dir, (totDir.get(o.dir) || 0) + o.n);
  return ops.sort((a, b) => empieza(a) - empieza(b) || totDir.get(b.dir) - totDir.get(a.dir) || a.dir.localeCompare(b.dir) || b.n - a.n);
}

function listaBuscador() {
  busOpc = opcionesBuscador($('busQ').value);
  busSel = -1;
  const ver = busOpc.slice(0, BUS_MAX);
  $('busLista').innerHTML = !busOpc.length ? (norm($('busQ').value).replace(/\s/g, '').length >= 3 ? '<div class="bus-nada">No se encontró esa dirección</div>' : '')
    : ver.map((o, i) => {
        const edif = o.edif || (o.varios ? 'Sin nombre de edificio' : '');
        return `<button type="button" data-i="${i}">${chipMuni(o.mun)}<span class="bus-dir">${esc(o.dir)}${edif ? `<small>${esc(edif)}</small>` : ''}</span><b class="num">${o.n}</b></button>`;
      }).join('')
      + (busOpc.length > BUS_MAX ? `<div class="bus-nada">y ${busOpc.length - BUS_MAX} más: seguí escribiendo</div>` : '');
  $('busLista').hidden = !$('busLista').innerHTML;
  $('busLista').querySelectorAll('button').forEach(b => b.onmousedown = e => { e.preventDefault(); elegirDir(busOpc[+b.dataset.i]); });
}

function elegirDir(o) {
  st.busDir = o.dir;
  st.busEdif = o.clave;
  $('busQ').value = o.dir + (o.edif ? ' · ' + o.edif : '');
  $('busLista').hidden = true;
  renderBuscador();
}

// Hasta que se elige una dirección no se muestra la tabla
function renderBuscador() {
  $('busTabla').parentElement.hidden = !st.busDir;
  if (!st.busDir) { $('busTot').textContent = ''; return; }
  // De la solicitud más vieja a la más nueva
  const R = base().filter(r => r.dir === st.busDir && claveEdif(r) === st.busEdif).sort((a, b) => (a.fSolD || 0) - (b.fSolD || 0));
  $('busTot').innerHTML = `<b class="num">${R.length}</b> ${R.length === 1 ? 'solicitud' : 'solicitudes'}`;
  tablaGestiones('busTabla', R, 'No hay solicitudes en esa dirección', true);
}

let busEspera;
$('busQ').oninput = () => {
  // Al cambiar lo escrito se deja de mostrar la dirección elegida hasta elegir otra
  if (st.busDir) { st.busDir = null; renderBuscador(); }
  clearTimeout(busEspera); busEspera = setTimeout(listaBuscador, 150);
};
$('busQ').onfocus = () => { if (!st.busDir) listaBuscador(); };
$('busQ').onblur = () => { $('busLista').hidden = true; };
// Flechas para moverse en la lista, Enter para elegir, Escape para cerrarla
$('busQ').onkeydown = e => {
  const bots = [...$('busLista').querySelectorAll('button')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!bots.length) return;
    e.preventDefault();
    busSel = (busSel + (e.key === 'ArrowDown' ? 1 : -1) + bots.length) % bots.length;
    bots.forEach((b, i) => b.classList.toggle('sel', i === busSel));
    bots[busSel].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    const o = busOpc[busSel >= 0 ? busSel : 0];
    if (o && !$('busLista').hidden) { e.preventDefault(); elegirDir(o); }
  } else if (e.key === 'Escape') $('busLista').hidden = true;
};

// Informe realizados: solo días anteriores a hoy (hoy está en Operación del día). Por defecto, ayer.
function renderInfDia() {
  const inp = $('infDia');
  inp.min = D.filas.map(r => r.gesK).filter(Boolean).sort()[0];
  inp.max = clave(sumarDias(HOY, -1));
  if (!st.infDia) st.infDia = inp.max;
  inp.value = st.infDia;
}
$('infDia').onchange = e => {
  // Sin fecha o fuera de rango vuelve a ayer
  const k = e.target.value;
  st.infDia = k && k >= e.target.min && k <= e.target.max ? k : e.target.max;
  e.target.value = st.infDia;
  VInf.encuadrar = true;
  VInf.ocultos.clear();
  cerrarFicha(VInf);
  renderVista(VInf);
};

// ── render general ──────────────────────────────────────────────────────────
function render() {
  const C = conjuntos();
  renderSemana(C); renderPendientes(); renderInfDia(); renderVista(VOp); renderVista(VInf); renderAtrasados(C); renderBorrar(C); renderIngreso(); renderBuscador();
}

// ── pestaña Atrasados: misma tabla y detalle que la hoja "Atrasados" ────────
function renderAtrasados(C) {
  // Solicitudes en estado Nuevo con al menos una semana de atraso (r.semanas viene de preparar()).
  // Las entregas y cambios se muestran igual que los vaciados, sin ninguna marca aparte.
  const atr = C.B.filter(r => r.semanas >= 1);
  // Municipios en el orden en que se atienden en la semana (según el calendario): B F A G E C D CH
  const orden = [...new Set(D.calendario.flatMap(c => c.municipios.map(x => x.municipio)).filter(m => MUNIS.includes(m)))];
  const det = C.atrasados.slice().sort((a, b) => orden.indexOf(a.mun) - orden.indexOf(b.mun) || a.fSolD - b.fSolD);

  // Matriz semanas × municipio. Las casillas con atrasados van en el azul de la barra, más intenso cuantos más hay
  const max = Math.max(1, ...orden.flatMap(m => [1, 2, 3, 4].map(i => atr.filter(r => r.mun === m && r.semanas === i).length)));
  let html = `<div class="hm-h izq"></div>${orden.map(m => `<div class="hm-h">${chipMuni(m)}</div>`).join('')}`;
  ATRASO.forEach((a, i) => {
    if (!i) return; // "Sin atraso" no se muestra
    html += `<div class="hm-l">${a.n}</div>`;
    html += orden.map(m => {
      const n = atr.filter(r => r.mun === m && r.semanas === i).length;
      const fondo = n ? `background:color-mix(in srgb, #1b3f74 ${Math.round((.55 + .45 * n / max) * 100)}%, #FFFFFF);color:#fff` : '';
      return `<div class="hc ${n ? '' : 'cero'}" style="${fondo}">${n}</div>`;
    }).join('');
  });
  $('hmAtraso').innerHTML = html;

  // Detalle: ordenado por municipio y fecha, como la hoja. El municipio se ve por el color de la izquierda.
  const ICO_RELOJ = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  // Sin atrasados: la tabla queda vacía y el recuadro del detalle lo avisa
  $('atLista').innerHTML = det.length ? `<div class="at-lista">${det.map(r => `
    <div class="at-it" style="--m:${COLOR_MUNI[r.mun] || COL.gris}">
      <div class="at-dir">${esc(r.dir)}</div>
      <div class="at-sub"><span>${ICO_CAL}Solicitada ${fHora(r.fSolD)}</span><span>${ICO_RELOJ}hace ${diasEntre(desdeClave(r.solK), HOY)} días</span></div>
      ${r.nota ? `<div class="at-desc">${esc(r.nota)}</div>` : ''}
    </div>`).join('')}</div>`
    : '<div class="at-vacio">No hay solicitudes atrasadas</div>';
  renderMapaAtrasados(det);
}

// Mapa de los atrasados abajo del detalle, con el color de cada municipio y la misma ficha que Pendientes
const VAtr = { p: 'atr', mapa: null, capa: null, marc: new Map(), sel: null, encuadrar: false,
  rend: L.canvas({ padding: .3 }), ficha: fichaPendiente, lista: [] };
function renderMapaAtrasados(lista) {
  const v = VAtr;
  if (lista) v.lista = lista.filter(r => r.lat && r.lng);
  $('atrMapaCard').hidden = !v.lista.length;
  if (!v.lista.length || !$('atrMapa').offsetWidth) return;
  const primera = prepararMapa(v);
  v.capa.clearLayers(); v.marc.clear();
  for (const r of v.lista) punto(v, r, COLOR_MUNI[r.mun] || COL.gris);
  // Centrado para que entren todos (con uno solo, sin acercarse de más)
  const encuadrar = () => v.mapa.fitBounds(L.latLngBounds(v.lista.map(r => [r.lat, r.lng])), { padding: [30, 30], maxZoom: 15 });
  encuadrar();
  if (primera) requestAnimationFrame(() => { v.mapa.invalidateSize(); encuadrar(); });
  if (v.sel) { if (v.marc.has(v.sel.id)) seleccionar(v, v.sel); else cerrarFicha(v); }
}

// ── pestaña Para borrar: misma lógica que la hoja "Repetidos" ───────────────
// Sobre las solicitudes abiertas (Nuevo o Asignado):
//  - Direcciones repetidas: la misma dirección aparece más de una vez.
//  - Descripción para borrar: el texto de la solicitud dice "borrar".
const ICO_CAL = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

function renderBorrar(C) {
  const grupos = {};
  for (const r of C.pendientes) (grupos[r.dir.trim().toLowerCase()] ||= []).push(r);
  const rep = Object.values(grupos).filter(g => g.length > 1)
    .map(g => g.sort((a, b) => a.fSolD - b.fSolD))
    .sort((a, b) => a[0].dir.localeCompare(b[0].dir));
  $('repLista').innerHTML = rep.length ? `<div class="at-lista">${rep.map(g => `
    <div class="at-it" style="--m:${COLOR_MUNI[g[0].mun] || COL.gris}">
      <div class="at-dir">${esc(g[0].dir)}</div>
      <div class="rep-sol">${g.map(r => `
        <div class="rep-fila"><b>${esc(r.estado)}</b><span class="at-sub" style="display:inline-flex"><span>${ICO_CAL}Solicitada ${fHora(r.fSolD)}</span></span></div>
        ${r.nota ? `<div class="at-desc">${esc(r.nota)}</div>` : ''}`).join('')}
      </div>
    </div>`).join('')}</div>`
    : '<div class="at-vacio">No hay direcciones repetidas</div>';

  const bor = C.pendientes.filter(r => /borrar/i.test(r.nota)).sort((a, b) => a.dir.localeCompare(b.dir));
  $('borLista').innerHTML = bor.length ? `<div class="at-lista">${bor.map(r => `
    <div class="at-it" style="--m:${COLOR_MUNI[r.mun] || COL.gris}">
      <div class="at-dir">${esc(r.dir)}</div>
      <div class="rep-fila"><b>${esc(r.estado)}</b><span class="at-sub" style="display:inline-flex"><span>${ICO_CAL}Solicitada ${fHora(r.fSolD)}</span></span></div>
      <div class="at-desc">${esc(r.nota)}</div>
    </div>`).join('')}</div>`
    : '<div class="at-vacio">No hay solicitudes para borrar</div>';
}

// ── pestaña Ingreso: misma lógica que la hoja "Seguimiento ingreso" ─────────
// Solicitudes cuya fecha de solicitud cae en el día elegido, ordenadas por hora.
// Se separan en dos tablas: arriba las que les falta teléfono u horario en la descripción,
// abajo las que tienen las dos cosas. El teléfono viene marcado en los datos (r.tel), porque
// el número se borra antes de publicar; el horario se busca en el texto.
const RE_HORARIO = new RegExp([
  String.raw`\b\d{1,2}(:\d{2})?\s*(a|al|-|–)\s*\d{1,2}(:\d{2})?\b`,           // 8 a 12, 7:30 a 10:30
  String.raw`\b\d{1,2}:\d{2}\b`,                                               // 13:30
  String.raw`\b\d{1,2}\s*(hs?|hrs?|horas)\b`,                                  // 17 hs
  String.raw`(desde|despu[eé]s de|a partir de|antes de|hasta|luego de)\s+(las?\s+)?\d`, // a partir de las 9
  String.raw`\b(ma[ñn]ana|tarde|noche|mediod[ií]a|medio d[ií]a)\b`,            // en la mañana
].join('|'), 'i');
// Se busca en la nota sin teléfonos, para que los dígitos de un número no parezcan un horario
const tieneHorario = r => RE_HORARIO.test(r.notaPub ?? r.nota ?? '');

// "Datos de la solicitud" va última en las dos tablas: es la que se lleva el espacio sobrante
function filasIngreso(L_, conFalta) {
  if (!L_.length) return `<tr><td colspan="${conFalta ? 6 : 5}" class="at-vacio">No hay solicitudes</td></tr>`;
  return L_.map(r => `<tr>
      <td>${chipMuni(r.mun)}</td>
      <td class="dir">${esc(r.dir)}</td>
      <td class="hora">${pad(r.fSolD.getHours())}:${pad(r.fSolD.getMinutes())}</td>
      <td class="num">${r.cantSol != null ? fmt(r.cantSol) : ''}</td>
      ${conFalta ? `<td>${r.tel ? '' : '<span class="falta">Teléfono</span>'}${tieneHorario(r) ? '' : '<span class="falta">Horario</span>'}</td>` : ''}
      <td class="desc">${esc(r.nota)}</td></tr>`).join('');
}

// Municipio, Dirección, Hora y Cantidad con el mismo ancho en las dos tablas, para que queden alineadas
// (se mide cada tabla con su ancho justo y después se fija el mayor en todas las celdas de esa columna,
// porque un ancho puesto solo en el encabezado pierde contra el width:1% de las celdas)
function igualarColumnas() {
  const tablas = [$('tIngFalta'), $('tIngOk')];
  const celdas = (t, i) => [...t.querySelectorAll(`tr > :nth-child(${i + 1})`)].filter(c => !c.colSpan || c.colSpan === 1);
  for (const t of tablas) for (let i = 0; i < 4; i++) celdas(t, i).forEach(c => c.style.width = '');
  if (!$('tIngOk').offsetWidth) return; // pestaña oculta: se iguala al mostrarla
  for (let i = 0; i < 4; i++) {
    const ancho = Math.ceil(Math.max(...tablas.map(t => t.querySelector(`thead th:nth-child(${i + 1})`).getBoundingClientRect().width)));
    for (const t of tablas) celdas(t, i).forEach(c => c.style.width = ancho + 'px');
  }
}

function renderIngreso() {
  const dias = D.filas.map(r => r.solK).filter(Boolean).sort();
  const inp = $('ingDia');
  inp.min = dias[0]; inp.max = HOYk;
  if (!st.ingDia) st.ingDia = HOYk;
  inp.value = st.ingDia;
  const L_ = base().filter(r => r.solK === st.ingDia).sort((a, b) => a.fSolD - b.fSolD);
  const ok = L_.filter(r => r.tel && tieneHorario(r)), falta = L_.filter(r => !(r.tel && tieneHorario(r)));
  $('ingTot').innerHTML = `<b class="num">${L_.length}</b> ${L_.length === 1 ? 'solicitud' : 'solicitudes'}`;
  const cab = extra => `<thead><tr><th>Municipio</th><th>Dirección</th><th>Hora</th><th>Cantidad</th>${extra ? '<th>Falta</th>' : ''}<th>Datos de la solicitud</th></tr></thead>`;
  $('tIngFalta').innerHTML = cab(true) + `<tbody>${filasIngreso(falta, true)}</tbody>`;
  $('tIngOk').innerHTML = cab(false) + `<tbody>${filasIngreso(ok, false)}</tbody>`;
  igualarColumnas();
}
$('ingDia').onchange = e => { st.ingDia = e.target.value || HOYk; renderIngreso(); };

// Categorías. La primera se abre por defecto; las demás quedan en la URL (#pendientes) para que al recargar siga ahí.
const CATS = ['organizacion', 'pendientes', 'atrasados', 'borrar', 'ingreso', 'informe', 'operacion', 'buscador'];
function mostrarCat(k) {
  document.querySelectorAll('#cats button').forEach(b => b.classList.toggle('on', b.dataset.cat === k));
  document.querySelectorAll('.cat').forEach(c => c.classList.toggle('on', c.dataset.cat === k));
  history.replaceState(null, '', k === CATS[0] ? location.pathname + location.search : '#' + k);
  // Lo que se dibujó con la pestaña oculta (tamaño 0) se rehace al mostrarla
  if (!D) return;
  if (k === 'ingreso') igualarColumnas();
  if (k === 'operacion') renderVista(VOp);
  if (k === 'informe') renderVista(VInf);
  if (k === 'pendientes') renderPendientes();
  if (k === 'atrasados') renderMapaAtrasados();
  if (k === 'buscador') $('busQ').focus();
}
document.querySelectorAll('#cats button').forEach(b => b.onclick = () => mostrarCat(b.dataset.cat));
// Alto del título fijo, para que la barra de pestañas quede pegada abajo (cambia con el ancho de pantalla)
new ResizeObserver(([e]) => document.documentElement.style.setProperty('--alto-barra', e.target.offsetHeight + 'px'))
  .observe(document.querySelector('.barra'));
if (CATS.includes(location.hash.slice(1))) mostrarCat(location.hash.slice(1));

// Datos privados: teléfono y descripciones completas de cada solicitud. Están en el bucket "privado" de
// Supabase (bolsones.json.gz, lo sube n8n), que solo pueden leer supervisores y admin con sesión de COM 2.
// Mismo formato que antes, cuando iban cifrados con la contraseña del sitio: { id: [nota, obs, edificio, tel] }.
async function privados() {
  try {
    const { data, error } = await COM2.sb.storage.from('privado').download('bolsones.json.gz');
    if (error) throw error;
    const bytes = new Uint8Array(await data.arrayBuffer());
    // gzip empieza con 1f 8b (por si el navegador ya lo descomprimió solo)
    const texto = bytes[0] === 0x1f && bytes[1] === 0x8b
      ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
      : new TextDecoder().decode(bytes);
    return JSON.parse(texto);
  } catch (err) {
    console.warn('Sin datos privados:', err.message);
    return null;
  }
}

// Reemplaza en cada solicitud los textos públicos (sin teléfonos) por los completos
function sumarPrivados(priv) {
  if (!priv) return;
  for (const r of D.filas) {
    const p = priv[r.id];
    if (!p) continue;
    r.notaPub = r.nota;
    r.nota = p[0] || r.nota;
    r.obs = p[1] || r.obs;
    r.edif = p[2] || r.edif;
    r.telefono = p[3];
  }
}

// La base se actualiza desde el botón de Bolsones del menú principal; acá solo se lee al abrir
async function cargar() {
  try {
    // Solo supervisores y admin con sesión de COM 2 (y con la contraseña inicial ya cambiada)
    const yo = await COM2.perfil().catch(() => null);
    if (!yo || yo.debe_cambiar_clave || !COM2.ROLES_SUPERVISION.includes(yo.rol)) { location.replace('./'); return; } COM2.usuarioEnBarra(yo);
    const sep = CONFIG.fuente.includes('?') ? '&' : '?';
    const [res, priv] = await Promise.all([
      fetch(CONFIG.fuente + sep + 't=' + Date.now(), { cache: 'no-store' }),
      privados(),
    ]);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    D = preparar(await res.json());
    D.calendario = CALENDARIO;
    sumarPrivados(priv);
    render();
    $('cargador')?.remove();
  } catch (err) {
    $('cargador').textContent = 'No se pudieron cargar los datos (' + err.message + ').';
  }
}
cargar();

window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
