  <style>
    /* Mismos colores y estructura que el Semáforo de Zona Limpia y el menú de COM 2 */
    :root {
      color-scheme: light;
      --bg: #f7f6f3; --panel: #fff; --text: #16243a; --muted: #526078; --line: #dbe3ed; --line-soft: #e8edf3;
      --line-celda: #ccd6e3; --surface: #f4f7fb; --blue: #184a91; --pending: #83410b; --ok: #137a55;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #16191f; --panel: #202631; --text: #edf2fa; --muted: #b0bfd3; --line: #404c60; --line-soft: #354051;
      --line-celda: #4e5c70; --surface: #252e3c; --blue: #a5c9ff; --pending: #ffd098; --ok: #7fd8b2;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.45 'DM Sans', system-ui, sans-serif; }
    button, select, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .wrap { width: 100%; max-width: 1920px; margin: 0 auto; padding: 14px clamp(12px, 1.3vw, 24px) 40px; }
    .dashboard { display: grid; gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .muted { color: var(--muted); }

    /* barra de herramientas */
    .toolbar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 22px; }
    .toolbar:empty { display: none; }
    .toolbar.gol { position: sticky; top: calc(76px + env(safe-area-inset-top)); z-index: 900; display: block; min-width: 0; color: #f0f5ff; color-scheme: dark; }
    .gol-fila { display: flex; align-items: center; gap: 12px; padding: 7px 10px; overflow-x: auto; scrollbar-width: thin; scroll-padding-inline: 10px;
      border-radius: 14px; background: linear-gradient(135deg, #162a4d 0%, #193563 55%, #1b3f74 100%); box-shadow: 0 4px 12px rgba(15,23,42,.25); }
    .gol-fila:focus-visible { outline-offset: -3px; }
    .gol-controles { display: flex; flex: none; align-items: center; gap: 12px; }
    .gol-controles .field { flex-wrap: nowrap; gap: 6px; }
    .gol-carga { display: flex; flex: none; align-items: center; gap: 4px 8px; margin-inline-start: auto; padding-inline-start: 12px;
      border-inline-start: 1px solid rgba(255,255,255,.19); white-space: nowrap; }
    .gol-ultima { color: #c7d5ea; font-size: .8rem; }
    .field { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .field > label { font-size: .82rem; font-weight: 700; }
    .toolbar input[type=date], .toolbar input[type=number] {
      min-height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 3px 9px; font-size: .82rem; font-weight: 600;
    }
    .toolbar input[type=number] { width: 66px; }
    .gol-controles input[type=number] { width: 54px; }
    .btn-m { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; color: var(--blue); font-size: .8rem; font-weight: 700; cursor: pointer; }
    .btn-m:hover { border-color: var(--blue); }
    .btn-m.pri { background: #184a91; border-color: #184a91; color: #fff; }
    .toolbar.gol :is(.btn-m, .chip-mun, select, input[type="date"], input[type="number"]) {
      background-color: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.26); color: inherit;
    }
    .toolbar.gol :is(.btn-m, .chip-mun):hover:not(:disabled) { border-color: #fff; }
    .toolbar.gol :focus-visible { outline-color: #fff; }
    .source-status { margin: 0; font-size: .85rem; color: var(--muted); text-align: center; }
    .source-status.err { color: var(--pending); font-weight: 700; }
    .source-status .ok { color: var(--ok); }
    .source-status .err { color: var(--pending); }

    /* inicio: tarjetas como el menú de COM 2 */
    .portada { min-height: calc(100dvh - 2 * (62px + 14px + env(safe-area-inset-top))); display: flex; align-items: center; justify-content: center; }
    .cover { width: 100%; max-width: 860px; }
    .recursos-acc { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 10px; margin: 16px auto 0; padding: 9px 16px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--panel); color: var(--text); cursor: pointer; font-weight: 700; }
    .recursos-acc:hover { border-color: var(--blue); }
    .recursos-acc span { font-weight: 500; font-size: .82rem; color: var(--muted); }
    .grid, .turnos-sel { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 812px; margin: 0 auto; }
    .grid .tile, .turnos-sel .tile { flex: 0 1 260px; }
    @media (max-width: 680px) { .grid .tile, .turnos-sel .tile { flex: 1 1 100%; } }
    .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; background: var(--panel); border: 1px solid var(--line);
      border-radius: 18px; padding: 2rem 1rem 1.6rem; text-decoration: none; color: inherit; cursor: pointer; font: inherit;
      box-shadow: 0 4px 20px rgba(26,23,20,.06), 0 1px 3px rgba(26,23,20,.05); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .tile:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(26,23,20,.10); border-color: var(--blue); }
    .tile.off { opacity: .45; cursor: not-allowed; pointer-events: none; }
    .turnos-sel .tile { padding: 2.4rem 1rem 2rem; }
    .turnos-sel .tile-name { font-size: 1.15rem; font-weight: 700; }
    .tile-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
    .tile-icon svg { width: 26px; height: 26px; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .tile-name { font-size: 14.5px; font-weight: 600; }
    .tile-sub { font-size: .8rem; color: var(--muted); text-align: center; }
    .acc-teal .tile-icon { background: #DCEDE4; } .acc-teal .tile-icon svg { stroke: #39745E; }
    .acc-amber .tile-icon { background: #F5E4CF; } .acc-amber .tile-icon svg { stroke: #9A642A; }
    .acc-violet .tile-icon { background: #E5DDF0; } .acc-violet .tile-icon svg { stroke: #6C5790; }
    [data-theme="dark"] .acc-teal .tile-icon { background: #1d3a2f; } [data-theme="dark"] .acc-teal .tile-icon svg { stroke: #6cc39f; }
    [data-theme="dark"] .acc-amber .tile-icon { background: #3a2c1a; } [data-theme="dark"] .acc-amber .tile-icon svg { stroke: #e0a867; }
    [data-theme="dark"] .acc-violet .tile-icon { background: #2c2440; } [data-theme="dark"] .acc-violet .tile-icon svg { stroke: #b29ee0; }

    /* tablas: igual que el Semáforo */
    .turno { min-width: 0; overflow: hidden; }
    .turno h2 { margin: 0; padding: 10px 12px; text-align: center; background: linear-gradient(135deg, #162a4d 0%, #193563 55%, #1b3f74 100%); color: #fff;
      border-bottom: 1px solid var(--line); font-size: 1rem; font-weight: 700; }
    .table-box { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .925rem; }
    thead { background: var(--surface); color: var(--muted); }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--line-celda); text-align: center; vertical-align: middle; overflow-wrap: anywhere; }
    tr > :not(:last-child) { border-inline-end: 1px solid var(--line-celda); }
    thead th { font-size: .78rem; font-weight: 700; overflow-wrap: normal; }
    tbody tr:last-child > * { border-bottom: 0; }
    tbody th[scope="row"] { font-weight: inherit; }
    .grupo { font-weight: 600; }
    .numeric, .result, .codigo-circuito { font-variant-numeric: tabular-nums; }
    .codigo-circuito { white-space: nowrap; font-weight: 600; }
    .rango { display: block; font-weight: 700; }
    .completo { display: inline-block; font-weight: 800; background: #090b10; color: #fff; padding-inline: .45em; border: 1px solid var(--line); border-radius: 5px; }
    .completo-nota { display: block; margin-top: 2px; font-size: .72rem; font-weight: 600; color: var(--muted); }
    .sub { display: block; font-size: .72rem; color: var(--muted); font-weight: 500; }
    .detalle-colores { white-space: nowrap; overflow-wrap: normal; }
    .gol-select {
      appearance: none; min-height: 30px; padding: 3px 28px 3px 9px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel) url("data:image/svg+xml,%3Csvg width='14' height='14' viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='m4 6 4 4 4-4' fill='none' stroke='%23758fb3' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 8px center;
      font-size: .82rem; font-weight: 600; cursor: pointer;
    }
    .gol-select:hover { border-color: var(--blue); }
    .toolbar.gol .gol-select { min-width: 6.5rem; }
    .toolbar.gol .gol-select:hover { border-color: #fff; }
    @supports (appearance: base-select) and selector(::picker(select)) {
      .gol-select, .gol-select::picker(select) { appearance: base-select; }
      .gol-select { align-items: center; gap: 8px; justify-content: space-between; background-image: none; padding-inline: 9px; }
      .gol-select::picker-icon { color: var(--blue); font-size: .72rem; }
      .toolbar.gol .gol-select::picker-icon { color: #c7d5ea; }
      .gol-select::picker(select) {
        margin-top: 5px; padding: 4px; border: 1px solid var(--line); border-radius: 9px;
        background: var(--panel); color: var(--text); box-shadow: 0 5px 16px #0f172a26;
      }
      .gol-select option { min-height: 33px; gap: 6px; border-radius: 5px; padding: 5px 7px; font-weight: 600; cursor: pointer; }
      .gol-select option:is(:hover, :focus-visible, :checked) { background: var(--surface); color: var(--blue); }
      .gol-select option::checkmark { order: 1; margin-inline-start: auto; }
    }
    .camion-sel, .recurso-opciones { width: 100%; max-width: 190px; min-height: 32px; }
    :is(.camion-sel.asignado, .recurso-opciones) {
      border: 1px solid var(--ok); border-radius: 8px; background-color: color-mix(in srgb, var(--ok) 14%, var(--panel)); color: var(--ok); font-weight: 700;
    }
    :is(.camion-sel.asignado, .recurso-opciones):hover { background-color: color-mix(in srgb, var(--ok) 24%, var(--panel)); }
    .recurso-opciones { display: flex; align-items: stretch; margin-inline: auto; }
    .recurso-directo { flex: 1; min-width: 0; padding: 3px 0 3px 10px; border: 0; border-radius: 7px 0 0 7px; background: transparent;
      color: inherit; font-size: .82rem; line-height: 1.2; font-weight: 700; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .camion-sel.alternativas { flex: 0 0 34px; width: 34px; min-width: 34px; min-height: 30px; padding-inline: 0; justify-content: center; gap: 0;
      border: 0; border-radius: 0 7px 7px 0; background-color: transparent; }
    .recurso-opciones > :focus-visible { outline-offset: -2px; }
    @supports (appearance: base-select) and selector(::picker(select)) {
      .camion-sel:not(.alternativas) { padding-inline: 10px 12px; }
      .camion-sel > button { flex: 1; min-width: 0; padding: 0; border: 0; background: none; color: inherit; text-align: start; }
      .camion-sel selectedcontent { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .camion-sel:is(.asignado, .alternativas)::picker-icon { color: inherit; }
      .camion-sel.alternativas::picker-icon { margin-inline: auto; }
      .camion-sel.alternativas::picker(select) { min-width: max-content; }
    }
    .aviso-vacio { padding: 26px; text-align: center; color: var(--muted); }

    /* GOL: una columna por municipio */
    .muni-chips, .muni-opciones { display: flex; align-items: center; gap: 4px; }
    .muni-chips .lab { font-size: .82rem; font-weight: 700; margin-right: 2px; }
    @media (721px <= width <= 1340px) {
      .gol-controles { align-items: flex-start; }
      .gol-controles .field, .muni-chips { flex-direction: column; align-items: flex-start; gap: 3px; }
    }
    @media (721px <= width <= 1100px) {
      .gol-carga { flex-direction: column; align-items: flex-start; }
    }
    .chip-mun { min-height: 30px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel); font-size: .8rem; font-weight: 700; cursor: pointer; }
    .chip-mun span { font-weight: 500; margin-left: 2px; }
    .toolbar.gol .chip-mun.on { background: #fff; border-color: #fff; color: #162a4d; }
    .chip-mun:disabled { opacity: .4; cursor: not-allowed; }
    .munis { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 14px; align-items: start; }
    .munis :is(th, td) { padding-inline: 7px; }
    @media (max-width: 1099px) { .munis { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 480px) { .munis :is(th, td) { padding-inline: 5px; } }
    .recursos-mun { padding: 7px 12px; font-size: .8rem; color: var(--muted); border-bottom: 1px solid var(--line-soft); text-align: center; }
    .recursos-mun.sin { color: var(--pending); font-weight: 700; }
    .recurso-fuera { display: block; color: var(--pending); font-size: .75rem; font-weight: 700; }

    /* Recursos */
    .wrap:has(.recursos-panel) { padding-bottom: 12px; }
    .recursos-panel { display: grid; gap: 10px; width: 100%; min-width: 0; max-width: 1480px; }
    .recursos-panel .card { overflow: hidden; box-shadow: 0 4px 20px rgba(26,23,20,.08); }
    .recursos-panel .table-box:focus-visible { outline-offset: -3px; }
    .recursos { table-layout: fixed; min-width: calc(5.75rem + var(--municipios) * 6.25rem); }
    .recursos th, .recursos td { padding: 5px; }
    .recursos thead { background: linear-gradient(135deg, #162a4d, #1b3f74); color: #fff; }
    .recursos thead th { border-color: rgba(255,255,255,.2); font-size: .82rem; overflow-wrap: anywhere; }
    .recursos tbody tr { height: clamp(108px, 19dvh, 144px); }
    .recursos .col-turno { width: 10%; }
    .recursos th.t { background: var(--surface); font-size: .91rem; font-weight: 700; color: var(--text); }
    .recursos-empresas { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 3px; }
    .tag { display: inline-flex; align-items: center; gap: 3px; max-width: 100%; padding: 1px 5px; border: 1px solid var(--line); border-radius: 99px;
      background: var(--surface); font-size: .84rem; font-weight: 600; line-height: 1.2; }
    .tag span { min-width: 0; }
    .tag[draggable="true"] { cursor: grab; }
    .tag button { flex: none; border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 1px; font-size: inherit; }
    .tag-agregar { justify-content: center; min-width: 25px; color: var(--blue); cursor: pointer; }
    .tag-agregar:hover { border-color: var(--blue); }
    .celda input { width: 100%; max-width: 120px; min-height: 24px; padding: 1px 6px; border: 1px solid var(--line);
      border-radius: 99px; background: var(--panel); font-size: .75rem; text-align: center; }
    .celda.sobre { outline: 2px dashed var(--blue); outline-offset: -3px; background: var(--surface); }
  </style>
</head>

    (() => {
      const P = parent;
      window.PlanillaZonaLimpia = P.PlanillaZonaLimpia;
      window.COM2 = { URL: P.COM2.URL, sb: P.COM2.sb, acceso: async () => P.AZL.perfil,
        carga: { listo() { const c = document.getElementById('cargando'); if (c) c.hidden = true; },
                 error(m) { const c = document.getElementById('cargando'); if (c) { c.hidden = false; c.textContent = m; } } } };
      const tema = () => { document.documentElement.dataset.theme = P.document.documentElement.dataset.theme; };
      tema(); new P.MutationObserver(tema).observe(P.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        const marco = P.document.getElementById('semaforoMarco'), ajustar = () => { marco.style.height = Math.ceil(document.body.getBoundingClientRect().height) + 'px'; };

      });
    })();

    #rango {

    @supports (appearance: base-select) and selector(::picker(select)) {

      #rango {

        gap: 8px;

<body>
<p id="cargando" role="status">Cargando información…</p>
  <main class="wrap">
    <div class="dashboard" id="dashboard" hidden>
      <div class="toolbar">
        <div class="filtros-atencion">
          <div class="field">
            <label for="rango">Puntos sin atención en estos días</label>
            <select id="rango">
              <option value="0">Hoy</option>
              <option value="1" selected>Hoy y ayer</option>
              <option value="2">Hoy, ayer y antes de ayer</option>
            </select>
          </div>
          <p class="leyenda-atencion" id="leyenda-atencion" hidden></p>
        </div>
        <button type="button" id="modo-edicion" aria-label="Editar planificación" aria-controls="tablas"
          aria-pressed="false" hidden disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m14 6 4 4M4 20l4.5-1 11-11a2.8 2.8 0 0 0-4-4l-11 11L4 20Z"/>
          </svg>
        </button>
      </div>
      <p class="source-status" id="estado-base" role="status" hidden></p>
      <p class="source-status" id="estado-planilla" role="status" hidden></p>
      <p class="source-status" id="estado-recursos" role="status" hidden></p>
      <button type="button" id="reintentar-planilla" hidden>Reintentar carga de tablas</button>
      <div class="turnos" id="tablas"></div>
    </div>
  </main>
  <dialog class="editar-dialogo" id="editar-fila" aria-labelledby="editar-titulo">
    <form class="editar-form" id="editar-form">
      <h2 id="editar-titulo">Editar fila</h2>
      <div class="editar-campos">
        <label>Circuito
          <select name="circuito" aria-describedby="editar-info" required autofocus></select>
        </label>
        <label id="campo-circuito-nuevo" hidden>Código del circuito
          <input name="circuito_nuevo" maxlength="80" autocomplete="off" aria-describedby="editar-info" disabled>
        </label>
        <label id="campo-camion-nuevo">Camión <select name="camion"></select></label>
        <label>Tramo asignado
          <input name="tramo" maxlength="30" placeholder="Circuito completo" aria-describedby="editar-info">
        </label>
      </div>

      <div class="editar-botones">
        <button type="button" id="eliminar-fila">Eliminar fila</button>
        <button type="button" id="cancelar-edicion">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </dialog>
  <dialog class="editar-dialogo" id="mover-fila" aria-labelledby="mover-titulo">
    <form class="editar-form" method="dialog">
      <h2 id="mover-titulo">Mover fila</h2>
      <div class="editar-botones" id="mover-destinos"></div>
      <div class="editar-botones"><button>Cerrar</button></div>
    </form>
  </dialog>
  <script>
    (() => {
      'use strict';

      const turnos = window.PlanillaZonaLimpia ?? [];
      const rango = document.getElementById('rango');
      const botonEdicion = document.getElementById('modo-edicion');
      const estadoBase = document.getElementById('estado-base');
      const leyendaAtencion = document.getElementById('leyenda-atencion');
      const estadoPlanilla = document.getElementById('estado-planilla');
      const estadoRecursos = document.getElementById('estado-recursos');
      const reintentar = document.getElementById('reintentar-planilla');
      const tablas = document.getElementById('tablas');
      const dialogo = document.getElementById('editar-fila');
      const dialogoMover = document.getElementById('mover-fila');
      const formulario = document.getElementById('editar-form');
      const campos = formulario.elements;
      const etiquetaCircuitoNuevo = document.getElementById('campo-circuito-nuevo');
      const otroCircuito = '__otro__';
      const infoEdicion = document.getElementById('editar-info');
      const errorEdicion = document.getElementById('editar-error');
      const eliminar = document.getElementById('eliminar-fila');
      const cancelar = document.getElementById('cancelar-edicion');
      const guardar = formulario.querySelector('[type="submit"]');
      const paneles = [];
      let recursosDia = null, firmaRecursos;
      const totalesReferencia = new Map();
      const totalesDeclarados = new Map();
      const municipiosCircuito = new Map();
      const filasIniciales = turnos.flatMap(({ filas }, turno) => {
        const claveCamion = fila => fila.municipio + '/' + fila.camion;
        const ordenCamiones = [...new Set(filas.map(claveCamion))];
        return [...filas].sort((a, b) => a.municipio.localeCompare(b.municipio, 'es-UY')
          || ordenCamiones.indexOf(claveCamion(a)) - ordenCamiones.indexOf(claveCamion(b))).map(fila => ({
          turno, municipio: fila.municipio, camion: fila.camion, circuito: fila.circuito,
          desde: fila.cantidad.includes('–') ? fila.desde : null,
          hasta: fila.cantidad.includes('–') ? fila.hasta : null
        }));
      });
      for (const { filas } of turnos) {
        for (const { circuito, municipio, cantidad, hasta } of filas) {
          municipiosCircuito.set(circuito, municipio);
          if (!cantidad.includes('–')) totalesDeclarados.set(circuito, hasta);
          totalesReferencia.set(circuito, Math.max(totalesReferencia.get(circuito) ?? 0, hasta));
        }
      }
      for (const [circuito, total] of totalesDeclarados) totalesReferencia.set(circuito, total);
      const HORA = 60 * 60 * 1000;
      const DIA = 24 * HORA;
      // El formato 2 guarda los segundos del reloj local de Montevideo como si fueran UTC.
      const DESFASE_MONTEVIDEO = 3 * HORA;
      const fallido = /no visitado|omitido|no se pudo|no realizado/;
      const edades = [
        { clase: 'edad-ayer', etiqueta: 'Ayer' },
        { clase: 'edad-anteayer', etiqueta: 'Antes de ayer' },
        { clase: 'edad-tres-a-seis', etiqueta: 'Hace 3 a 6 días' },
        { clase: 'edad-siete-o-mas', etiqueta: 'Hace 7 días o más' }
      ];
      let datos = null;
      let consultando = false;
      let filasPlanilla = filasIniciales;
      let revision = null;
      let puedeEditar = false;
      let modoEdicion = false;
      let editando = null;
      let turnoEdicion = null;
      let guardando = false;
      let conflicto = false;
      let inventario = new Map();
      const filasPorElemento = new WeakMap();
      let arrastre = null;

      function lector(base, campo) {
        const columna = base.columnas.find(nombre => nombre.trim().toLowerCase() === campo);
        if (columna == null) throw new Error('Falta la columna ' + campo + '.');
        const i = base.columnas.indexOf(columna);
        const diccionario = base.dicc?.[columna];
        return diccionario ? fila => diccionario[fila[i]] : fila => fila[i];
      }

      function normalizarCodigo(valor) {
        return String(valor ?? '').trim().toUpperCase();
      }

      function municipioCircuito(circuito) {
        return municipiosCircuito.get(circuito) || inventario.get(circuito)?.municipio
          || /^(CH|[A-G])(?=\d)/.exec(circuito)?.[1] || '';
      }

      function leerFecha(valor, compacta) {
        if (valor == null || valor === '') return NaN;
        if (compacta) return Number(valor) * 1000 + DESFASE_MONTEVIDEO;
        const fecha = String(valor).trim().replace(' ', 'T');
        return Date.parse(/(?:z|[+-]\d{2}:?\d{2})$/i.test(fecha) ? fecha : fecha + '-03:00');
      }

      function preparar(base, ahora = Date.now()) {
        if (!Array.isArray(base.columnas) || !Array.isArray(base.registros) || !base.registros.length) {
          throw new Error('La base de Zona Limpia no trae registros.');
        }
        const columnas = base.columnas.map(columna => columna.trim().toLowerCase());
        const requeridas = ['circuito', 'contenedor', 'fecha_resuelto', 'incidente', 'estado'];
        const lectores = requeridas.map(campo => lector(base, campo));
        const [circuitoDe, puntoDe, fechaDe, incidenteDe, estadoDe] = lectores;
        const fechaCompacta = base.fechas?.includes(base.columnas[columnas.indexOf('fecha_resuelto')]);
        const ultimasAtenciones = new Map();
        const hoy = inicioDia(ahora);
        const hasta = hoy + DIA;
        for (const fila of base.registros) {
          const fecha = leerFecha(fechaDe(fila), fechaCompacta);
          if (!Number.isFinite(fecha) || fecha >= hasta) continue;
          const circuito = normalizarCodigo(circuitoDe(fila));
          if (!circuito) continue;
          const punto = Number(puntoDe(fila));
          if (!Number.isSafeInteger(punto) || punto < 1) continue;
          const incidente = String(incidenteDe(fila) ?? '').trim().toLowerCase();
          const estado = String(estadoDe(fila) ?? '').trim().toLowerCase();
          if (!incidente || fallido.test(incidente) || !['cerrado', 'resuelto'].includes(estado)) continue;
          if (!ultimasAtenciones.has(circuito)) ultimasAtenciones.set(circuito, new Map());
          const puntos = ultimasAtenciones.get(circuito);
          if ((puntos.get(punto) ?? -Infinity) < fecha) puntos.set(punto, fecha);
        }
        return { ultimasAtenciones, generado: leerFecha(base.generado, false) };
      }

      function inicioDia(ahora) {
        const relojLocal = ahora - DESFASE_MONTEVIDEO;
        return Math.floor(relojLocal / DIA) * DIA + DESFASE_MONTEVIDEO;
      }

      function puntosCircuito(circuito) {
        const puntosInventario = inventario.get(circuito)?.puntos;
        if (puntosInventario) return puntosInventario;
        const total = totalesReferencia.get(circuito) ?? 0;
        return Array.from({ length: total }, (_, i) => i + 1);
      }

      function puntosPendientes(puntos, fila, atenciones, hoy, inicio) {
        const grupos = edades.map(() => []);
        const fin = hoy + DIA;
        let cantidad = 0;
        for (const punto of puntos) {
          if (fila.desde != null && (punto < fila.desde || punto > fila.hasta)) continue;
          const fecha = atenciones?.get(punto);
          if (fecha >= inicio && fecha < fin) continue;
          cantidad++;
          const dias = (hoy - inicioDia(fecha)) / DIA;
          const edad = dias === 1 ? 0 : dias === 2 ? 1 : dias >= 3 && dias < 7 ? 2 : 3;
          const tramos = grupos[edad];
          const ultimo = tramos.at(-1);
          if (ultimo && ultimo[1] === punto - 1) ultimo[1] = punto;
          else tramos.push([punto, punto]);
        }
        return { cantidad, grupos };
      }

      function crear(tag, texto, clase) {
        const el = document.createElement(tag);
        if (texto != null) el.textContent = texto;
        if (clase) el.className = clase;
        return el;
      }

      function municipioDeFila(fila) {
        return municipioCircuito(fila.circuito) || fila.municipio;
      }

      function recursosDe(turno, municipio, recursos = recursosDia) {
        return recursos?.[turno]?.[normalizarCodigo(municipio)] || [];
      }

      function recursoVigente(fila) {
        const camion = String(fila.camion || '').trim();
        return !recursosDia || recursosDe(fila.turno, municipioDeFila(fila)).includes(camion) ? camion : '';
      }

      function cargarOpcionesCamion(select, turno, municipio, camion) {
        const lista = recursosDe(turno, municipio);
        select.replaceChildren(new Option('Sin recurso', ''), ...lista.map(nombre => new Option(nombre, nombre)));
        if (camion && !lista.includes(camion)) {
          const anterior = new Option(recursosDia ? 'Sin recurso vigente' : camion, camion);
          anterior.disabled = true;
          select.prepend(anterior);
        }
        select.value = camion;
        select.disabled = !recursosDia;
      }

      function actualizarRecursosDialogo() {
        if (editando) return;
        cargarOpcionesCamion(campos.camion, turnoEdicion, municipioCircuito(codigoSeleccionado()), campos.camion.value);
        if (campos.camion.selectedOptions[0]?.disabled) campos.camion.value = '';
      }

      function gruposContiguos(filas, clave) {
        const grupos = [];
        for (const fila of filas) {
          const ultimo = grupos.at(-1);
          if (ultimo && clave(ultimo[0]) === clave(fila)) ultimo.push(fila);
          else grupos.push([fila]);
        }
        return grupos;
      }

      function completarFila(tr, fila, celdas, editable) {
        const circuito = crear('th');
        circuito.scope = 'row';
        circuito.append(crear('span', fila.circuito, 'codigo-circuito'));
        if (fila.desde != null) {
          circuito.append(' ', crear('span', '(' + fila.desde + '–' + fila.hasta + ')', 'tramo-asignado'));
        }
        const controles = {};
        if (editable) {
          const nombre = circuito.textContent;
          const camion = crear('select', null, 'camion-editable');
          cargarOpcionesCamion(camion, fila.turno, municipioDeFila(fila), String(fila.camion || '').trim());
          camion.setAttribute('aria-label', 'Camión de ' + nombre);
          camion.addEventListener('change', () => cambiarCamion(fila, camion));
          const celdaCamion = crear('td', null, 'grupo-camion');
          celdaCamion.append(camion);
          tr.append(crear('td', municipioDeFila(fila), 'grupo-municipio'), celdaCamion);
          controles.camion = camion;

          const acciones = crear('div', null, 'circuito-acciones');
          const editar = crear('button', 'Editar', 'fila-accion');
          editar.type = 'button';
          editar.setAttribute('aria-label', 'Editar ' + nombre);
          editar.addEventListener('click', () => abrirEdicion(fila.turno, fila));
          const mover = crearTirador(tr, fila, nombre);
          acciones.append(mover, editar);
          circuito.append(acciones);
          controles.editar = editar;
          controles.mover = mover;
          filasPorElemento.set(tr, fila);
        }
        const cantidad = crear('td', '—', 'numeric');
        const pendientes = crear('td', '—', 'numeric');
        const detalle = crear('td', '—', 'result');
        tr.append(circuito, cantidad, pendientes, detalle);
        celdas.push({ fila, cantidad, pendientes, detalle, controles });
      }

      function crearTabla(filas, celdas) {
        const tabla = crear('table');
        const grupoColumnas = crear('colgroup');
        for (const clase of ['municipio', 'camion', 'circuito', 'cantidad', 'pendientes', 'detalle']) {
          grupoColumnas.append(crear('col', null, clase));
        }
        tabla.append(grupoColumnas);
        const cabecera = tabla.createTHead().insertRow();
        for (const titulo of ['Municipio', 'Camión', 'Circuito', 'Cantidad de puntos', 'Cantidad sin atender', 'Puntos sin atender']) {
          const th = crear('th', titulo);
          th.scope = 'col';
          cabecera.append(th);
        }

        if (modoEdicion && revision != null) {
          tabla.classList.add('tabla-editable');
          const cuerpo = tabla.createTBody();
          for (const fila of filas) completarFila(cuerpo.insertRow(), fila, celdas, true);
          return tabla;
        }

        for (const filasMunicipio of gruposContiguos(filas, municipioDeFila)) {
          const grupo = tabla.createTBody();
          const municipioEl = crear('th', municipioDeFila(filasMunicipio[0]), 'grupo grupo-municipio');
          municipioEl.scope = 'rowgroup';
          municipioEl.rowSpan = filasMunicipio.length;
          for (const grupoFilas of gruposContiguos(filasMunicipio, recursoVigente)) {
            for (const [i, fila] of grupoFilas.entries()) {
              const tr = grupo.insertRow();
              if (i === 0) {
                if (grupo.rows.length === 1) tr.append(municipioEl);
                else tr.className = 'nuevo-camion';
                const camion = recursoVigente(fila);
                const camionEl = crear('td', camion || (recursosDia ? 'Sin recurso' : '—'), 'grupo grupo-camion');
                camionEl.classList.toggle('sin-recurso', Boolean(recursosDia && !camion));
                camionEl.rowSpan = grupoFilas.length;
                if (grupo.rows.length - 1 + grupoFilas.length === municipioEl.rowSpan) {
                  camionEl.classList.add('ultimo-camion');
                }
                tr.append(camionEl);
              }
              completarFila(tr, fila, celdas, false);
            }
          }
        }
        return tabla;
      }

      function armarTurnos() {
        recursosDia = parent.AZL.recursosDelDia();
        firmaRecursos = JSON.stringify(recursosDia);
        estadoRecursos.hidden = Boolean(recursosDia);
        estadoRecursos.textContent = recursosDia ? '' : 'Los recursos de hoy todavía están sin confirmar.';
        tablas.replaceChildren();
        paneles.length = 0;
        turnos.forEach(({ nombre }, i) => {
          const seccion = crear('section', null, 'card turno');
          seccion.dataset.turno = i;
          const titulo = crear('h2', nombre);
          titulo.id = 'turno-' + i;
          const contenido = crear('div', null, 'table-box');
          contenido.id = 'tabla-' + i;
          const celdas = [];
          const filas = filasPlanilla.filter(fila => fila.turno === i);
          const tabla = crearTabla(filas, celdas);
          tabla.setAttribute('aria-labelledby', titulo.id);
          contenido.append(tabla);
          seccion.append(titulo, contenido);
          if (recursosDia) {
            const sinRecurso = [...new Set(filas.filter(fila => !recursoVigente(fila)).map(fila => fila.circuito))];
            const sinTarea = Object.entries(recursosDia[i] ?? {}).flatMap(([municipio, camiones]) => {
              const usados = new Set(filas.filter(fila => normalizarCodigo(municipioDeFila(fila)) === municipio).map(recursoVigente));
              return camiones.filter(camion => !usados.has(camion)).map(camion => camion + ' (Municipio ' + municipio + ')');
            });
            if (sinRecurso.length || sinTarea.length) {
              const aviso = crear('div', null, 'aviso-recursos');
              aviso.setAttribute('role', 'status');
              if (sinRecurso.length) aviso.append(crear('p', 'Circuitos sin recurso vigente: ' + sinRecurso.join(', ')));
              if (sinTarea.length) aviso.append(crear('p', 'Camiones sin tarea: ' + sinTarea.join(', ')));
              contenido.before(aviso);
            }
          }
          if (!filas.length) {
            const pie = tabla.createTBody().insertRow().insertCell();
            pie.colSpan = 6;
            pie.textContent = 'Sin filas en este turno';
          }
          if (modoEdicion && revision != null) {
            const acciones = crear('div', null, 'turno-acciones');
            const agregar = crear('button', 'Agregar fila');
            agregar.type = 'button';
            agregar.setAttribute('aria-label', 'Agregar fila a ' + nombre);
            agregar.addEventListener('click', () => abrirEdicion(i));
            acciones.append(agregar);
            titulo.after(acciones);
          }
          tablas.append(seccion);
          paneles.push({ seccion, celdas });
        });
        mostrarPendientes();
      }

      window.actualizarRecursosAsignador = () => {
        if (guardando || arrastre || JSON.stringify(parent.AZL.recursosDelDia()) === firmaRecursos) return;
        armarTurnos();
        if (dialogo.open) actualizarRecursosDialogo();
      };

      function crearTirador(tr, fila, nombre) {
        const tirador = crear('button', null, 'mover-fila');
        tirador.type = 'button';
        tirador.setAttribute('aria-label', 'Mover ' + nombre);
        tirador.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h10"/></svg>';
        let suprimirClick = false;
        tirador.addEventListener('pointerdown', evento => {
          if (evento.button !== 0 || !evento.isPrimary || guardando || arrastre) return;
          suprimirClick = false;
          tirador.setPointerCapture(evento.pointerId);
          arrastre = {
            id: evento.pointerId, fila, tr, x: evento.clientX, y: evento.clientY,
            inicioX: evento.clientX, inicioY: evento.clientY, activo: false, destino: null
          };
        });
        tirador.addEventListener('pointermove', evento => {
          if (arrastre?.id !== evento.pointerId || guardando) return;
          arrastre.x = evento.clientX;
          arrastre.y = evento.clientY;
          if (!arrastre.activo && Math.hypot(arrastre.x - arrastre.inicioX, arrastre.y - arrastre.inicioY) >= 5) {
            arrastre.activo = suprimirClick = true;
            tr.classList.add('fila-arrastrada');
            arrastre.frame = requestAnimationFrame(desplazarArrastre);
          }
          if (arrastre.activo) marcarDestino();
        });
        tirador.addEventListener('pointerup', evento => {
          if (arrastre?.id !== evento.pointerId) return;
          const destino = arrastre.activo ? arrastre.destino : null;
          terminarArrastre();
          if (destino) moverFila(fila, destino.turno, destino.referencia, destino.despues);
        });
        tirador.addEventListener('lostpointercapture', evento => {
          if (arrastre?.id === evento.pointerId) terminarArrastre();
        });
        tirador.addEventListener('click', evento => {
          if (suprimirClick && evento.detail) {
            suprimirClick = false;
            return;
          }
          if (!guardando) abrirMover(fila);
        });
        return tirador;
      }

      function marcarDestino() {
        const { x, y, fila } = arrastre;
        const elemento = document.elementFromPoint(x, y);
        const seccion = elemento?.closest('.turno');
        const tr = elemento?.closest('tbody tr');
        const referencia = filasPorElemento.get(tr);
        const despues = tr ? y > tr.getBoundingClientRect().top + tr.offsetHeight / 2 : false;
        const clase = referencia ? (despues ? 'soltar-despues' : 'soltar-antes') : 'soltar-turno';
        const anterior = arrastre.destino;
        const marcado = referencia ? tr : seccion;
        if (anterior && anterior.marcado === marcado && anterior.clase === clase) return;
        anterior?.marcado.classList.remove(anterior.clase);
        arrastre.destino = null;
        if (!seccion || referencia === fila) return;
        marcado.classList.add(clase);
        arrastre.destino = { marcado, clase, turno: Number(seccion.dataset.turno), referencia, despues };
      }

      function desplazarArrastre() {
        if (!arrastre?.activo) return;
        const borde = 56;
        const paso = arrastre.y < borde ? -12 : arrastre.y > window.innerHeight - borde ? 12 : 0;
        if (paso) {
          window.scrollBy(0, paso);
          marcarDestino();
        }
        arrastre.frame = requestAnimationFrame(desplazarArrastre);
      }

      function terminarArrastre() {
        cancelAnimationFrame(arrastre.frame);
        arrastre.tr.classList.remove('fila-arrastrada');
        const destino = arrastre.destino;
        destino?.marcado.classList.remove(destino.clase);
        arrastre = null;
      }

      function abrirMover(fila) {
        const filas = filasPlanilla.filter(otra => otra.turno === fila.turno);
        const posicion = filas.indexOf(fila);
        const acciones = document.getElementById('mover-destinos');
        acciones.replaceChildren();
        const agregar = (titulo, turno, referencia, despues) => {
          const boton = crear('button', titulo);
          boton.type = 'button';
          boton.addEventListener('click', () => {
            dialogoMover.close();
            moverFila(fila, turno, referencia, despues);
          });
          acciones.append(boton);
        };
        if (posicion > 0) agregar('Subir una fila', fila.turno, filas[posicion - 1], false);
        if (posicion < filas.length - 1) agregar('Bajar una fila', fila.turno, filas[posicion + 1], true);
        turnos.forEach(({ nombre }, i) => {
          if (i !== fila.turno) agregar('Pasar a ' + nombre, i);
        });
        dialogoMover.showModal();
      }

      function moverFila(fila, turno, referencia, despues) {
        if (!modoEdicion || guardando || revision == null || !filasPlanilla.includes(fila)) return;
        const recursos = parent.AZL.recursosDelDia();
        if (turno !== fila.turno && !recursos) {
          estadoRecursos.textContent = 'Esperá a que se carguen los recursos para mover el circuito a otro turno.';
          estadoRecursos.hidden = false;
          return;
        }
        const camion = recursosDe(turno, municipioDeFila(fila), recursos).includes(fila.camion) ? fila.camion : '';
        const movida = turno === fila.turno ? fila : { ...fila, turno, camion };
        const nuevas = filasPlanilla.filter(otra => otra !== fila);
        const ultima = nuevas.findLastIndex(otra => otra.turno === turno);
        const destino = referencia ? nuevas.indexOf(referencia) + Number(despues) : ultima + 1;
        nuevas.splice(!referencia && ultima < 0 ? nuevas.length : destino, 0, movida);
        if (nuevas.every((otra, i) => otra === filasPlanilla[i])) return;
        guardarCambioDirecto(nuevas, movida, 'mover');
      }

      function cambiarCamion(fila, entrada) {
        const camion = entrada.value;
        if (camion === fila.camion) {
          entrada.value = camion;
          return;
        }
        const recursos = parent.AZL.recursosDelDia();
        if (!modoEdicion || guardando || revision == null || !filasPlanilla.includes(fila) || !recursos
          || (camion && !recursosDe(fila.turno, municipioDeFila(fila), recursos).includes(camion))) {
          entrada.value = fila.camion;
          return;
        }
        const editada = { ...fila, camion };
        const nuevas = filasPlanilla.map(otra => otra === fila ? editada : otra);
        guardarCambioDirecto(nuevas, editada, null, () => { entrada.value = fila.camion; });
      }

      function mostrarPendientes() {
        const hoy = inicioDia(Date.now());
        const diasSeleccionados = Number(rango.value);
        const inicio = hoy - diasSeleccionados * DIA;
        leyendaAtencion.hidden = !datos;
        // Tres colores: amarillo (ayer), naranja (antes de ayer y hace 3 a 6 días) y rojo (hace 7 días o más)
        const referencias = edades.slice(diasSeleccionados).filter(({ clase }) => clase !== 'edad-tres-a-seis').map(({ clase, etiqueta }) => {
          const texto = clase === 'edad-siete-o-mas' ? etiqueta
            : clase === 'edad-anteayer' ? 'Atendidos antes de ayer o hace 3 a 6 días' : 'Atendidos ' + etiqueta.toLowerCase();
          return crear('span', texto, clase);
        });
        leyendaAtencion.replaceChildren(crear('strong', 'Colores según la última atención'), ...referencias);
        const anchosTurnos = paneles.map(({ seccion, celdas }) => {
          const longitudes = [];
          for (const { fila, cantidad: total, pendientes, detalle } of celdas) {
            const puntos = puntosCircuito(fila.circuito);
            total.textContent = puntos.length || '—';
            total.setAttribute('aria-description', puntos.length && !inventario.has(fila.circuito)
              ? 'Cantidad tomada de la planilla de referencia' : '');
            if (!puntos.length || !datos) continue;
            const atenciones = datos.ultimasAtenciones.get(fila.circuito);
            const { cantidad, grupos } = puntosPendientes(puntos, fila, atenciones, hoy, inicio);
            pendientes.textContent = cantidad;
            detalle.textContent = cantidad ? '' : '—';
            // Un solo tramo: se unen los puntos pendientes de todas las antigüedades y cada punto conserva su color
            const porPunto = [];
            grupos.forEach((tramos, edad) => tramos.forEach(([d, h]) => { for (let p = d; p <= h; p++) porPunto.push([p, edad]); }));
            porPunto.sort((x, y) => x[0] - y[0]);
            const corridas = [];
            for (const [p, edad] of porPunto) {
              const ultima = corridas.at(-1);
              if (ultima && ultima.hasta === p - 1) { ultima.hasta = p; ultima.puntos.push([p, edad]); } else corridas.push({ desde: p, hasta: p, puntos: [[p, edad]] });
            }
            const linea = crear('span', null, 'tramo-unico');
            let anchoMaximo = 0;
            corridas.forEach(({ desde, hasta, puntos }, i) => {
              // Mismo formato de siempre: "a-b" (guion común), coma pegada al tramo y un solo espacio entre tramos ("1-5, 8-9")
              const tramo = desde === hasta ? String(desde) : desde + '-' + hasta;
              const renglon = crear('span', tramo + (i < corridas.length - 1 ? ',' : ''), 'range-piece');
              if (i) linea.append(' ');
              // Segmentos de color dentro del tramo (rachas consecutivas de la misma antigüedad)
              const segmentos = [];
              for (const [p, edad] of puntos) {
                const s = segmentos.at(-1);
                if (s && s.edad === edad) { s.hasta = p; s.n++; } else segmentos.push({ edad, desde: p, hasta: p, n: 1 });
              }
              renglon.setAttribute('aria-description', segmentos.map(s => (edades[s.edad].etiqueta === 'Ayer' || edades[s.edad].etiqueta === 'Antes de ayer'
                ? 'Atendidos ' + edades[s.edad].etiqueta.toLowerCase() : edades[s.edad].etiqueta) + ': '
                + (s.desde === s.hasta ? s.desde : s.desde + '-' + s.hasta)).join(' · '));
              // Un solo color por tramo: el que más puntos tiene (amarillo = ayer, naranja = antes de ayer y 3 a 6 días, rojo = 7 días o más).
              // Si empatan, gana el más antiguo.
              const cuenta = [0, 0, 0];
              for (const s of segmentos) cuenta[s.edad === 0 ? 0 : s.edad === 3 ? 2 : 1] += s.n;
              const ganador = cuenta.reduce((m, n, i) => n >= cuenta[m] ? i : m, 0);
              renglon.classList.add(['edad-ayer', 'edad-anteayer', 'edad-siete-o-mas'][ganador]);
              anchoMaximo += renglon.textContent.length + 1;
              linea.append(renglon);
            });
            detalle.append(linea);
            longitudes.push(anchoMaximo);
          }
          // Las listas más largas orientan el ancho, con límites para que se sigan leyendo las otras columnas.
          const [mayor = 0, segunda = mayor] = longitudes.sort((a, b) => b - a);
          const ancho = Math.min(40, Math.max(22, 18 + (mayor + segunda) / 4));
          seccion.style.setProperty('--ancho-puntos', ancho + '%');
          return 'minmax(0, ' + (0.55 + ancho / 60).toFixed(3) + 'fr)';
        });
        tablas.style.setProperty('--anchos-turnos', anchosTurnos.join(' '));
      }

      document.addEventListener('copy', evento => {
        const seleccion = window.getSelection();
        if (!evento.clipboardData || !seleccion?.rangeCount || seleccion.isCollapsed) return;
        const nodo = seleccion.getRangeAt(0).commonAncestorContainer;
        const elemento = nodo.nodeType === Node.ELEMENT_NODE ? nodo : nodo.parentElement;
        if (!elemento?.closest('#tablas td.result')) return;
        const texto = seleccion.toString().trim();
        if (!/[\r\n]/.test(texto)) return;
        evento.clipboardData.setData('text/plain', texto.replace(/\s*[\r\n]+\s*/g, ', '));
        evento.preventDefault();
      });

      async function bajarBase(nombre) {
        const url = COM2.URL + '/storage/v1/object/public/bases/' + nombre + '.json.gz';
        const respuesta = await fetch(url, {   // si no cambió, Supabase contesta 304 y se usa la guardada
          cache: 'no-cache', signal: AbortSignal.timeout(45000)
        });
        if (!respuesta.ok) throw new Error('Zona Limpia: HTTP ' + respuesta.status);
        const bytes = new Uint8Array(await respuesta.arrayBuffer());
        if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
          const flujo = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
          return new Response(flujo).json();
        }
        return JSON.parse(new TextDecoder().decode(bytes));
      }

      async function cargarInventario() {
        try {
          const base = await bajarBase('contenedores');
          const circuitoDe = lector(base, 'circuito');
          const puntoDe = lector(base, 'numero_contenedor');
          const municipioDe = lector(base, 'municipio');
          const catalogo = new Map();
          for (const fila of base.registros) {
            const circuito = normalizarCodigo(circuitoDe(fila));
            const punto = Number(puntoDe(fila));
            if (!circuito || !Number.isSafeInteger(punto) || punto < 1) continue;
            if (!catalogo.has(circuito)) {
              catalogo.set(circuito, { municipio: normalizarCodigo(municipioDe(fila)), puntos: new Set() });
            }
            catalogo.get(circuito).puntos.add(punto);
          }
          for (const entrada of catalogo.values()) entrada.puntos = [...entrada.puntos].sort((a, b) => a - b);
          inventario = catalogo;
          mostrarPendientes();
          if (puedeEditar) {
            cargarOpcionesCircuito();
            if (dialogo.open) mostrarInfoEdicion();
          }
        } catch (error) {
          console.warn('Error al cargar el inventario de circuitos', error);
        }
      }

      function consultaPlanilla() {
        return COM2.sb.from('zona_limpia_semaforo_planilla');
      }

      async function cargarPlanilla() {
        revision = null;
        botonEdicion.disabled = true;
        reintentar.hidden = true;
        try {
          const { data, error } = await consultaPlanilla().select('filas,revision').eq('id', 1)
            .abortSignal(AbortSignal.timeout(12000)).single();
          if (error) throw error;
          filasPlanilla = data.filas ?? filasIniciales;
          revision = data.revision;
          estadoPlanilla.hidden = true;
        } catch (error) {
          console.warn('Error al cargar la planilla del semáforo', error);
          estadoPlanilla.textContent = 'No se pudo cargar la planilla guardada. Se muestran las tablas de referencia.';
          filasPlanilla = filasIniciales;
          estadoPlanilla.hidden = false;
          reintentar.hidden = false;
        } finally {
          if (revision == null) modoEdicion = false;
          actualizarBotonEdicion();
          armarTurnos();
        }
      }

      function actualizarBotonEdicion() {
        botonEdicion.disabled = revision == null || guardando;
        botonEdicion.setAttribute('aria-pressed', String(modoEdicion));
      }

      function cargarOpcionesCircuito() {
        const seleccion = campos.circuito.value;
        const codigos = new Set(totalesReferencia.keys());
        for (const codigo of inventario.keys()) {
          if (municipioCircuito(codigo)) codigos.add(codigo);
        }
        const opcion = (texto, valor) => {
          const el = crear('option', texto);
          el.value = valor;
          return el;
        };
        const sinCircuito = opcion('Elegí un circuito', '');
        sinCircuito.disabled = true;
        campos.circuito.replaceChildren(sinCircuito,
          ...[...codigos].sort().map(codigo => opcion(codigo, codigo)),
          opcion('Otro circuito…', otroCircuito));
        campos.circuito.value = seleccion;
      }

      function codigoSeleccionado() {
        return normalizarCodigo(campos.circuito.value === otroCircuito
          ? campos.circuito_nuevo.value : campos.circuito.value);
      }

      function actualizarCircuitoNuevo() {
        const manual = campos.circuito.value === otroCircuito;
        etiquetaCircuitoNuevo.hidden = campos.circuito_nuevo.disabled = !manual;
        campos.circuito_nuevo.required = manual;
      }

      function mostrarInfoEdicion() {
        const codigo = codigoSeleccionado();
        const puntos = puntosCircuito(codigo).length;
        if (!codigo) {
          infoEdicion.textContent = campos.circuito.value === otroCircuito
            ? 'Ingresá el código del circuito.' : 'Elegí un circuito de la lista.';
          return;
        }
        infoEdicion.textContent = puntos
          ? puntos + ' puntos. Para asignar un tramo, ingresá un rango como 1–54.'
          : 'Los puntos se mostrarán cuando haya datos.';
      }

      function abrirEdicion(turno, fila = null) {
        if (!modoEdicion || guardando || revision == null || dialogo.open) return;
        editando = fila;
        turnoEdicion = turno;
        conflicto = false;
        formulario.reset();
        const codigo = fila?.circuito ?? '';
        campos.circuito.value = codigo;
        if (codigo && campos.circuito.value !== codigo) {
          campos.circuito.value = otroCircuito;
          campos.circuito_nuevo.value = codigo;
        }
        actualizarCircuitoNuevo();
        document.getElementById('campo-camion-nuevo').hidden = Boolean(fila);
        if (!fila) actualizarRecursosDialogo();
        campos.tramo.value = fila?.desde == null ? '' : fila.desde + '–' + fila.hasta;
        eliminar.hidden = !fila;
        eliminar.disabled = guardar.disabled = false;
        errorEdicion.hidden = true;
        document.getElementById('editar-titulo').textContent = fila ? 'Editar fila' : 'Agregar fila';
        mostrarInfoEdicion();
        dialogo.showModal();
      }

      async function guardarPlanilla(nuevas) {
        guardando = true;
        actualizarBotonEdicion();
        tablas.inert = true;
        estadoPlanilla.hidden = true;
        try {
          const { data, error } = await consultaPlanilla().update({ filas: nuevas })
            .eq('id', 1).eq('revision', revision).select('revision')
            .abortSignal(AbortSignal.timeout(12000)).maybeSingle();
          if (error) throw error;
          if (!data) return false;
          filasPlanilla = nuevas;
          revision = data.revision;
        } finally {
          guardando = false;
          tablas.inert = false;
          actualizarBotonEdicion();
        }
        parent.AZL.planillaGuardada(nuevas);
        return true;
      }

      async function guardarCambioDirecto(nuevas, fila, control, deshacer) {
        try {
          if (await guardarPlanilla(nuevas)) {
            armarTurnos();
            paneles[fila.turno].celdas.find(celda => celda.fila === fila)?.controles[control]?.focus({ preventScroll: true });
            return;
          }
          await cargarPlanilla();
          if (revision == null) return;
          estadoPlanilla.textContent = 'La planilla cambió. Se cargó la última versión. Volvé a intentar el cambio.';
        } catch (error) {
          console.warn('Error al guardar la planilla del semáforo', error);
          deshacer?.();
          estadoPlanilla.textContent = 'No se pudo confirmar el guardado. Volvé a intentar el cambio.';
        }
        estadoPlanilla.hidden = false;
      }

      async function guardarEdicion(fila) {
        if (!modoEdicion || revision == null || guardando || conflicto) return;
        const nuevas = [...filasPlanilla];
        const indice = editando ? nuevas.indexOf(editando) : -1;
        if (indice >= 0) nuevas.splice(indice, 1, ...(fila ? [fila] : []));
        else nuevas.push(fila);

        formulario.setAttribute('aria-busy', 'true');
        cancelar.disabled = eliminar.disabled = guardar.disabled = true;
        errorEdicion.hidden = true;
        try {
          if (!await guardarPlanilla(nuevas)) {
            conflicto = true;
            errorEdicion.textContent = 'La planilla cambió desde que la abriste o tu permiso cambió. Cerrá esta edición para cargar la última versión.';
            errorEdicion.hidden = false;
            return;
          }
          const turno = fila?.turno ?? editando.turno;
          dialogo.close();
          armarTurnos();
          const panel = paneles[turno];
          const volver = panel.celdas.find(celda => celda.fila === fila)?.controles.editar
            ?? panel.seccion.querySelector('.turno-acciones button');
          volver.focus({ preventScroll: true });
        } catch (error) {
          console.warn('Error al guardar la planilla del semáforo', error);
          errorEdicion.textContent = 'No se pudo confirmar el guardado. Podés reintentar.';
          errorEdicion.hidden = false;
        } finally {
          formulario.removeAttribute('aria-busy');
          cancelar.disabled = false;
          eliminar.disabled = guardar.disabled = conflicto;
        }
      }

      function prepararEditor() {
        botonEdicion.hidden = false;
        cargarOpcionesCircuito();
        botonEdicion.addEventListener('click', () => {
          if (revision == null || guardando) return;
          modoEdicion = !modoEdicion;
          actualizarBotonEdicion();
          armarTurnos();
        });
        const actualizarTramo = () => {
          if (codigoSeleccionado() !== editando?.circuito) campos.tramo.value = '';
          mostrarInfoEdicion();
          actualizarRecursosDialogo();
        };
        campos.circuito.addEventListener('change', () => {
          actualizarCircuitoNuevo();
          actualizarTramo();
        });
        campos.circuito_nuevo.addEventListener('input', () => { mostrarInfoEdicion(); actualizarRecursosDialogo(); });
        campos.circuito_nuevo.addEventListener('change', actualizarTramo);
        formulario.addEventListener('submit', evento => {
          evento.preventDefault();
          const circuito = codigoSeleccionado();
          const municipio = municipioCircuito(circuito) || (circuito === editando?.circuito ? editando.municipio : '');
          const tramo = campos.tramo.value.trim();
          const limites = /^(\d+)\s*[-–]\s*(\d+)$/.exec(tramo);
          const desde = limites ? Number(limites[1]) : null;
          const hasta = limites ? Number(limites[2]) : null;
          if (!municipio || (tramo && (!desde || hasta < desde || hasta > 2147483647))) {
            errorEdicion.textContent = !municipio
              ? 'Ingresá un circuito cuyo código permita identificar el municipio.'
              : 'Si asignás un tramo, usá un rango válido como 1–54.';
            errorEdicion.hidden = false;
            return;
          }
          const recursos = parent.AZL.recursosDelDia();
          const municipioCambio = editando && municipio !== municipioDeFila(editando);
          if (municipioCambio && !recursos) {
            errorEdicion.textContent = 'Esperá a que se carguen los recursos para cambiar el circuito de municipio.';
            errorEdicion.hidden = false;
            return;
          }
          const elegido = editando?.camion ?? campos.camion.value;
          const camion = editando && !municipioCambio
            ? elegido : recursosDe(turnoEdicion, municipio, recursos).includes(elegido) ? elegido : '';
          guardarEdicion({
            circuito, municipio, desde, hasta,
            turno: turnoEdicion, camion
          });
        });
        cancelar.addEventListener('click', () => dialogo.close());
        eliminar.addEventListener('click', () => {
          if (editando && confirm('¿Eliminar esta fila de la planilla?')) guardarEdicion(null);
        });
        dialogo.addEventListener('cancel', evento => {
          if (guardando) evento.preventDefault();
        });
        dialogo.addEventListener('close', () => {
          if (conflicto) cargarPlanilla();
        });
      }

      async function cargar() {
        if (consultando) return;
        consultando = true;
        tablas.setAttribute('aria-busy', 'true');
        try {
          datos = preparar(await bajarBase('zona-limpia'));
          mostrarPendientes();
          estadoBase.hidden = true;
          estadoBase.textContent = '';
        } catch (error) {
          console.warn('Error al cargar Zona Limpia', error);
          estadoBase.textContent = datos
            ? 'No se pudo consultar Zona Limpia. Se muestran los últimos datos cargados.'
            : 'No se pudo consultar Zona Limpia. Recargá la página o cambiá el rango para reintentar.';
          estadoBase.hidden = false;
        } finally {
          tablas.removeAttribute('aria-busy');
          consultando = false;
          document.getElementById('dashboard').hidden = false;
          COM2.carga.listo();
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        if (typeof window.COM2?.acceso !== 'function') {
          document.querySelector('.com2-rueda').hidden = true;
          document.querySelector('.com2-carga-t').textContent = 'Abrí esta página desde COM 2 para consultar los circuitos.';
          return;
        }
        const perfil = await COM2.acceso();
        if (!perfil) return;
        if (!turnos.length) {
          COM2.carga.error('No se pudo cargar la planilla de circuitos.', () => location.reload());
          return;
        }
        puedeEditar = ['auxiliar', 'sup_gral', 'admin'].includes(perfil.rol);
        if (puedeEditar) prepararEditor();
        reintentar.addEventListener('click', cargarPlanilla);
        armarTurnos();
        rango.addEventListener('change', () => {
          mostrarPendientes();
          cargar();
        });
        await Promise.all([cargarPlanilla(), cargar(), cargarInventario()]);
      });
    })();
  <\/script>
</body>
</html>
</script>
<script>
(() => {
'use strict';
const T_PLANILLA = 'zona_limpia_semaforo_planilla';     // planilla del Semáforo (camión de cada circuito): solo se lee
const T_REC = 'zona_limpia_asignador_recursos';          // diferencias de recursos de cada día
const T_PLAN = 'zona_limpia_asignador_plan';             // asignaciones del día
const T_GOL = 'zona_limpia_asignador_gol';               // última base que se cargó para el equipo
const ROLES_EDITAN = ['auxiliar', 'sup_gral', 'admin'];  // mismos roles que editan la planilla del Semáforo
const DIA = 24 * 3600e3, DESFASE = 3 * 3600e3;           // las fechas de las bases son segundos de reloj de Montevideo
const TURNOS = ['Matutino', 'Vespertino', 'Nocturno'];
const MUNIS = ['A', 'C', 'CH', 'D', 'E', 'F', 'G'];      // el municipio B no se asigna
const MUN_INICIO = ['D', 'F', 'E'];                      // municipios que se abren por defecto en GOL
const COLUMNAS_MUN = 3;                                  // tablas por fila en escritorio
const GENERICOS = ['MC DINALI', 'MC COM'];               // transportistas genéricos: sirven para el Semáforo, no para GOL
const FALLIDO = /no visitado|omitido|no se pudo|no realizado/;
const ETQ = { ayer: 'Atendidos ayer', antes: 'Atendidos antes de ayer', tres: 'Atendidos hace 3 a 6 días', siete: 'Hace 7 días o más / sin registro' };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const validCirc = c => /^(CH|[A-G])\d{1,3}$/.test(c);
const munDe = c => (/^(CH|[A-G])(?=\d)/.exec(c) || [''])[1];
const natCmp = (a, b) => String(a).localeCompare(String(b), 'es-UY', { numeric: true });
const inicioDia = ms => Math.floor((ms - DESFASE) / DIA) * DIA + DESFASE;
const fechaMontevideo = () => new Date(Date.now() - DESFASE).toISOString().slice(0, 10);
const esGenerico = e => GENERICOS.includes(String(e).trim().toUpperCase());
const celdaTsv = s => { s = String(s ?? '').replace(/[\t\r\n]+/g, ' '); return /^\s*[=+@-]/.test(s) ? "'" + s : s; };

/* ---------- tramos ---------- */
function tramos(puntos, tol = 0) {
  const p = [...new Set(puntos)].sort((a, b) => a - b), out = [];
  for (const x of p) {
    const u = out.at(-1);
    if (u && x - u[1] - 1 <= tol) u[1] = x;
    else out.push([x, x]);
  }
  return out;
}
const texto = t => t.map(([a, b]) => a === b ? a : a + '-' + b).join(', ');     // formato del sistema: "1-5, 8, 20-41"

/* ---------- planilla del Semáforo: turno y camión de cada circuito ---------- */
const circTotal = new Map();
let PL = [];   // filas: { turno 0-2, municipio, camion, circuito, total }
const deArchivo = () => (window.PlanillaZonaLimpia || []).flatMap((t, i) => t.filas.map(f => ({ turno: i, municipio: f.municipio, camion: f.camion, circuito: f.circuito, total: /^\d+$/.test(f.cantidad) ? +f.cantidad : 0 })));
function armarPlanilla(filas) {
  PL = filas;
  circTotal.clear();
  for (const f of PL) {
    if (f.total) circTotal.set(f.circuito, Math.max(circTotal.get(f.circuito) || 0, f.total));
  }
}
function recursosBase() {
  const r = {}; TURNOS.forEach(t => { r[t] = {}; });
  PL.forEach(f => { const L = (r[TURNOS[f.turno]][f.municipio] ||= []); if (f.camion && !L.includes(f.camion)) L.push(f.camion); });
  return r;
}

function armarPlanillaGuardada(filas) {
  armarPlanilla(filas.filter(f => [0, 1, 2].includes(f.turno) && f.circuito).map(f => ({
    turno: f.turno, municipio: String(f.municipio).trim().toUpperCase(), camion: String(f.camion || '').trim(),
    circuito: String(f.circuito).trim().toUpperCase(), total: 0
  })));
}
async function cargarPlanilla() {
  S.planillaOk = false;
  try {
    const { data, error } = await COM2.sb.from(T_PLANILLA).select('filas').eq('id', 1).abortSignal(AbortSignal.timeout(12000)).single();
    if (error) throw error;
    if (Array.isArray(data.filas)) {
      armarPlanillaGuardada(data.filas);
    } else if (data.filas === null && deArchivo().length) {
      armarPlanilla(deArchivo());
    } else {
      throw new Error('Planilla de circuitos no disponible');
    }
    S.planillaOk = true;
    delete S.err.planilla;
  } catch (e) {
    console.warn('Planilla del Semáforo', e);
    const referencia = deArchivo();
    armarPlanilla(referencia);
    S.err.planilla = referencia.length
      ? 'Sin conexión. Se muestra la planilla de referencia en solo lectura.'
      : 'No se pudo leer la planilla de circuitos.';
  }
  aplicarOV();
}

/* ---------- estado ---------- */
const S = { fecha: fechaMontevideo(), vista: 'turno', turno: null, inv: null, zl: null, asig: null, gol: null, planillaOk: false, err: {},
  golRevision: -1, golActualizada: null, golVence: 0, golConsultando: false, golError: '',
  quitar: 1,            // días previos que se descuentan además de hoy
  completo: 80, golRojo: 100, golNegro: 170, gap: 5, seleccionesGol: new Map(), munSel: [],
  puedeEditar: false, diaOk: false };
const edita = () => S.puedeEditar && S.diaOk && !pendientes && !leyendo;
const golVigente = () => S.gol && Date.now() < S.golVence;
const puedeAsignar = () => edita() && !S.importando && S.planillaOk && S.zl && S.inv && golVigente() && S.fecha === fechaMontevideo();

/* ---------- datos compartidos del día (Supabase) ---------- */
let OV = { add: {}, del: {} };      // diferencias de recursos respecto de la planilla
let revRec = null;                  // revisión leída de la fila del día (null = todavía no existe)
let R = recursosBase();             // recursos del día = planilla + diferencias
let PLAN = [];                      // asignaciones del día
let pendientes = false, leyendo = false, cargaId = 0;

const limpiarOV = x => { const o = { add: {}, del: {} }; for (const k of ['add', 'del']) for (const [t, ms] of Object.entries(x?.[k] || {})) if (TURNOS.includes(t)) for (const [m, L] of Object.entries(ms || {})) if (Array.isArray(L)) (o[k][t] ||= {})[m] = L.map(String); return o; };
function aplicarOV() {
  R = recursosBase();
  TURNOS.forEach(t => Object.keys(R[t]).forEach(m => { R[t][m] = R[t][m].filter(e => !(OV.del[t]?.[m] || []).includes(e)); }));
  TURNOS.forEach(t => Object.entries(OV.add[t] || {}).forEach(([m, L]) => { const X = (R[t][m] ||= []); L.forEach(e => { if (!X.includes(e)) X.push(e); }); }));
}
function avisar(msg) { $('aviso').textContent = msg || ''; $('aviso').hidden = !msg; }

async function cargarDia() {
  const id = ++cargaId, f = S.fecha;
  const leePlan = S.vista === 'plan';
  leyendo = true;
  try {
    const [rec, plan] = await Promise.all([
      COM2.sb.from(T_REC).select('diferencias,revision').eq('fecha', f).abortSignal(AbortSignal.timeout(12000)).maybeSingle(),
      leePlan ? COM2.sb.from(T_PLAN).select('turno,circuito,recurso,tramos,criterio,edades,actualizado').eq('fecha', f).abortSignal(AbortSignal.timeout(12000)) : null
    ]);
    if (rec.error) throw rec.error;
    if (plan?.error) throw plan.error;
    if (id !== cargaId) return;
    OV = limpiarOV(rec.data?.diferencias); revRec = rec.data ? rec.data.revision : null; aplicarOV();
    if (plan) PLAN = plan.data.map(p => ({ turno: TURNOS[p.turno], emp: p.recurso, c: p.circuito, tramos: p.tramos, origen: p.criterio, edades: p.edades, revision: p.actualizado }))
      .sort((a, b) => TURNOS.indexOf(a.turno) - TURNOS.indexOf(b.turno) || natCmp(a.c, b.c));
    S.diaOk = true;
  } catch (e) {
    if (id !== cargaId) return;
    console.warn('Datos del día', e); S.diaOk = false;
    OV = { add: {}, del: {} }; revRec = null; PLAN = []; aplicarOV();
    avisar(leePlan ? 'No se pudieron leer los recursos y el plan de este día. Se volverá a intentar.'
      : 'No se pudieron leer los recursos de este día. Se volverá a intentar.');
  } finally {
    if (id === cargaId) leyendo = false;
  }
}
async function guardarCambio(fn) {
  pendientes = true;
  avisar('Guardando…');
  render();
  let mensaje = '';
  try {
    await fn();
  } catch (e) {
    console.warn('Asignador', e);
    mensaje = ['23505', '40001', 'AZL_CONFLICTO'].includes(e.code)
      ? 'Otra persona cambió los datos. Revisá el plan actualizado y repetí el cambio.'
      : 'No se pudo confirmar el guardado. Revisá los datos y volvé a intentar.';
  } finally {
    await cargarDia();
    pendientes = false;
    if (S.diaOk) avisar(mensaje);
    render();
  }
}

/* Recursos */
function cambiarRecurso(t, m, v, quitar) {
  const esBase = (recursosBase()[t]?.[m] || []).includes(v);
  const lista = o => ((o[t] ||= {})[m] ||= []), sacar = o => { o[t] = o[t] || {}; o[t][m] = (o[t][m] || []).filter(x => x !== v); };
  if (quitar) { if (esBase && !lista(OV.del).includes(v)) lista(OV.del).push(v); sacar(OV.add); }
  else { sacar(OV.del); if (!esBase && !lista(OV.add).includes(v)) lista(OV.add).push(v); }
  for (const k of ['add', 'del']) for (const tt of Object.keys(OV[k])) {     // no se guardan listas vacías
    for (const mm of Object.keys(OV[k][tt])) if (!OV[k][tt][mm].length) delete OV[k][tt][mm];
    if (!Object.keys(OV[k][tt]).length) delete OV[k][tt];
  }
  aplicarOV();
}
function guardarRecursos() {
  guardarCambio(async () => {
    const tabla = COM2.sb.from(T_REC);
    const consulta = revRec == null
      ? tabla.insert({ fecha: S.fecha, diferencias: OV })
      : tabla.update({ diferencias: OV }).eq('fecha', S.fecha).eq('revision', revRec);
    await confirmarCambio(consulta.select('revision').maybeSingle());
  });
}

/* Plan */
async function confirmarCambio(consulta) {
  const { data, error } = await consulta.abortSignal(AbortSignal.timeout(12000));
  if (error) throw error;
  if (!data) throw Object.assign(new Error('Cambio simultáneo'), { code: 'AZL_CONFLICTO' });
}
function quitarAsignacionGuardada(asignacion) {
  if (!edita()) return;
  const consulta = COM2.sb.from(T_PLAN).delete().eq('fecha', S.fecha)
    .eq('turno', TURNOS.indexOf(asignacion.turno)).eq('circuito', asignacion.c).eq('actualizado', asignacion.revision);
  guardarCambio(() => confirmarCambio(consulta.select('circuito').maybeSingle()));
}
function vaciarPlan() {
  const filas = PLAN.map(p => ({ turno: TURNOS.indexOf(p.turno), circuito: p.c, actualizado: p.revision }));
  guardarCambio(async () => {
    const { error } = await COM2.sb.rpc('asignador_zl_vaciar_plan', { dia: S.fecha, filas })
      .abortSignal(AbortSignal.timeout(12000));
    if (error) throw error;
  });
}

/* ---------- lectura de bases (bucket público de Supabase, solo lectura) ---------- */
async function bajar(nombre) {
  const res = await fetch(COM2.URL + '/storage/v1/object/public/bases/' + nombre + '.json.gz', {
    cache: 'no-cache', signal: AbortSignal.timeout(45000)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const b = new Uint8Array(await res.arrayBuffer());
  const txt = b[0] === 0x1f && b[1] === 0x8b
    ? await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text() : new TextDecoder().decode(b);
  return JSON.parse(txt);
}
function lector(base) {
  if (!Array.isArray(base.columnas) || !Array.isArray(base.registros) || !base.registros.length) {
    throw new Error('La base no trae registros');
  }
  const cols = base.columnas.map(c => c.trim().toLowerCase()), fechas = new Set((base.fechas || []).map(c => c.trim().toLowerCase()));
  return nombre => {
    const i = cols.indexOf(nombre); if (i < 0) throw new Error('Falta la columna ' + nombre);
    const dic = base.dicc?.[base.columnas[i]];
    if (dic) return r => dic[r[i]];
    if (fechas.has(nombre)) return r => r[i] == null || r[i] === '' ? NaN : r[i] * 1000 + DESFASE;
    return r => r[i];
  };
}
function leerFecha(valor) {
  if (typeof valor === 'number') return valor;
  if (!valor) return NaN;
  const fecha = String(valor).trim().replace(' ', 'T');
  return Date.parse(/(?:z|[+-]\d{2}:?\d{2})$/i.test(fecha) ? fecha : fecha + '-03:00');
}
async function cargarInv() {
  const b = await bajar('contenedores'), g = lector(b), [cir, num] = ['circuito', 'numero_contenedor'].map(g), M = new Map();
  for (const r of b.registros) {
    const c = String(cir(r) ?? '').trim().toUpperCase(), p = Number(num(r));
    if (!validCirc(c) || !Number.isSafeInteger(p) || p < 1) continue;
    M.set(c, Math.max(M.get(c) || 0, p));
  }
  if (!M.size) throw new Error('El inventario no trae circuitos válidos');
  S.inv = M;
}
// Zona Limpia, igual que el Semáforo: la última atención de cada punto (para descontar lo realizado y guardar la antigüedad)
// y los puntos que ya están en estado "Asignado" (despachados y sin resolver, de las últimas 24 h): no se vuelven a asignar.
async function cargarZL() {
  const b = await bajar('zona-limpia'), g = lector(b);
  const [cir, pto, fec, inc, est, rec] = ['circuito', 'contenedor', 'fecha_resuelto', 'incidente', 'estado', 'fecha_de_reclamo'].map(g);
  const ahora = Date.now(), M = new Map(), A = new Map();
  for (const r of b.registros) {
    const e = String(est(r) ?? '').trim().toLowerCase(), f = leerFecha(fec(r));
    const c = String(cir(r) ?? '').trim().toUpperCase(), p = Number(pto(r));
    if (!validCirc(c) || !Number.isSafeInteger(p) || p < 1) continue;
    if (e === 'asignado') {
      const fecha = leerFecha(rec(r));
      if (!Number.isFinite(f) && fecha >= ahora - DIA && fecha <= ahora) {
        (A.get(c) || A.set(c, new Set()).get(c)).add(p);
      }
      continue;
    }
    if (!Number.isFinite(f) || f > ahora) continue;
    const i = String(inc(r) ?? '').trim().toLowerCase();
    if (!i || FALLIDO.test(i) || !['cerrado', 'resuelto'].includes(e)) continue;
    const m = M.get(c) || M.set(c, new Map()).get(c);
    if ((m.get(p) ?? -Infinity) < f) m.set(p, f);

async function leerArchivoGol(file) {
  if (!window.XLSX) throw new Error('No se pudo cargar el lector de planillas. Recargá la página.');
  const wb = /\.(csv|txt)$/i.test(file.name)
    ? XLSX.read((await file.text()).replace(/^\uFEFF/, ''), { type: 'string', raw: true })
    : XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array', cellNF: true });
  const name = wb.SheetNames.find(n => norm(n) === 'base gol') || wb.SheetNames[0];
  if (!name) throw new Error('El archivo no tiene hojas');
  const hoja = wb.Sheets[name];
  const inicio = XLSX.utils.decode_range(hoja['!ref'] || 'A1').s;
  const rows = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true, defval: '' });
  const h = (rows[0] || []).map(norm);
  const iC = h.indexOf('circuito'), iP = h.indexOf('posicion'), iA = h.findIndex(x => x.startsWith('% de acumulacion'));
  if (iC < 0 || iP < 0 || iA < 0) throw new Error('Faltan Circuito, Posición o % de acumulación');
  const M = new Map();
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const c = String(r[iC] || '').replace(/[\s_]/g, '').toUpperCase(), p = Number(r[iP]);
    if (!validCirc(c) || !Number.isSafeInteger(p) || p < 1) continue;
    const valor = String(r[iA] ?? '').trim().replace(/\s*%$/, '').trim();
    if (!/^-?\d+(?:[,.]\d+)?$/.test(valor)) throw new Error('Acumulación inválida en ' + c + ', punto ' + p);
    const celda = hoja[XLSX.utils.encode_cell({ r: inicio.r + i, c: inicio.c + iA })];
    const porcentajeExcel = typeof r[iA] === 'number' && /%/.test(celda?.z || '');
    const a = porcentajeExcel ? r[iA] * 100 : Number(valor.replace(',', '.'));
    if (!Number.isFinite(a) || a < 0) throw new Error('Acumulación inválida en ' + c + ', punto ' + p);
    const puntos = M.get(c) || M.set(c, new Map()).get(c);
    if (puntos.has(p) && puntos.get(p) !== a) throw new Error('Acumulaciones distintas para ' + c + ', punto ' + p);
    puntos.set(p, a);
  }
  if (!M.size) throw new Error('El archivo no tiene filas válidas de GOL');
  const filas = [...M].flatMap(([c, puntos]) => [...puntos].map(([p, a]) => [c, p, a]));
  if (filas.length > 50000) throw new Error('La Base GOL admite hasta 50.000 puntos');
  return filas;
}
let relojGol;
function usarGol({ revision, actualizada, vence_en, filas }) {
  if (revision <= S.golRevision) return;
  const porCircuito = new Map();
  for (const [c, p, a] of filas || []) {
    if (!porCircuito.has(c)) porCircuito.set(c, []);
    porCircuito.get(c).push({ p, a });
  }
  S.gol = actualizada ? porCircuito : null;
  S.golRevision = revision;
  S.golActualizada = actualizada;
  S.golVence = Date.parse(vence_en);
  S.seleccionesGol.clear();
  clearTimeout(relojGol);
  if (golVigente()) {
    relojGol = setTimeout(() => { if (S.vista === 'gol') render(); }, S.golVence - Date.now());
  }
}
async function cargarGol(file) {
  const filas = await leerArchivoGol(file);

    .select('revision,actualizada,vence_en').abortSignal(AbortSignal.timeout(20000)).single();
  if (error) {

async function consultarGol() {
  if (S.golConsultando || S.importando) return false;
  S.golConsultando = true;
  const revision = S.golRevision, avisoAnterior = S.golError;
  try {
    const tabla = COM2.sb.from(T_GOL);
    const { data, error } = await tabla.select('revision,actualizada').eq('id', 1)
      .abortSignal(AbortSignal.timeout(12000)).single();
    if (error) throw error;
    if (data.revision > S.golRevision && !S.importando) {
      if (!data.actualizada) usarGol(data);
      else {
        const base = await tabla.select('revision,actualizada,vence_en,filas').eq('id', 1)
          .abortSignal(AbortSignal.timeout(20000)).single();
        if (base.error) throw base.error;
        if (!S.importando) usarGol(base.data);

const claveSeleccionGol = circuito => circuito + '|' + S.turno;
