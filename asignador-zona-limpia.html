    try { if (localStorage.getItem('com2.tema') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}
  </script>

  <style>
    /* Mismos colores y estructura que el Semáforo de Zona Limpia y el menú de COM 2 */
    :root {
      color-scheme: light;
      --bg: #f7f6f3; --panel: #fff; --text: #16243a; --muted: #526078; --line: #dbe3ed; --line-soft: #e8edf3;
      --line-celda: #ccd6e3; --surface: #f4f7fb; --blue: #184a91; --pending: #83410b; --ok: #137a55;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #16191f; --panel: #202631; --text: #edf2fa; --muted: #b0bfd3; --line: #404c60; --line-soft: #354051;
      --line-celda: #4e5c70; --surface: #252e3c; --blue: #a5c9ff; --pending: #ffd098; --ok: #7fd8b2;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.45 'DM Sans', system-ui, sans-serif; }
    button, select, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .wrap { width: 100%; max-width: 1920px; margin: 0 auto; padding: 14px clamp(12px, 1.3vw, 24px) 40px; }
    .dashboard { display: grid; gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .muted { color: var(--muted); }

    /* barra de herramientas */
    .toolbar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 22px; }
    .field { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .field > label { font-size: .82rem; font-weight: 700; }
    .toolbar select, .toolbar input[type=date], .toolbar input[type=number] {
      min-height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 3px 9px; font-size: .82rem; font-weight: 600;
    }
    .toolbar input[type=number] { width: 66px; }
    .btn-m { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; color: var(--blue); font-size: .8rem; font-weight: 700; cursor: pointer; }
    .btn-m:hover { border-color: var(--blue); }
    .btn-m.pri { background: #184a91; border-color: #184a91; color: #fff; }
    .source-status { margin: 0; font-size: .85rem; color: var(--muted); text-align: center; }
    .source-status.err { color: var(--pending); font-weight: 700; }
    .source-status .ok { color: var(--ok); }
    .source-status .err { color: var(--pending); }

    /* inicio: tarjetas como el menú de COM 2 */
    .portada { min-height: calc(100dvh - 62px - 70px); display: flex; align-items: flex-start; justify-content: center; }
    .cover { width: 100%; max-width: 860px; }
    .titulo-bloque { text-align: center; margin: 0 0 18px; font-size: .95rem; color: var(--muted); font-weight: 600; }
    .recursos-acc { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 40px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--panel); color: var(--text); cursor: pointer; font-weight: 700; }
    .recursos-acc:hover { border-color: var(--blue); }
    .recursos-acc span { font-weight: 500; font-size: .82rem; color: var(--muted); }
    .grid, .turnos-sel { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 812px; margin: 0 auto; }
    .grid .tile, .turnos-sel .tile { flex: 0 1 260px; }
    @media (max-width: 680px) { .grid .tile, .turnos-sel .tile { flex: 1 1 100%; } }
    .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; background: var(--panel); border: 1px solid var(--line);
      border-radius: 18px; padding: 2rem 1rem 1.6rem; text-decoration: none; color: inherit; cursor: pointer; font: inherit;
      box-shadow: 0 4px 20px rgba(26,23,20,.06), 0 1px 3px rgba(26,23,20,.05); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .tile:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(26,23,20,.10); border-color: var(--blue); }
    .tile.off { opacity: .45; cursor: not-allowed; pointer-events: none; }
    .turnos-sel .tile { padding: 2.4rem 1rem 2rem; }
    .turnos-sel .tile-name { font-size: 1.15rem; font-weight: 700; }
    .tile-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
    .tile-icon svg { width: 26px; height: 26px; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .tile-name { font-size: 14.5px; font-weight: 600; }
    .tile-sub { font-size: .8rem; color: var(--muted); text-align: center; }
    .acc-teal .tile-icon { background: #DCEDE4; } .acc-teal .tile-icon svg { stroke: #39745E; }
    .acc-blue .tile-icon { background: #DDECF4; } .acc-blue .tile-icon svg { stroke: #346A92; }
    .acc-amber .tile-icon { background: #F5E4CF; } .acc-amber .tile-icon svg { stroke: #9A642A; }
    .acc-violet .tile-icon { background: #E5DDF0; } .acc-violet .tile-icon svg { stroke: #6C5790; }
    [data-theme="dark"] .acc-teal .tile-icon { background: #1d3a2f; } [data-theme="dark"] .acc-teal .tile-icon svg { stroke: #6cc39f; }
    [data-theme="dark"] .acc-blue .tile-icon { background: #1a2d3d; } [data-theme="dark"] .acc-blue .tile-icon svg { stroke: #7fb2d9; }
    [data-theme="dark"] .acc-amber .tile-icon { background: #3a2c1a; } [data-theme="dark"] .acc-amber .tile-icon svg { stroke: #e0a867; }
    [data-theme="dark"] .acc-violet .tile-icon { background: #2c2440; } [data-theme="dark"] .acc-violet .tile-icon svg { stroke: #b29ee0; }

    /* tablas: igual que el Semáforo */
    .turno { min-width: 0; overflow: hidden; }
    .turno h2 { margin: 0; padding: 10px 12px; text-align: center; background: linear-gradient(135deg, #162a4d 0%, #193563 55%, #1b3f74 100%); color: #fff;
      border-bottom: 1px solid var(--line); font-size: 1rem; font-weight: 700; }
    .table-box { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .925rem; }
    thead { background: var(--surface); color: var(--muted); }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--line-celda); text-align: center; vertical-align: middle; overflow-wrap: anywhere; }
    tr > :not(:last-child) { border-inline-end: 1px solid var(--line-celda); }
    thead th { font-size: .78rem; font-weight: 700; overflow-wrap: normal; }
    tbody tr:last-child > * { border-bottom: 0; }
    tbody th[scope="row"] { font-weight: inherit; }
    .grupo { font-weight: 600; }
    .numeric, .result, .codigo-circuito { font-variant-numeric: tabular-nums; }
    .codigo-circuito { white-space: nowrap; font-weight: 600; }
    .rango { display: block; font-weight: 700; }
    .completo { display: inline-block; font-weight: 800; background: #090b10; color: #fff; padding-inline: .45em; border: 1px solid var(--line); border-radius: 5px; }
    .completo-nota { display: block; margin-top: 2px; font-size: .72rem; font-weight: 600; color: var(--muted); }
    .sub { display: block; font-size: .72rem; color: var(--muted); font-weight: 500; }
    .camion-sel { width: 100%; max-width: 190px; min-height: 30px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: .82rem; text-align: center; }
    .camion-sel.asignado { border-color: var(--ok); color: var(--ok); font-weight: 700; }
    .camion-sel.sugerido { border-style: dashed; border-color: var(--blue); }
    .aviso-vacio { padding: 26px; text-align: center; color: var(--muted); }

    /* GOL: una columna por municipio */
    .muni-chips { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; }
    .muni-chips .lab { font-size: .82rem; font-weight: 700; margin-right: 4px; }
    .chip-mun { min-height: 30px; padding: 3px 13px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel); font-size: .85rem; font-weight: 700; cursor: pointer; }
    .chip-mun span { font-weight: 500; color: var(--muted); margin-left: 2px; }
    .chip-mun:hover:not(:disabled) { border-color: var(--blue); }
    .chip-mun.on { background: #184a91; border-color: #184a91; color: #fff; } .chip-mun.on span { color: #dbe6f7; }
    .chip-mun:disabled { opacity: .4; cursor: not-allowed; }
    .munis { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 14px; align-items: start; }
    @media (max-width: 1099px) { .munis { grid-template-columns: minmax(0, 1fr); } }
    .recursos-mun { padding: 7px 12px; font-size: .8rem; color: var(--muted); border-bottom: 1px solid var(--line-soft); text-align: center; }
    .recursos-mun.sin { color: var(--pending); font-weight: 700; }
    .nota-sin { font-size: .8rem; color: var(--muted); padding: 8px 12px; text-align: center; }

    /* Recursos */
    .recursos th, .recursos td { border: 1px solid var(--line-celda); min-width: 130px; vertical-align: top; text-align: left; }
    .recursos thead th { text-align: center; }
    .recursos th.t { background: var(--surface); text-align: center; min-width: 110px; font-size: .86rem; color: var(--text); }
    .tag { display: inline-flex; align-items: center; gap: 4px; margin: 2px; padding: 2px 4px 2px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-size: .82rem; font-weight: 600; }
    .tag[draggable="true"] { cursor: grab; }
    .tag button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: .9rem; }
    .celda input { width: 100%; margin-top: 4px; min-height: 28px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: .8rem; }
    .celda.sobre { outline: 2px dashed var(--blue); outline-offset: -3px; background: var(--surface); }
  </style>
</head>
<body>
  <header class="barra">
    <a class="com2-marca com2-volver" id="salir" href="./" aria-label="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Volver</span></a>
    <a class="com2-marca com2-volver" id="volver" href="#" aria-label="Atrás" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Atrás</span></a>
    <div class="barra-in">
      <div class="titulo"><h1 id="titulo">Asignador de Zona Limpia</h1></div>
    </div>
  </header>
  <div class="com2-carga" id="com2-carga" role="status" aria-live="polite">
    <div class="com2-rueda" aria-hidden="true"></div>
    <p class="com2-carga-t">Cargando información</p>
  </div>
  <main class="wrap">
    <div class="dashboard" id="dashboard" hidden>
      <div class="toolbar" id="toolbar"></div>
    <p class="source-status" id="estado" hidden></p>
      <p class="source-status err" id="aviso" role="alert" hidden></p>
      <div id="vista"></div>
    </div>
  </main>

<script>
(() => {
'use strict';
const T_PLANILLA = 'zona_limpia_semaforo_planilla';     // planilla del Semáforo (camión de cada circuito): solo se lee
const T_REC = 'zona_limpia_asignador_recursos';          // diferencias de recursos de cada día
const T_PLAN = 'zona_limpia_asignador_plan';             // asignaciones del día
const ROLES_EDITAN = ['auxiliar', 'sup_gral', 'admin'];  // mismos roles que editan la planilla del Semáforo
const DIA = 24 * 3600e3, DESFASE = 3 * 3600e3;           // las fechas de las bases son segundos de reloj de Montevideo
const TURNOS = ['Matutino', 'Vespertino', 'Nocturno'];
const MUNIS = ['A', 'C', 'CH', 'D', 'E', 'F', 'G'];      // el municipio B no se asigna
const MUN_INICIO = ['D', 'F', 'E'];                      // municipios que se abren por defecto en GOL
const MAX_MUN = 3;                                       // tablas de municipio que se ven a la vez
const GENERICOS = ['MC DINALI', 'MC COM'];               // transportistas genéricos: sirven para el Semáforo, no para GOL
const FALLIDO = /no visitado|omitido|no se encuentra|no se pudo|no realizado/;
const ETQ = { ayer: 'Atendidos ayer', antes: 'Atendidos antes de ayer', tres: 'Atendidos hace 3 a 6 días', siete: 'Hace 7 días o más / sin registro' };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const validCirc = c => /^(CH|[A-G])\d{1,3}$/.test(c);
const munDe = c => (/^(CH|[A-G])(?=\d)/.exec(c) || [''])[1];
const natCmp = (a, b) => String(a).localeCompare(String(b), 'es-UY', { numeric: true });
const inicioDia = ms => Math.floor((ms - DESFASE) / DIA) * DIA + DESFASE;
const fechaMontevideo = () => new Date(Date.now() - DESFASE).toISOString().slice(0, 10);
const ddmm = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const esGenerico = e => GENERICOS.includes(String(e).trim().toUpperCase());
const celdaTsv = s => { s = String(s ?? '').replace(/[\t\r\n]+/g, ' '); return /^\s*[=+@-]/.test(s) ? "'" + s : s; };

/* ---------- tramos ---------- */
function tramos(puntos, tol = 0, excluidos = new Set()) {
  const p = [...new Set(puntos)].sort((a, b) => a - b), out = [];
  for (const x of p) {
    const u = out.at(-1);
    const unir = u && x - u[1] - 1 <= tol &&
      Array.from({ length: x - u[1] - 1 }, (_, i) => u[1] + i + 1).every(n => !excluidos.has(n));
    if (unir) u[1] = x;
    else out.push([x, x]);
  }
  return out;
}
const texto = t => t.map(([a, b]) => a === b ? a : a + '-' + b).join(', ');     // formato del sistema: "1-5, 8, 20-41"

/* ---------- planilla del Semáforo: turno y camión de cada circuito ---------- */
// C, CH, D, E y F salen de la planilla de COM 2; A y G, de las listas del asignador anterior.
const circTurnos = new Map(), circTotal = new Map();
let PL = [];   // filas: { turno 0-2, municipio, camion, circuito, total }
const LISTAS_AG = {
  Matutino: ['A113', 'A109', 'A108', 'A114', 'A111', 'A116', 'A202', 'A203', 'G106', 'G101', 'G115', 'G116', 'G104', 'G113', 'G111', 'G112', 'G103', 'G107', 'G105'],
  Vespertino: ['A112', 'A205', 'A204', 'A105', 'A106', 'A107', 'A110', 'G114', 'G110', 'G109', 'G108']
};
const deArchivo = () => (window.PlanillaZonaLimpia || []).flatMap((t, i) => t.filas.map(f => ({ turno: i, municipio: f.municipio, camion: f.camion, circuito: f.circuito, total: /^\d+$/.test(f.cantidad) ? +f.cantidad : 0 })));
function armarPlanilla(filas) {
  PL = filas; circTurnos.clear(); circTotal.clear();
  const add = (c, t) => (circTurnos.get(c) || circTurnos.set(c, new Set()).get(c)).add(t);
  PL.forEach(f => { add(f.circuito, TURNOS[f.turno]); if (f.total) circTotal.set(f.circuito, Math.max(circTotal.get(f.circuito) || 0, f.total)); });
  Object.entries(LISTAS_AG).forEach(([t, L]) => L.forEach(c => {
    if (!PL.some(f => f.circuito === c)) add(c, t);
  }));
}
function recursosBase() {
  const r = {}; TURNOS.forEach(t => { r[t] = {}; });
  PL.forEach(f => { const L = (r[TURNOS[f.turno]][f.municipio] ||= []); if (f.camion && !L.includes(f.camion)) L.push(f.camion); });
  return r;
}
async function cargarPlanilla() {
  S.planillaOk = false;
  try {
    const { data, error } = await COM2.sb.from(T_PLANILLA).select('filas').eq('id', 1).abortSignal(AbortSignal.timeout(12000)).single();
    if (error) throw error;
    if (Array.isArray(data.filas)) {
      armarPlanilla(data.filas.filter(f => [0, 1, 2].includes(f.turno) && f.circuito).map(f => ({ turno: f.turno, municipio: String(f.municipio).trim().toUpperCase(), camion: String(f.camion || '').trim(), circuito: String(f.circuito).trim().toUpperCase(), total: 0 })));
    } else if (data.filas === null && deArchivo().length) {
      armarPlanilla(deArchivo());
    } else {
      throw new Error('Planilla de circuitos no disponible');
    }
    S.planillaOk = true;
    delete S.err.planilla;
  } catch (e) {
    console.warn('Planilla del Semáforo', e);
    S.err.planilla = 'No se pudo leer la planilla de circuitos. Recargá para volver a intentar.';
  }
  aplicarOV();
}

/* ---------- estado ---------- */
const S = { fecha: fechaMontevideo(), vista: 'turno', turno: null, inv: null, zl: null, asig: null, gol: null, planillaOk: false, err: {},
  quitar: 1,            // lo ya realizado que se descuenta: 0 = hoy, 1 = hoy y ayer
  completo: 80, porRecurso: 1, golRojo: 100, golNegro: 170, gap: 5, sinSug: new Set(), munSel: [],
  puedeEditar: false, diaOk: false };
const edita = () => S.puedeEditar && S.diaOk && !pendientes && !leyendo;
const puedeAsignar = () => edita() && S.planillaOk && S.zl && S.inv && S.golFecha === S.fecha && S.fecha === fechaMontevideo();

/* ---------- datos compartidos del día (Supabase) ---------- */
let OV = { add: {}, del: {} };      // diferencias de recursos respecto de la planilla
let revRec = null;                  // revisión leída de la fila del día (null = todavía no existe)
let R = recursosBase();             // recursos del día = planilla + diferencias
let PLAN = [];                      // asignaciones del día
let pendientes = false, leyendo = false, cargaId = 0;

const limpiarOV = x => { const o = { add: {}, del: {} }; for (const k of ['add', 'del']) for (const [t, ms] of Object.entries(x?.[k] || {})) if (TURNOS.includes(t)) for (const [m, L] of Object.entries(ms || {})) if (Array.isArray(L)) (o[k][t] ||= {})[m] = L.map(String); return o; };
function aplicarOV() {
  R = recursosBase();
  TURNOS.forEach(t => Object.keys(R[t]).forEach(m => { R[t][m] = R[t][m].filter(e => !(OV.del[t]?.[m] || []).includes(e)); }));
  TURNOS.forEach(t => Object.entries(OV.add[t] || {}).forEach(([m, L]) => { const X = (R[t][m] ||= []); L.forEach(e => { if (!X.includes(e)) X.push(e); }); }));
}
function avisar(msg) { $('aviso').textContent = msg || ''; $('aviso').hidden = !msg; }

async function cargarDia() {
  const id = ++cargaId, f = S.fecha;
  leyendo = true;
  try {
    const [rec, plan] = await Promise.all([
      COM2.sb.from(T_REC).select('diferencias,revision').eq('fecha', f).abortSignal(AbortSignal.timeout(12000)).maybeSingle(),
      COM2.sb.from(T_PLAN).select('turno,circuito,recurso,tramos,criterio,edades,actualizado').eq('fecha', f).abortSignal(AbortSignal.timeout(12000))
    ]);
    if (rec.error) throw rec.error;
    if (plan.error) throw plan.error;
    if (id !== cargaId) return;
    OV = limpiarOV(rec.data?.diferencias); revRec = rec.data ? rec.data.revision : null; aplicarOV();
    PLAN = plan.data.map(p => ({ turno: TURNOS[p.turno], emp: p.recurso, c: p.circuito, tramos: p.tramos, origen: p.criterio, edades: p.edades, revision: p.actualizado }))
      .sort((a, b) => TURNOS.indexOf(a.turno) - TURNOS.indexOf(b.turno) || natCmp(a.c, b.c));
    S.diaOk = true;
  } catch (e) {
    if (id !== cargaId) return;
    console.warn('Datos del día', e); S.diaOk = false;
    OV = { add: {}, del: {} }; revRec = null; PLAN = []; aplicarOV();
    avisar('No se pudieron leer los recursos y el plan de este día. Se volverá a intentar.');
  } finally {
    if (id === cargaId) leyendo = false;
  }
}
async function guardarCambio(fn) {
  pendientes = true;
  avisar('Guardando…');
  render();
  let mensaje = '';
  try {
    await fn();
  } catch (e) {
    console.warn('Asignador', e);
    mensaje = ['23505', '40001', 'AZL_CONFLICTO'].includes(e.code)
      ? 'Otra persona cambió los datos. Revisá el plan actualizado y repetí el cambio.'
      : 'No se pudo confirmar el guardado. Revisá los datos y volvé a intentar.';
  } finally {
    await cargarDia();
    pendientes = false;
    if (S.diaOk) avisar(mensaje);
    render();
  }
}

/* Recursos */
function cambiarRecurso(t, m, v, quitar) {
  const esBase = (recursosBase()[t]?.[m] || []).includes(v);
  const lista = o => ((o[t] ||= {})[m] ||= []), sacar = o => { o[t] = o[t] || {}; o[t][m] = (o[t][m] || []).filter(x => x !== v); };
  if (quitar) { if (esBase && !lista(OV.del).includes(v)) lista(OV.del).push(v); sacar(OV.add); }
  else { sacar(OV.del); if (!esBase && !lista(OV.add).includes(v)) lista(OV.add).push(v); }
  for (const k of ['add', 'del']) for (const tt of Object.keys(OV[k])) {     // no se guardan listas vacías
    for (const mm of Object.keys(OV[k][tt])) if (!OV[k][tt][mm].length) delete OV[k][tt][mm];
    if (!Object.keys(OV[k][tt]).length) delete OV[k][tt];
  }
  aplicarOV();
}

async function confirmarCambio(consulta) {
  const { data, error } = await consulta.abortSignal(AbortSignal.timeout(12000));
  if (error) throw error;
  if (!data) throw Object.assign(new Error('Cambio simultáneo'), { code: 'AZL_CONFLICTO' });
}
const enPlan = (c, turno) => PLAN.find(p => p.c === c && p.turno === turno);
const filaPlan = (c, turno, emp, tramosTxt, edades) => ({
  fecha: S.fecha, turno: TURNOS.indexOf(turno), circuito: c,
  recurso: emp, tramos: tramosTxt, criterio: 'GOL', edades
});
function asignar(c, turno, emp, tramosTxt, edades) {
  if (emp ? !puedeAsignar() : !edita()) return;
  const actual = enPlan(c, turno);
  if (!emp && !actual) return;
  const tabla = COM2.sb.from(T_PLAN);
  const { fecha, turno: numeroTurno, circuito, ...detalle } = filaPlan(c, turno, emp, tramosTxt, edades);
  const consulta = actual
    ? (emp ? tabla.update(detalle) : tabla.delete()).eq('fecha', fecha)
      .eq('turno', numeroTurno).eq('circuito', circuito).eq('actualizado', actual.revision)
    : tabla.insert({ fecha, turno: numeroTurno, circuito, ...detalle });
  guardarCambio(() => confirmarCambio(consulta.select('circuito').maybeSingle()));
}
function vaciarPlan() {
  const filas = PLAN.map(p => ({ turno: TURNOS.indexOf(p.turno), circuito: p.c, actualizado: p.revision }));
  guardarCambio(async () => {
    const { error } = await COM2.sb.rpc('asignador_zl_vaciar_plan', { dia: S.fecha, filas })
      .abortSignal(AbortSignal.timeout(12000));
    if (error) throw error;
  });
}

/* ---------- lectura de bases (bucket público de Supabase, solo lectura) ---------- */
async function bajar(nombre) {
  const res = await fetch(COM2.URL + '/storage/v1/object/public/bases/' + nombre + '.json.gz', {
    cache: 'no-cache', signal: AbortSignal.timeout(45000)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const b = new Uint8Array(await res.arrayBuffer());
  const txt = b[0] === 0x1f && b[1] === 0x8b
    ? await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text() : new TextDecoder().decode(b);
  return JSON.parse(txt);
}
function lector(base) {
  if (!Array.isArray(base.columnas) || !Array.isArray(base.registros) || !base.registros.length) {
    throw new Error('La base no trae registros');
  }
  const cols = base.columnas.map(c => c.trim().toLowerCase()), fechas = new Set((base.fechas || []).map(c => c.trim().toLowerCase()));
  return nombre => {
    const i = cols.indexOf(nombre); if (i < 0) throw new Error('Falta la columna ' + nombre);
    const dic = base.dicc?.[base.columnas[i]];
    if (dic) return r => dic[r[i]];
    if (fechas.has(nombre)) return r => r[i] == null || r[i] === '' ? NaN : r[i] * 1000 + DESFASE;
    return r => r[i];
  };
}
function leerFecha(valor) {
  if (typeof valor === 'number') return valor;
  if (!valor) return NaN;
  const fecha = String(valor).trim().replace(' ', 'T');
  return Date.parse(/(?:z|[+-]\d{2}:?\d{2})$/i.test(fecha) ? fecha : fecha + '-03:00');
}
async function cargarInv() {
  const b = await bajar('contenedores'), g = lector(b), [cir, num] = ['circuito', 'numero_contenedor'].map(g), M = new Map();
  for (const r of b.registros) {
    const c = String(cir(r) ?? '').trim().toUpperCase(), p = Number(num(r));
    if (!validCirc(c) || !Number.isSafeInteger(p) || p < 1) continue;
    M.set(c, Math.max(M.get(c) || 0, p));
  }
  if (!M.size) throw new Error('El inventario no trae circuitos válidos');
  S.inv = M;
}
// Zona Limpia, igual que el Semáforo: la última atención de cada punto (para descontar lo realizado y guardar la antigüedad)
// y los puntos que ya están en estado "Asignado" (despachados y sin resolver, de las últimas 24 h): no se vuelven a asignar.
async function cargarZL() {
  const b = await bajar('zona-limpia'), g = lector(b);
  const [cir, pto, fec, inc, est, rec] = ['circuito', 'contenedor', 'fecha_resuelto', 'incidente', 'estado', 'fecha_de_reclamo'].map(g);
  const ahora = Date.now(), M = new Map(), A = new Map();
  for (const r of b.registros) {
    const e = String(est(r) ?? '').trim().toLowerCase(), f = leerFecha(fec(r));
    const c = String(cir(r) ?? '').trim().toUpperCase(), p = Number(pto(r));
    if (!validCirc(c) || !Number.isSafeInteger(p) || p < 1) continue;
    if (e === 'asignado') {
      const fecha = leerFecha(rec(r));
      if (!Number.isFinite(f) && fecha >= ahora - DIA && fecha <= ahora) {
        (A.get(c) || A.set(c, new Set()).get(c)).add(p);
      }
      continue;
    }
    if (!Number.isFinite(f) || f > ahora) continue;
    const i = String(inc(r) ?? '').trim().toLowerCase();
    if (!i || FALLIDO.test(i) || !['cerrado', 'resuelto'].includes(e)) continue;
    const m = M.get(c) || M.set(c, new Map()).get(c);
    if ((m.get(p) ?? -Infinity) < f) m.set(p, f);
  }
  S.zl = M; S.asig = A;
}
async function cargarGol(file) {
  if (!window.XLSX) throw new Error('No se pudo cargar el lector de planillas. Recargá la página.');
  const wb = /\.(csv|txt)$/i.test(file.name)
    ? XLSX.read((await file.text()).replace(/^\uFEFF/, ''), { type: 'string', raw: true })
    : XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array', cellNF: true });
  const name = wb.SheetNames.find(n => norm(n) === 'base gol') || wb.SheetNames[0];
  if (!name) throw new Error('El archivo no tiene hojas');
  const hoja = wb.Sheets[name];
  const inicio = XLSX.utils.decode_range(hoja['!ref'] || 'A1').s;
  const rows = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true, defval: '' });
  const h = (rows[0] || []).map(norm);
  const iC = h.indexOf('circuito'), iP = h.indexOf('posicion'), iA = h.findIndex(x => x.startsWith('% de acumulacion'));
  if (iC < 0 || iP < 0 || iA < 0) throw new Error('Faltan Circuito, Posición o % de acumulación');
  const M = new Map();
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const c = String(r[iC] || '').replace(/[\s_]/g, '').toUpperCase(), p = Number(r[iP]);
    if (!validCirc(c) || !Number.isSafeInteger(p) || p < 1) continue;
    const valor = String(r[iA] ?? '').trim().replace(/\s*%$/, '').trim();
    if (!/^-?\d+(?:[,.]\d+)?$/.test(valor)) throw new Error('Acumulación inválida en ' + c + ', punto ' + p);
    const celda = hoja[XLSX.utils.encode_cell({ r: inicio.r + i, c: inicio.c + iA })];
    const porcentajeExcel = typeof r[iA] === 'number' && /%/.test(celda?.z || '');
    const a = porcentajeExcel ? r[iA] * 100 : Number(valor.replace(',', '.'));
    if (!Number.isFinite(a) || a < 0) throw new Error('Acumulación inválida en ' + c + ', punto ' + p);
    const puntos = M.get(c) || M.set(c, new Map()).get(c);
    if (puntos.has(p) && puntos.get(p) !== a) throw new Error('Acumulaciones distintas para ' + c + ', punto ' + p);
    puntos.set(p, a);
  }
  if (!M.size) throw new Error('El archivo no tiene filas válidas de GOL');
  S.gol = new Map([...M].map(([c, puntos]) => [c, [...puntos].map(([p, a]) => ({ p, a }))]));
  S.golFecha = fechaMontevideo();
}

/* ---------- GOL del turno ---------- */
// Prioridad: % de negros × 75 + % de rojos × 25 (sobre los puntos del circuito). Un circuito 100 % negro queda primero.
// Lo ya atendido (hoy, u hoy y ayer) se descuenta como en el Semáforo. El tramo es único: lo que queda pendiente, y completo si llega al umbral.
// La antigüedad de la última atención de lo pendiente se calcula aparte y se guarda con la asignación.
function golDelTurno() {
  const hoy = inicioDia(Date.now()), desde = hoy - S.quitar * DIA, filas = [];
  let sinTurno = 0;
  for (const [c, pts] of S.gol) {
    if (!validCirc(c) || munDe(c) === 'B') continue;
    const ts = circTurnos.get(c);
    if (!ts) { if (pts.some(p => p.a > S.golRojo)) sinTurno++; continue; }
    if (!ts.has(S.turno)) continue;
    const hechos = S.zl?.get(c);
    const excluidos = new Set(S.asig?.get(c));
    for (const [p, fecha] of hechos || []) {
      if (fecha >= desde) excluidos.add(p);
    }
    const vivo = pts.filter(p => !excluidos.has(p.p));
    const neg = vivo.filter(p => p.a > S.golNegro).map(p => p.p), roj = vivo.filter(p => p.a > S.golRojo && p.a <= S.golNegro).map(p => p.p);
    if (!neg.length && !roj.length) continue;
    const total = Math.max(S.inv?.get(c) || 0, circTotal.get(c) || 0, ...pts.map(p => p.p));
    const pend = (neg.length + roj.length) / total * 100, completo = pend >= S.completo && !excluidos.size;
    const g = { ayer: [], antes: [], tres: [], siete: [] };
    neg.concat(roj).forEach(p => {
      const f = hechos?.get(p), d = f == null ? Infinity : (hoy - inicioDia(f)) / DIA;
      (d === 1 ? g.ayer : d === 2 ? g.antes : d >= 3 && d < 7 ? g.tres : g.siete).push(p);
    });
    const pctN = neg.length / total * 100, pctR = roj.length / total * 100;
    filas.push({ c, mun: munDe(c), total, neg: neg.length, roj: roj.length, pctN, pctR, score: pctN * 0.75 + pctR * 0.25, pend, completo,
      envio: completo ? texto([[1, total]]) : texto(tramos(neg.concat(roj), S.gap, excluidos)),
      edades: { ayer: texto(tramos(g.ayer)), antes: texto(tramos(g.antes)), tres: texto(tramos(g.tres)), siete: texto(tramos(g.siete)) } });
  }
  filas.sort((a, b) => b.score - a.score || natCmp(a.c, b.c));
  const porMun = new Map();
  filas.forEach(f => (porMun.get(f.mun) || porMun.set(f.mun, []).get(f.mun)).push(f));
  // Distribuir por prioridad, contando el plan existente del turno.
  const ocupacion = new Map();
  const carga = recurso => ocupacion.get(recurso) || 0;
  for (const p of PLAN) {
    if (p.turno === S.turno) ocupacion.set(p.emp, carga(p.emp) + 1);
  }
  for (const f of filas) {
    if (enPlan(f.c, S.turno) || S.sinSug.has(f.c + '|' + S.turno)) continue;
    f.sug = recursosGol(S.turno, f.mun).sort((a, b) => carga(a) - carga(b)).find(e => carga(e) < S.porRecurso);
    if (f.sug) ocupacion.set(f.sug, carga(f.sug) + 1);
  }
  return { porMun, sinTurno };
}

    filas.map(p => `<tr><td>${p.turno}</td><td class="grupo">${esc(p.emp)}</td><th scope="row"><span class="codigo-circuito">${esc(p.c)}</span></th><td class="result" title="${esc(edadesTxt(p.edades))}"><span class="rango">${esc(p.tramos)}</span></td><td>${esc(p.origen)}</td>${ed ? `<td><button class="btn-m" data-del="${p.i}" aria-label="Quitar ${esc(p.c)}">✕</button></td>` : ''}</tr>`).join('') + '</tbody></table></div></section>';
}

const TITULOS = { turno: 'Asignador de Zona Limpia', recursos: 'Recursos', gol: 'GOL', plan: 'Plan del día' };
function toolbar() {
  const fecha = `<div class="field"><label for="fecha">Fecha del plan</label><input type="date" id="fecha" value="${S.fecha}" ${pendientes ? 'disabled' : ''}></div>`;
  const plan = `<button class="btn-m pri" data-ir="plan">Plan (${PLAN.length})</button>`;
  if (S.vista === 'gol' && S.fecha !== fechaMontevideo()) return fecha + plan;
  if (S.vista === 'gol') return fecha + `<button class="btn-m" id="elegirGol" ${pendientes || S.importando ? 'disabled' : ''}>Cargar Base GOL</button><input type="file" id="fGol" accept=".xlsx,.xls,.ods,.csv" hidden>
    <button class="btn-m" id="actualizarBases" ${pendientes || S.cargandoBases ? 'disabled' : ''}>Actualizar bases</button>
    <div class="field"><label for="quitar">Quitar lo ya realizado</label><select id="quitar"><option value="0" ${S.quitar === 0 ? 'selected' : ''}>Hoy</option><option value="1" ${S.quitar === 1 ? 'selected' : ''}>Hoy y ayer</option></select></div>
    <div class="field"><label for="completo">Plano completo desde (%)</label><input type="number" id="completo" min="1" max="100" value="${S.completo}"></div>
    <div class="field"><label for="porRecurso">Circuitos por recurso</label><input type="number" id="porRecurso" min="1" max="10" value="${S.porRecurso}"></div>
    ${puedeAsignar() && S.gol ? '<button class="btn-m" id="aplicar">Asignar sugerencias</button>' : ''}` + plan;
  if (S.vista === 'plan') return fecha + (S.diaOk && PLAN.length ? '<button class="btn-m pri" id="copiar">Copiar plan</button>' : '') +
    (edita() && PLAN.length ? '<button class="btn-m" id="vaciar">Vaciar plan</button>' : '');
  if (S.vista === 'recursos') return fecha;
  if (S.vista === 'bloques') return fecha + plan;
  return '';
}
const NOMBRES = { inv: 'Contenedores', zl: 'Zona Limpia', gol: 'GOL', planilla: 'Circuitos' };
function estado() {   // solo problemas: lo que anda bien no se muestra
  const avisos = Object.entries(S.err).map(([k, v]) => `<span class="err">${esc(NOMBRES[k])}: ${esc(v)}</span>`);
  if (S.vista === 'gol' && S.golFecha === S.fecha && S.archivoGol) avisos.unshift(esc(S.archivoGol));
  return avisos.join(' · ');
}
function render() {
  const y = scrollY, v = S.vista;
  const sufijo = v === 'recursos' || v === 'plan' ? ' · ' + ddmm(S.fecha) : '';
  $('titulo').textContent = v === 'bloques' ? S.turno : (v === 'gol' ? S.turno + ' · ' : '') + TITULOS[v] + sufijo;
  $('volver').hidden = v === 'turno'; $('salir').hidden = v !== 'turno';
  $('toolbar').innerHTML = toolbar();
  $('estado').innerHTML = estado();
  $('estado').hidden = !$('estado').textContent;
  $('vista').innerHTML = { turno: vTurno, bloques: vBloques, recursos: vRecursos, gol: vGol, plan: vPlan }[v]();
  try { history.replaceState(null, '', '#' + (S.turno || '') + '/' + v); } catch {}
  scrollTo(0, y);
}
const ir = v => { S.vista = v; render(); scrollTo(0, 0); };
let volverPlan = 'bloques';

/* ---------- eventos ---------- */
// "Atrás" interno: va antes que el "Volver" de COM 2 (comun.js), que llevaría al menú
document.addEventListener('click', e => {
  if (!e.target.closest('#volver')) return;
  e.preventDefault(); e.stopPropagation();
  ir(S.vista === 'plan' ? volverPlan : S.vista === 'gol' ? 'bloques' : 'turno');
}, true);
document.addEventListener('click', e => {
  const a = e.target.closest('[data-ir]');
  if (a) {
    e.preventDefault();
    const d = a.dataset.ir;
    if (d.startsWith('t:')) { S.turno = d.slice(2); ir('bloques'); }
    else {
      if (d === 'plan') volverPlan = S.vista;
      ir(d);
    }
    return;
  }
  const mu = e.target.closest('[data-mun]');
  if (mu) { const m = mu.dataset.mun, i = S.munSel.indexOf(m); if (i >= 0) { if (S.munSel.length > 1) S.munSel.splice(i, 1); } else if (S.munSel.length < MAX_MUN) S.munSel.push(m); render(); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm) { if (!edita() || !S.planillaOk) return; const [t, m, ...r] = rm.dataset.rm.split('|'); cambiarRecurso(t, m, r.join('|'), true); guardarRecursos(); return; }
  const del = e.target.closest('[data-del]');
  if (del) { const p = PLAN[+del.dataset.del]; if (p) { asignar(p.c, p.turno, '', '', null); render(); } return; }
  if (e.target.id === 'elegirGol') { $('fGol').click(); return; }
  if (e.target.id === 'actualizarBases' && !pendientes) { actualizarBases(); return; }
  if (e.target.id === 'aplicar' && S.gol && puedeAsignar()) {
    const filas = [...golDelTurno().porMun.values()].flat().filter(f => f.sug)
      .map(f => filaPlan(f.c, S.turno, f.sug, f.envio, f.edades));
    if (!filas.length) { avisar('No hay sugerencias para asignar.'); return; }
    if (confirm('¿Guardar ' + filas.length + ' sugerencias para todo el turno ' + S.turno + '?')) {
      guardarCambio(() => confirmarCambio(COM2.sb.from(T_PLAN).insert(filas).select('circuito')));
    }
    return;
  }
  if (e.target.id === 'vaciar' && edita() && PLAN.length && confirm('¿Borrar las asignaciones que ves en el plan de este día?')) {
    vaciarPlan();
    return;
  }
  if (e.target.id === 'copiar') {
    if (!navigator.clipboard) { avisar('No se pudo acceder al portapapeles.'); return; }
    const f = S.fecha.split('-').reverse().join('/');
    const filas = PLAN.slice().sort((a, b) => TURNOS.indexOf(a.turno) - TURNOS.indexOf(b.turno) || natCmp(a.emp, b.emp) || natCmp(a.c, b.c)).map(p => [f, p.turno, p.emp, p.c, p.tramos].map(celdaTsv).join('\t'));
    navigator.clipboard.writeText(['Fecha\tTurno\tRecurso\tCircuito\tPuntos a enviar'].concat(filas).join('\n'))
      .then(() => { e.target.textContent = 'Copiado ✓'; })
      .catch(() => avisar('No se pudo copiar el plan al portapapeles.'));
  }
});
document.addEventListener('change', async e => {
  const t = e.target, id = t.id;
  if (t.dataset.add) { const v = t.value.trim(), [tu, m] = t.dataset.add.split('|'); if (v && edita() && S.planillaOk) { cambiarRecurso(tu, m, v, false); guardarRecursos(); } return; }
  if (t.classList.contains('camion-sel')) {
    if (!puedeAsignar()) { render(); return; }
    const k = t.dataset.c + '|' + S.turno;
    if (t.value) S.sinSug.delete(k); else S.sinSug.add(k);
    asignar(t.dataset.c, S.turno, t.value, t.dataset.tr, JSON.parse(t.dataset.ed || 'null')); render(); return;
  }
  if (id === 'fecha') {
    if (!t.value || pendientes) return;
    S.fecha = t.value; avisar(''); S.diaOk = false; S.sinSug.clear();
    OV = { add: {}, del: {} }; revRec = null; PLAN = []; aplicarOV();
    render(); await cargarDia();
  }
  else if (id === 'quitar') S.quitar = +t.value;
  else if (id === 'completo') S.completo = Math.min(100, Math.max(1, +t.value || 80));
  else if (id === 'porRecurso') S.porRecurso = Math.min(10, Math.max(1, Math.trunc(+t.value) || 1));
  else if (id === 'fGol') {
    if (!t.files[0] || pendientes || S.importando) return;
    S.importando = true; S.gol = null; S.archivoGol = ''; delete S.err.gol;
    render();
    try { await cargarGol(t.files[0]); S.archivoGol = t.files[0].name; }
    catch (x) { S.err.gol = x.message; }
    finally { S.importando = false; }
  }
  else return;
  render();
});
// Mover una empresa de una celda (turno y municipio) a otra, arrastrándola
let arrastrando = null;
document.addEventListener('dragstart', e => {
  const g = e.target.closest?.('[data-mv]'); if (!g || !edita() || !S.planillaOk) return;
  arrastrando = g.dataset.mv; e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', arrastrando); } catch {}
});
document.addEventListener('dragover', e => {
  const c = e.target.closest?.('[data-celda]'); if (!c || !arrastrando || !edita() || !S.planillaOk) return;
  e.preventDefault(); document.querySelectorAll('.celda.sobre').forEach(x => { if (x !== c) x.classList.remove('sobre'); }); c.classList.add('sobre');
});
document.addEventListener('drop', e => {
  const c = e.target.closest?.('[data-celda]'); if (!c || !arrastrando || !edita() || !S.planillaOk) return;
  e.preventDefault();
  const [t0, m0, ...r] = arrastrando.split('|'), emp = r.join('|'), [t1, m1] = c.dataset.celda.split('|');
  arrastrando = null;
  if (t0 !== t1 || m0 !== m1) { cambiarRecurso(t0, m0, emp, true); cambiarRecurso(t1, m1, emp, false); guardarRecursos(); }
  render();
});
document.addEventListener('dragend', () => { arrastrando = null; document.querySelectorAll('.celda.sobre').forEach(x => x.classList.remove('sobre')); });

async function actualizarBases() {
  if (S.cargandoBases) return;
  S.cargandoBases = true;
  S.inv = null; S.zl = null; S.asig = null;
  delete S.err.inv; delete S.err.zl;
  render();
  try {
    await Promise.all([
      cargarPlanilla(),
      cargarInv().catch(e => { S.err.inv = e.message; }),
      cargarZL().catch(e => { S.err.zl = e.message; })
    ]);
  } finally {
    S.cargandoBases = false;
    render();
  }
}

/* ---------- arranque: login de COM 2; el inicio se usa mientras bajan las bases ---------- */
async function refrescar() {
  if (document.hidden || pendientes || leyendo || S.importando) return;
  const a = document.activeElement; if (a && a.matches('input, select, textarea')) return;
  const antes = JSON.stringify([S.diaOk, OV, PLAN]);
  const recuperando = !S.diaOk;
  await cargarDia();
  if (recuperando && S.diaOk) avisar('');
  if (JSON.stringify([S.diaOk, OV, PLAN]) !== antes) render();
}
window.addEventListener('beforeunload', e => { if (pendientes) { e.preventDefault(); e.returnValue = ''; } });   // hay un guardado en curso
document.addEventListener('DOMContentLoaded', async () => {
  if (typeof window.COM2?.acceso !== 'function') {
    document.querySelector('.com2-rueda').hidden = true;
    document.querySelector('.com2-carga-t').textContent = 'Abrí esta página desde COM 2.';
    return;
  }
  const perfil = await COM2.acceso();
  if (!perfil) return;
  S.puedeEditar = ROLES_EDITAN.includes(perfil.rol);
  await cargarDia();
  const [t, v] = location.hash.slice(1).split('/');
  if (v === 'recursos' || (TURNOS.includes(t) && ['bloques', 'gol', 'plan'].includes(v))) {
    S.turno = TURNOS.includes(t) ? t : null;
    S.vista = v;
  }
  $('dashboard').hidden = false;
  COM2.carga.listo();
  actualizarBases();
  setInterval(refrescar, 30000);
  document.addEventListener('visibilitychange', refrescar);
  window.addEventListener('pageshow', e => {
    if (e.persisted) actualizarBases();
  });
});
})();
</script>
