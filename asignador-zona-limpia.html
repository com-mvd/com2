// Prioridad: % de negros × 75 + % de rojos × 25 (sobre los puntos del circuito). Un circuito 100 % negro queda primero.
// Lo ya atendido (hoy, u hoy y ayer) se descuenta como en el Semáforo. El tramo es único: lo que queda pendiente, y completo si llega al umbral.
// La antigüedad de la última atención de lo pendiente se calcula aparte y se guarda con la asignación.
function golDelTurno() {
  const hoy = inicioDia(Date.now()), desde = hoy - S.quitar * DIA, filas = [];
  for (const [c, pts] of S.gol) {
    if (!validCirc(c) || munDe(c) === 'B') continue;
    const hechos = S.zl?.get(c);
    const asignados = S.asig?.get(c);
    const vivo = pts.filter(p => !(hechos?.get(p.p) >= desde) && !asignados?.has(p.p));
    const neg = vivo.filter(p => p.a > S.golNegro).map(p => p.p), roj = vivo.filter(p => p.a > S.golRojo && p.a <= S.golNegro).map(p => p.p);
    if (!neg.length && !roj.length) continue;
    const total = Math.max(S.inv?.get(c) || 0, circTotal.get(c) || 0, ...pts.map(p => p.p));
    const pend = (neg.length + roj.length) / total * 100, completo = pend >= S.completo;
    const g = { ayer: [], antes: [], tres: [], siete: [] };
    neg.concat(roj).forEach(p => {
      const f = hechos?.get(p), d = f == null ? Infinity : (hoy - inicioDia(f)) / DIA;
      (d === 1 ? g.ayer : d === 2 ? g.antes : d >= 3 && d < 7 ? g.tres : g.siete).push(p);
    });
    const pctN = neg.length / total * 100, pctR = roj.length / total * 100;
    filas.push({ c, mun: munDe(c), total, neg: neg.length, roj: roj.length, pctN, pctR, score: pctN * 0.75 + pctR * 0.25, pend, completo,
      envio: completo ? '1-' + total : texto(tramos(neg.concat(roj), S.gap)),
      edades: { ayer: texto(tramos(g.ayer)), antes: texto(tramos(g.antes)), tres: texto(tramos(g.tres)), siete: texto(tramos(g.siete)) } });
  }
  filas.sort((a, b) => b.score - a.score || natCmp(a.c, b.c));
  const porMun = new Map();
  filas.forEach(f => (porMun.get(f.mun) || porMun.set(f.mun, []).get(f.mun)).push(f));
  // En cada municipio se sugiere un circuito por recurso, siguiendo el orden de prioridad.
  for (const [m, lista] of porMun) {
    const recursos = recursosGol(S.turno, m);
    const libres = lista.filter(f => !recursos.includes(recursoElegidoGol(f.c)));
    libres.slice(0, recursos.length).forEach((f, i) => {
      if (recursoElegidoGol(f.c) !== '') f.sug = recursos[i];
    });
  }
  return { porMun };
}

    sessionStorage.setItem('azl2.nav', JSON.stringify({ t: S.turno, v }));
  } catch {}
  scrollTo(0, y);
}
function abrirSemaforo() {
  const marco = $('semaforoMarco');
  if (marco) {
    marco.contentWindow?.actualizarRecursosAsignador?.();
    return;
  }
  const f = document.createElement('iframe');
  f.id = 'semaforoMarco'; f.setAttribute('aria-label', 'Semáforo de Zona Limpia'); f.scrolling = 'no';
  f.style.cssText = 'display:block;width:100%;border:0;height:600px';
  f.srcdoc = $('semaforo-src').textContent.replace(/<\\\/script>/g, '<' + '/script>');   // (partido en dos para no cerrar este <script>)
  f.addEventListener('load', () => f.contentWindow?.actualizarRecursosAsignador?.());
  $('semaforoBox').append(f);
}
function ir(v) {
  const fecha = ['recursos', 'gol', 'semaforo'].includes(v) ? fechaMontevideo() : S.fecha;
  const cambiaFecha = fecha !== S.fecha;
  if (cambiaFecha && (pendientes || S.importando)) return;
  const vieneDelSemaforo = S.vista === 'semaforo';
  S.vista = v;
  if (cambiaFecha) cargarFecha(fecha).then(render);
  else if (v === 'plan') cargarDia().then(render);
  if (vieneDelSemaforo) cargarPlanilla().then(render);
  if (v === 'gol') consultarGol().then(cambio => { if (cambio && S.vista === 'gol') render(); });
  render();
  scrollTo(0, 0);
  if (v === 'semaforo' && !cambiaFecha) refrescar();
}

function cargarFecha(fecha) {
  S.fecha = fecha; avisar(''); S.diaOk = false; S.seleccionesGol.clear();
  OV = { add: {}, del: {} }; revRec = null; PLAN = []; aplicarOV();
  return cargarDia();
}

function elegirRecurso(control, empresa) {
  const { c } = control.dataset;
  if (!puedeAsignar() || (empresa && !recursosGol(S.turno, munDe(c)).includes(empresa))) { render(); return; }
  S.seleccionesGol.set(claveSeleccionGol(c), empresa);
  render();
}

/* ---------- eventos ---------- */
// "Atrás" interno: va antes que el "Volver" de COM 2 (comun.js), que llevaría al menú
document.addEventListener('click', e => {
  if (!e.target.closest('#volver')) return;
  e.preventDefault(); e.stopPropagation();
  ir(['gol', 'plan', 'semaforo'].includes(S.vista) ? 'bloques' : 'turno');
}, true);
document.addEventListener('click', e => {
  const a = e.target.closest('[data-ir]');
  if (a) {
    e.preventDefault();
    const d = a.dataset.ir;
    if (d.startsWith('t:')) { S.turno = d.slice(2); ir('bloques'); }
    else ir(d);
    return;
  }
  const mu = e.target.closest('[data-mun]');
  if (mu) {
    const m = mu.dataset.mun, i = S.munSel.indexOf(m);
    if (i < 0) S.munSel.push(m);
    else if (S.munSel.length > 1) S.munSel.splice(i, 1);
    else return;
    render();
    $('toolbar').querySelector(`[data-mun="${m}"]`)?.focus({ preventScroll: true });
    return;
  }
  const agregar = e.target.closest('[data-abrir-empresa]');
  if (agregar) {
    const campo = agregar.nextElementSibling;
    agregar.hidden = true;
    campo.hidden = false;
    campo.focus();
    return;
  }
  const rm = e.target.closest('[data-rm]');
  if (rm) { if (!edita() || !S.planillaOk) return; const [t, m, ...r] = rm.dataset.rm.split('|'); cambiarRecurso(t, m, r.join('|'), true); guardarRecursos(); return; }
  const del = e.target.closest('[data-del]');
  if (del) { const p = PLAN[+del.dataset.del]; if (p) quitarAsignacionGuardada(p); return; }
  const directo = e.target.closest('[data-asignar-gol]');
  if (directo) { elegirRecurso(directo, directo.dataset.asignarGol); return; }
  if (e.target.id === 'elegirGol') { $('fGol').click(); return; }
  if (e.target.id === 'vaciar' && edita() && PLAN.length && confirm('¿Borrar las asignaciones que ves en el plan de este día?')) {
    vaciarPlan();
    return;
  }
  if (e.target.id === 'copiar') {
    if (!navigator.clipboard) { avisar('No se pudo acceder al portapapeles.'); return; }
    const f = S.fecha.split('-').reverse().join('/');
    const filas = PLAN.slice().sort((a, b) => TURNOS.indexOf(a.turno) - TURNOS.indexOf(b.turno) || natCmp(a.emp, b.emp) || natCmp(a.c, b.c)).map(p => [f, p.turno, p.emp, p.c, p.tramos].map(celdaTsv).join('\t'));
    navigator.clipboard.writeText(['Fecha\tTurno\tRecurso\tCircuito\tPuntos a enviar'].concat(filas).join('\n'))
      .then(() => { e.target.textContent = 'Copiado ✓'; })
      .catch(() => avisar('No se pudo copiar el plan al portapapeles.'));
  }
});
document.addEventListener('focusout', e => {
  const campo = e.target;
  if (!campo.matches('input[data-add]')) return;
  campo.value = '';
  campo.hidden = true;
  campo.previousElementSibling.hidden = false;
});
document.addEventListener('keydown', e => {
  const campo = e.target;
  if (!campo.matches('input[data-add]') || e.isComposing || !['Enter', 'Escape'].includes(e.key)) return;
  e.preventDefault();
  if (e.key === 'Escape') campo.value = '';
  const agregar = campo.previousElementSibling;
  agregar.hidden = false;
  agregar.focus();
});
document.addEventListener('change', async e => {
  const t = e.target, id = t.id;
  if (t.dataset.add) { const v = t.value.trim(), [tu, m] = t.dataset.add.split('|'); if (v && edita() && S.planillaOk) { cambiarRecurso(tu, m, v, false); guardarRecursos(); } return; }
  if (t.classList.contains('camion-sel')) {
    elegirRecurso(t, t.value);
    return;
  }
  if (id === 'fecha') {
    if (!t.value || pendientes || S.importando) return;
    const carga = cargarFecha(t.value);
    render(); await carga;
  }
  else if (id === 'quitar') S.quitar = +t.value;
  else if (id === 'completo') S.completo = Math.min(100, Math.max(1, +t.value || 80));
  else if (id === 'fGol') {
    const archivo = t.files[0];
    if (!archivo || pendientes || S.importando) return;
    S.importando = true; delete S.err.gol;
    render();
    try { await cargarGol(archivo); }
    catch (x) { S.err.gol = x.message; }
    finally { S.importando = false; }
  }
  else return;
  render();
});
// Mover una empresa de una celda (turno y municipio) a otra, arrastrándola
let arrastrando = null;
document.addEventListener('dragstart', e => {
  const g = e.target.closest?.('[data-mv]'); if (!g || !edita() || !S.planillaOk) return;
  arrastrando = g.dataset.mv; e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', arrastrando); } catch {}
});
document.addEventListener('dragover', e => {
  const c = e.target.closest?.('[data-celda]'); if (!c || !arrastrando || !edita() || !S.planillaOk) return;
  e.preventDefault(); document.querySelectorAll('.celda.sobre').forEach(x => { if (x !== c) x.classList.remove('sobre'); }); c.classList.add('sobre');
});
document.addEventListener('drop', e => {
  const c = e.target.closest?.('[data-celda]'); if (!c || !arrastrando || !edita() || !S.planillaOk) return;
  e.preventDefault();
  const [t0, m0, ...r] = arrastrando.split('|'), emp = r.join('|'), [t1, m1] = c.dataset.celda.split('|');
  arrastrando = null;
  if (t0 !== t1 || m0 !== m1) { cambiarRecurso(t0, m0, emp, true); cambiarRecurso(t1, m1, emp, false); guardarRecursos(); }
  render();
});
document.addEventListener('dragend', () => { arrastrando = null; document.querySelectorAll('.celda.sobre').forEach(x => x.classList.remove('sobre')); });

async function actualizarBases() {
  if (S.cargandoBases) return;
  S.cargandoBases = true;
  S.inv = null; S.zl = null; S.asig = null;
  delete S.err.inv; delete S.err.zl;
  render();
  try {
    await Promise.all([
      cargarPlanilla(),
      cargarInv().catch(e => { S.err.inv = e.message; }),
      cargarZL().catch(e => { S.err.zl = e.message; })
    ]);
  } finally {
    S.cargandoBases = false;
    render();
  }
}

/* ---------- arranque: login de COM 2; el inicio se usa mientras bajan las bases ---------- */
async function refrescar() {
  if (document.hidden || pendientes || leyendo || S.importando) return;
  const fecha = ['recursos', 'gol', 'semaforo'].includes(S.vista) ? fechaMontevideo() : S.fecha;
  const cambiaFecha = fecha !== S.fecha;
  const a = document.activeElement; if (!cambiaFecha && a && a.matches('input, select, textarea')) return;
  if (S.err.planilla || S.err.inv || S.err.zl) actualizarBases();
  const antes = JSON.stringify([S.diaOk, OV, PLAN]);
  const recuperando = !S.diaOk;
  const dia = cambiaFecha ? cargarFecha(fecha) : cargarDia();
  if (cambiaFecha) render();
  const [, golCambio] = await Promise.all([dia, S.vista === 'gol' && consultarGol()]);
  if (recuperando && S.diaOk) avisar('');
  if (cambiaFecha || golCambio || JSON.stringify([S.diaOk, OV, PLAN]) !== antes) render();
  else if (S.vista === 'semaforo') abrirSemaforo();
}
window.addEventListener('beforeunload', e => { if (pendientes || S.importando) { e.preventDefault(); e.returnValue = ''; } });
function quitarAyudaTema() {
  document.querySelector('header.barra .tema-btn')?.removeAttribute('title');
}
window.addEventListener('com2:tema', quitarAyudaTema);
document.addEventListener('DOMContentLoaded', async () => {
  quitarAyudaTema();
  if (typeof window.COM2?.acceso !== 'function') {
    document.querySelector('.com2-rueda').hidden = true;
    document.querySelector('.com2-carga-t').textContent = 'Abrí esta página desde COM 2.';
    return;
  }
  const perfil = await COM2.acceso();
  if (!perfil) return;
  quitarAyudaTema();
  window.AZL = {
    perfil,
    recursosDelDia: () => S.diaOk && S.planillaOk && S.fecha === fechaMontevideo() ? TURNOS.map(t => R[t]) : null,
    planillaGuardada(filas) {
      armarPlanillaGuardada(filas);
      S.planillaOk = true;
      delete S.err.planilla;
      aplicarOV();
    }
  };
  S.puedeEditar = ROLES_EDITAN.includes(perfil.rol);
  let [t, v] = location.hash.slice(1).split('/');
  if (!location.hash && performance.getEntriesByType('navigation')[0]?.type === 'back_forward') {
    try { ({ t, v } = JSON.parse(sessionStorage.getItem('azl2.nav')) || {}); } catch {}
  }
  if (v === 'recursos' || (TURNOS.includes(t) && ['bloques', 'gol', 'plan', 'semaforo'].includes(v))) {
    S.turno = TURNOS.includes(t) ? t : null;
    S.vista = v;
  }
  await cargarDia();
  $('dashboard').hidden = false;
  COM2.carga.listo();
  actualizarBases();
  if (S.vista === 'gol') consultarGol().then(cambio => { if (cambio && S.vista === 'gol') render(); });
  setInterval(refrescar, 30000);
  document.addEventListener('visibilitychange', refrescar);
  window.addEventListener('pageshow', e => {
    if (e.persisted) { actualizarBases(); refrescar(); }
  });
});
})();
</script>
