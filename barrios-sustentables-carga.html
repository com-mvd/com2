<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16213e">
<title>COM 2</title>
<link rel="icon" type="image/png" href="assets/logo-ciemsa.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/barra.css?v=202611132330">
<link rel="stylesheet" href="assets/carga.css?v=202611131600">
<style>
/* Página de carga de Barrios Sustentables: Cerro. En el panel Admin de COM 2 (solo admin).
   Desde el 10/11/2026 guarda en la tabla vaciados de Supabase (tablero 'cerro', assets/vaciados.js), con el
   login de COM 2. Antes escribía en la planilla "Validación Barrios Sustentables" por un Apps Script, con clave de carga.
   Mismo aspecto que barrios-sustentables-cerro.html (colores, fondo, barra, tarjetas, etiquetas, ruedita). */
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --border:#E6E2DA;
  --text:#1A1714; --text2:#5F5A54; --text3:#9A948C;
  --azul:#1b3f74; --rojo:#c0392b; --verde:#1baf7a;
  --shadow:0 4px 20px rgba(26,23,20,.05),0 1px 3px rgba(26,23,20,.05);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  background:var(--bg);
  background-attachment:fixed;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* La barra azul (62 px, igual en todas las páginas) está en assets/barra.css */
/* "Pasado hasta": hasta qué fecha ya se cargó lo del grupo. Desde el 13/11 va abajo de la barra, centrado
   (en la barra de 62 px no entra junto al título) */
.cabeza{position:relative;align-self:center;width:max-content;max-width:100%}
.pasado{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.pasado input{min-width:0;width:160px;font:inherit;font-size:14px;font-weight:700;text-align:center;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:9px;padding:5px 9px;outline:none;box-shadow:var(--shadow)}
.pasado input:focus{border-color:var(--azul)}
.pasado input::-webkit-date-and-time-value{text-align:center}
/* Estado al guardar la fecha: a la derecha, sin correr nada (ruedita + "Cargando…", después tilde verde) */
.estado{position:absolute;left:calc(100% + 10px);bottom:0;height:30px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.estado .rd{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--azul);border-radius:50%;animation:girar .8s linear infinite}
.estado .ok{color:var(--verde);font-size:20px;font-weight:700;line-height:1}
/* En el celular no entra el texto al costado: queda solo la ruedita y el tilde */
@media (max-width:600px){.estado .tx{display:none}.estado{left:calc(100% + 6px)}}

.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}

label.l{display:block;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
label.l:first-of-type{margin-top:0}
.in{width:100%;font-size:16px;padding:12px 13px;border:1px solid var(--border);border-radius:11px;background:#fff;outline:none}
.in:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(27,63,116,.12)}
/* iOS les pone a los campos de fecha un ancho mínimo propio y se salen del recuadro */
input[type=datetime-local].in{display:block;min-width:0;max-width:100%;min-height:49px}
input[type=datetime-local].in::-webkit-date-and-time-value{text-align:left}
@supports (-webkit-touch-callout:none){input[type=datetime-local].in{-webkit-appearance:none;appearance:none}}

/* Edificio: tres botones grandes */
.lugares{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lugar{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 13px;border:1.5px solid var(--border);border-radius:12px;background:#fff;font-size:15px;font-weight:600;cursor:pointer}
.lugar i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.lugar.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}

/* Bolsones: − número + */
.contador{display:flex;align-items:center;gap:10px}
.contador button{width:52px;height:52px;border-radius:12px;border:1px solid var(--border);background:#fff;font-size:26px;font-weight:600;cursor:pointer;flex:none}
.contador input{text-align:center;font-size:22px;font-weight:700}

.botones{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#0f172a 0%,#16213e 55%,#1b3f74 100%)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{flex:0 0 auto;background:#fff;color:var(--text2);border:1px solid var(--border)}

/* Lista de cargas */
.fila{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #EFECE6}
.fila:first-child{border-top:0}
.fila i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.fila .t{flex:1;min-width:0}
.fila .t b{display:block;font-size:14.5px}
.fila .t span{font-size:13px;color:var(--text2)}
.fila .n{font-size:18px;font-weight:700;min-width:28px;text-align:center}
.fila .n.cero{color:var(--text3)}
.fila .acc{display:flex;gap:6px}
.fila .acc button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2)}
.fila .acc button.borrar{color:var(--rojo)}
.fila.editando{background:#F3F6FB;margin:0 -16px;padding-left:16px;padding-right:16px}
.vacio{color:var(--text3);font-size:14px;text-align:center;padding:10px}
.mas{display:block;width:100%;margin-top:8px;border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer}

/* Aviso abajo */
.aviso{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);background:#1A1714;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20}
.aviso.error{background:var(--rojo)}

.cargando{text-align:center;color:var(--text2);padding:30px 0;font-size:14px}
/* Mientras se leen las cargas: la pantalla de carga de assets/carga.css (igual en todas las páginas) */
@keyframes girar{to{transform:rotate(360deg)}}
/* ── Modo oscuro (12/11): botón de la luna a la derecha del usuario (assets/comun.js) ── */
:root[data-theme="dark"]{
  --bg:#1e2126; --card:#272b31; --border:#3b4048;
  --text:#ECEAE6; --text2:#B3ADA5; --text3:#857F77;
  --azul:#7fa2dc; --rojo:#ff8b7e; --verde:#4fd1a0;
  --shadow:0 4px 20px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}
[data-theme="dark"] body{background:var(--bg);background-attachment:fixed}
[data-theme="dark"] .in,[data-theme="dark"] .lugar,[data-theme="dark"] .contador button,[data-theme="dark"] .btn.sec,[data-theme="dark"] .fila .acc button,[data-theme="dark"] .mas{background:#2e3238;color:var(--text)}
[data-theme="dark"] .btn.sec,[data-theme="dark"] .fila .acc button,[data-theme="dark"] .mas{color:var(--text2)}
[data-theme="dark"] .lugar.on{background:color-mix(in srgb,var(--c) 22%,#272b31)}
[data-theme="dark"] .fila{border-top-color:#363a41}
[data-theme="dark"] .fila.editando{background:#2b3242}
[data-theme="dark"] .aviso{background:#ECEAE6;color:#1A1714}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/comun.js?v=202611132310"></script>
<script src="assets/acceso.js?v=202611130130"></script>
<script src="assets/vaciados.js?v=202611101900"></script>
<script>COM2.acceso({ roles: ['admin'] });   // solo admin (panel Admin)</script>
</head>
<body>

<header class="barra">
  <a class="com2-marca" href="./">COM 2</a>
  <div class="barra-in">
    <div class="titulo"><span class="ico" aria-hidden="true">♻</span><h1>Carga Barrios Sustentables Cerro</h1></div>
  </div>
</header>

<!-- Mientras se leen las cargas -->
<div class="com2-carga" id="pantallaCargando" role="status" aria-live="polite">
  <div class="com2-rueda" id="ruedita"></div>
  <div class="com2-carga-t" id="cargaT">Cargando información</div>
  <button type="button" id="reintentar" hidden>Reintentar</button>
</div>


<div class="wrap" id="pantallaCarga" hidden>
  <div class="cabeza">
    <div class="pasado" id="pasado" hidden><label for="inPasado">Pasado hasta</label><input type="date" id="inPasado"></div>
    <span class="estado" id="estadoPasado" aria-live="polite"></span>
  </div>
  <form class="card" id="form">
    <h2 id="tituloForm">Nueva carga</h2>

    <label class="l">Edificio</label>
    <div class="lugares" id="lugares"></div>

    <label class="l" for="inFecha">Fecha y hora del vaciado</label>
    <input class="in num" id="inFecha" type="datetime-local" required>

    <label class="l" for="inCant">Bolsones</label>
    <div class="contador">
      <button type="button" id="menos" aria-label="Uno menos">−</button>
      <input class="in num" id="inCant" type="number" inputmode="numeric" min="0" max="999" step="1" required>
      <button type="button" id="mas" aria-label="Uno más">+</button>
    </div>

    <div class="botones">
      <button class="btn sec" type="button" id="cancelar" hidden>Cancelar</button>
      <button class="btn" type="submit" id="guardar">Guardar</button>
    </div>
  </form>

  <section class="card">
    <h2>Cargados</h2>
    <div id="lista"><div class="cargando">Cargando…</div></div>
    <button class="mas" type="button" id="verMas" hidden>Ver más</button>
  </section>
</div>

<div class="aviso" id="aviso" hidden></div>

<script>
// Los mismos tres puntos que barrios-sustentables-cerro.html y el Apps Script
const LUGARES = [
  { nombre: 'Plaza Débora Céspedes', dir: 'EGIPTO esq. SUECIA', color: '#1baf7a' },
  { nombre: 'Federación FOICA', dir: 'HOLANDA 1715', color: '#2a78d6' },
  { nombre: 'Plaza de Deportes N11', dir: 'PORTUGAL esq. AUSTRIA', color: '#eb6834' },
  { nombre: 'Seccional N24', dir: 'PRUSIA 1895', color: '#8b5cf6' },
  { nombre: 'Escuela Luisa Casteran', dir: 'CHINA 1898', color: '#e0457b' },
  { nombre: 'Formativas de Rampla', dir: 'TURQUIA 3335', color: '#d99a00' },
  { nombre: 'Club de Pesca', dir: 'GRECIA 3152', color: '#14a3b8' },
  { nombre: 'Escuela N29', dir: 'PORTUGAL 3325', color: '#a0663a' },
  { nombre: 'Club Verdirrojo', dir: 'PRUSIA 1621', color: '#5b6b82' },
];
const TABLERO = 'cerro';   // tablero en la tabla vaciados
const POR_PAGINA = 15;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const colorDe = nombre => (LUGARES.find(l => l.nombre === nombre) || {}).color || '#B5AFA6';
// "2026-11-04T14:30" → "04/11/2026 14:30"
const fLinda = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)} ${s.slice(11, 16)}` : 'Sin fecha';
// Ahora en Montevideo, en el formato del campo de fecha
const ahora = () => new Date().toLocaleString('sv-SE', { timeZone: 'America/Montevideo' }).slice(0, 16).replace(' ', 'T');

// leida: si ya llegó la lista (antes de eso se muestra "Cargando…")
let filas = [], leida = false, editando = null, mostrar = POR_PAGINA, lugarElegido = null;


let avisoT;
function aviso(texto, error = false) {
  $('aviso').textContent = texto;
  $('aviso').className = 'aviso' + (error ? ' error' : '');
  $('aviso').hidden = false;
  clearTimeout(avisoT); avisoT = setTimeout(() => $('aviso').hidden = true, error ? 5000 : 2500);
}

// Lee y escribe en Supabase (assets/vaciados.js); devuelve lo mismo que devolvía el Apps Script
async function pedir(datos) {
  const r = await Vaciados.pedir(TABLERO, datos);
  filas = r.filas;
  leida = true;
  // No se pisa la fecha mientras se la está cambiando
  if (document.activeElement !== $('inPasado')) $('inPasado').value = r.marca || '';
  dibujarLista();
  return r;
}

// cual: 'cargando' (ruedita) o 'carga'
function pantalla(cual) {
  $('pantallaCargando').hidden = cual !== 'cargando';
  $('pantallaCarga').hidden = cual !== 'carga';
  $('pasado').hidden = cual !== 'carga';
}

// ── Formulario ──────────────────────────────────────────────────────────────
function dibujarLugares() {
  $('lugares').innerHTML = LUGARES.map((l, i) => `<button type="button" class="lugar${lugarElegido === l.nombre ? ' on' : ''}" style="--c:${l.color}" data-i="${i}"><i></i>${esc(l.nombre)}</button>`).join('');
  $('lugares').querySelectorAll('button').forEach(b => b.onclick = () => {
    lugarElegido = LUGARES[+b.dataset.i].nombre;
    dibujarLugares();
  });
}

function limpiarForm() {
  editando = null;
  lugarElegido = null;
  $('inFecha').value = ahora();
  $('inCant').value = 1;
  $('tituloForm').textContent = 'Nueva carga';
  $('guardar').textContent = 'Guardar';
  $('cancelar').hidden = true;
  dibujarLugares();
  dibujarLista();
}

function editar(f) {
  editando = f;
  lugarElegido = f.edif;
  $('inFecha').value = f.fGes;
  $('inCant').value = f.cant ?? 0;
  $('tituloForm').textContent = 'Editar carga';
  $('guardar').textContent = 'Guardar cambios';
  $('cancelar').hidden = false;
  dibujarLugares();
  dibujarLista();
  $('form').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$('menos').onclick = () => $('inCant').value = Math.max(0, (parseInt($('inCant').value, 10) || 0) - 1);
$('mas').onclick = () => $('inCant').value = Math.min(999, (parseInt($('inCant').value, 10) || 0) + 1);
$('cancelar').onclick = limpiarForm;

$('form').onsubmit = async e => {
  e.preventDefault();
  if (!lugarElegido) return aviso('Elegí el edificio', true);
  const cant = parseInt($('inCant').value, 10);
  if (!$('inFecha').value) return aviso('Falta la fecha y hora', true);
  if (!(cant >= 0)) return aviso('Falta la cantidad de bolsones', true);
  // La dirección no se pide: va la del punto elegido
  const dir = (LUGARES.find(l => l.nombre === lugarElegido) || {}).dir || '';
  const fila = { edif: lugarElegido, dir, fGes: $('inFecha').value.slice(0, 16), cant };
  $('guardar').disabled = true;
  try {
    if (editando) {
      await pedir({ accion: 'editar', n: editando.n, antes: { edif: editando.edif, fGes: editando.fGes, cant: editando.cant }, fila });
      aviso('Cambios guardados');
    } else {
      await pedir({ accion: 'agregar', fila });
      aviso('Carga guardada');
    }
    limpiarForm();
  } catch (err) {
    aviso(err.message, true);
  } finally {
    $('guardar').disabled = false;
  }
};

// ── Lista ───────────────────────────────────────────────────────────────────
function dibujarLista() {
  // De la más nueva a la más vieja (por fecha del vaciado)
  const orden = [...filas].sort((a, b) => (b.fGes || '').localeCompare(a.fGes || '') || b.n - a.n);
  const ver = orden.slice(0, mostrar);
  $('lista').innerHTML = ver.length ? ver.map(f => `<div class="fila${editando && editando.n === f.n ? ' editando' : ''}" style="--c:${colorDe(f.edif)}">
      <i></i>
      <div class="t"><b>${esc(f.edif || 'Sin edificio')}</b><span class="num">${fLinda(f.fGes)}</span></div>
      <div class="n num${f.cant ? '' : ' cero'}">${f.cant ?? '–'}</div>
      <div class="acc"><button type="button" data-n="${f.n}" data-a="e">Editar</button><button type="button" class="borrar" data-n="${f.n}" data-a="b">Borrar</button></div>
    </div>`).join('') : `<div class="vacio">${leida ? 'Todavía no hay cargas' : 'Cargando…'}</div>`;
  $('verMas').hidden = orden.length <= mostrar;
  $('lista').querySelectorAll('button').forEach(b => b.onclick = async () => {
    const f = filas.find(x => x.n === +b.dataset.n);
    if (!f) return;
    if (b.dataset.a === 'e') return editar(f);
    if (!confirm(`¿Borrar la carga de ${f.edif}, ${fLinda(f.fGes)}, ${f.cant ?? 0} bolsones?`)) return;
    b.disabled = true;
    try {
      await pedir({ accion: 'borrar', n: f.n, antes: { edif: f.edif, fGes: f.fGes, cant: f.cant } });
      if (editando && editando.n === f.n) limpiarForm();
      aviso('Carga borrada');
    } catch (err) {
      aviso(err.message, true);
      b.disabled = false;
    }
  });
}
$('verMas').onclick = () => { mostrar += POR_PAGINA; dibujarLista(); };

// "Pasado hasta": se guarda apenas se elige la fecha
let estadoT;
$('inPasado').onchange = async () => {
  const est = $('estadoPasado');
  clearTimeout(estadoT);
  est.innerHTML = '<span class="rd"></span><span class="tx">Cargando…</span>';
  try {
    await pedir({ accion: 'marca', valor: $('inPasado').value });
    est.innerHTML = '<span class="ok" aria-label="Guardado">✓</span>';
    estadoT = setTimeout(() => est.innerHTML = '', 2000);
  } catch (err) {
    est.innerHTML = '';
    aviso(err.message, true);
  }
};

// ── Inicio ──────────────────────────────────────────────────────────────────

function cargando() {
  $('ruedita').hidden = false;
  $('cargaT').textContent = 'Cargando información';
  $('cargaT').className = 'com2-carga-t';
  $('reintentar').hidden = true;
  pantalla('cargando');
}

// La página se muestra recién cuando llegó todo (lista y "Pasado hasta")
async function iniciar() {
  limpiarForm();
  cargando();
  try {
    await pedir({ accion: 'listar' });
    pantalla('carga');
  } catch (err) {
    $('ruedita').hidden = true;
    $('cargaT').textContent = 'No se pudieron leer las cargas (' + err.message + ')';
    $('cargaT').className = 'com2-carga-t error';
    $('reintentar').hidden = false;
  }
}
$('reintentar').onclick = iniciar;
iniciar();
</script>
</body>
</html>
