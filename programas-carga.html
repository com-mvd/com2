<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Carga Patricia · COM 2</title>
<link rel="icon" type="image/png" href="assets/logo-ciemsa.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/barra.css?v=202611171930">
<link rel="stylesheet" href="assets/carga.css?v=202611131600">
<style>
:root{--bg:#F7F6F3;--card:#fff;--text:#1A1714;--sec:#5F5A54;--borde:#E6E2DA;--rama:#CFC9BF;--azul:#1B3F74;--programa:#E7EFFA;--borde-programa:#CBD7E8;--sombra:0 4px 16px rgba(26,23,20,.07)}
[data-theme="dark"]{--bg:#181b20;--card:#262b33;--text:#F2F0EC;--sec:#C2C6CD;--borde:#434A54;--rama:#626C7C;--azul:#B8D2F9;--programa:#243750;--borde-programa:#405B7E;--sombra:0 4px 16px rgba(0,0,0,.22)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
[hidden]{display:none!important}
.menu{width:min(100%,900px);margin:0 auto;padding:24px 16px 20px}
.arbol,.arbol ul{list-style:none;margin:0;padding:0}
.arbol{display:grid;gap:18px;max-width:600px;margin:0 auto}
.arbol ul{margin-left:22px;padding-left:28px}
.arbol ul>li{position:relative;padding-top:8px}
.arbol ul>li::before,.arbol ul>li::after{content:'';position:absolute;left:-28px}
.arbol ul>li::before{top:0;bottom:0;border-left:2px solid var(--rama)}
.arbol ul>li:last-child::before{bottom:auto;height:calc(8px + var(--mitad,22px))}
.arbol ul>li::after{top:calc(8px + var(--mitad,22px));right:100%;border-top:2px solid var(--rama)}
.nodo{width:fit-content;padding:6px 16px;background:var(--card);border:1px solid var(--borde);border-radius:14px;box-shadow:var(--sombra)}
.eti{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sec)}
.nom{display:block;font-size:16px;font-weight:700}
.munic{min-height:48px;padding:7px 20px;background:linear-gradient(135deg,#0f172a,#1b3f74);border:0;color:#fff}
.munic .eti{color:#B3C7E5}
.munic .nom{font-size:18px}
.arbol li.programas{--mitad:14px}
.grupo{width:min(100%,340px);padding:0;overflow:hidden;border-color:var(--borde-programa)}
.grupo .eti{padding:7px 15px;background:var(--programa);border-bottom:1px solid var(--borde-programa);color:var(--azul);font-size:11px}
.prog{display:flex;align-items:center;gap:10px;min-height:44px;padding:5px 14px 5px 15px;color:inherit;text-decoration:none}
.prog + .prog{border-top:1px solid var(--borde)}
.prog:hover,.prog:focus-visible{background:var(--programa)}
.prog:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}
.prog .nom{font-size:15px}
.det{font-size:12px;color:var(--sec)}
.ir{display:grid;place-items:center;flex:none;width:27px;height:27px;margin-left:auto;border-radius:50%;background:var(--programa);color:var(--azul);font-size:20px;line-height:1}
@media (min-width:761px){.arbol{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:clamp(18px,4vw,40px);max-width:none}}
@media (max-width:560px){.arbol ul{margin-left:14px;padding-left:20px}.arbol ul>li::before,.arbol ul>li::after{left:-20px}}
</style>
</head>
<body>
<header class="barra">
  <a class="com2-marca com2-volver" href="./?panel=admin" aria-label="Volver al panel Admin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Volver</span></a>
  <div class="barra-in"><div class="titulo"><h1>Carga Patricia</h1></div></div>
</header>
<div class="com2-carga" id="com2-carga" role="status">
  <div class="com2-rueda"></div><div class="com2-carga-t">Cargando información</div>
</div>
<main class="menu" id="menu" hidden>
  <ul class="arbol" id="arbol"></ul>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/comun.js?v=202611171900"></script>
<script src="assets/acceso.js?v=202611130130"></script>
<script src="assets/programas-carga.js?v=1"></script>
<script>
const { esc } = COM2;

function enlacePrograma(p, tablero) {
  return `<a class="prog" href="barrios-sustentables-carga.html?programa=${encodeURIComponent(p.id)}">
    <div><span class="nom">${esc(p.nombre)}</span><span class="det" data-tablero="${esc(tablero)}">Pasado hasta: …</span></div>
    <span class="ir" aria-hidden="true">›</span>
  </a>`;
}

async function actualizarMarcas() {
  const tableros = ProgramasCarga.municipios.map(m => m.tablero);
  const { data, error } = await COM2.sb.from('vaciados_marca')
    .select('tablero,pasado_hasta').in('tablero', tableros);
  const fechas = new Map((data ?? []).map(marca => [marca.tablero, marca.pasado_hasta]));
  document.querySelectorAll('.det[data-tablero]').forEach(detalle => {
    const fecha = fechas.get(detalle.dataset.tablero);
    const texto = fecha ? fecha.split('-').reverse().join('/') : 'Sin fecha';
    detalle.textContent = `Pasado hasta: ${error ? 'No disponible' : texto}`;
  });
}

COM2.acceso({ roles: ['admin'] }).then(yo => {
  if (!yo) return;
  document.getElementById('arbol').innerHTML = ProgramasCarga.municipios.map(m => `<li>
    <div class="nodo munic"><span class="eti">Municipio</span><span class="nom">${esc(m.nombre)}</span></div>
    <ul>${m.barrios.map(b => `<li>
      <div class="nodo barrio"><span class="eti">Barrio</span><span class="nom">${esc(b.nombre)}</span></div>
      <ul><li class="programas"><div class="nodo grupo">
        <span class="eti">Programa</span>${b.programas.map(p => enlacePrograma(p, m.tablero)).join('')}
      </div></li></ul>
    </li>`).join('')}</ul>
  </li>`).join('');
  document.getElementById('menu').hidden = false;
  COM2.carga.listo();
  actualizarMarcas();
  window.addEventListener('pageshow', e => { if (e.persisted) actualizarMarcas(); });
});
</script>
</body>
</html>
