<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16213e">
<title>COM 2</title>
<link rel="icon" type="image/png" href="assets/logo-ciemsa.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/comun.css?v=202611100928">
<style>
/* COM 2: login con cédula + contraseña (Supabase Auth) y menú por paneles (Operador / Supervisor / Admin).
   El menú sale de la tabla secciones; cada rol ve su panel y los de abajo (lo controla RLS en la base). */

/* Login: solo el recuadro blanco, centrado en la pantalla.
   Un poco por encima del centro exacto: centrado al milímetro se ve más abajo. */
.centro{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 20px calc(20px + 9vh)}
.login{width:100%;max-width:380px;background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:0 10px 40px rgba(26,23,20,.08);padding:30px 26px 26px}
.login .logo{display:block;height:58px;margin:0 auto 22px}
label.l{display:block;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}
label.l:first-of-type{margin-top:0}
.in{font-size:16px;padding:12px 13px}
.btn.ancho{width:100%;margin-top:22px;padding:14px;font-size:16px}
.login .error{margin-top:14px;text-align:center}

/* Cambio de contraseña */
/* centrado en el espacio debajo de la barra, igual que el login */
.centro-clave{min-height:calc(100vh - 62px - 62px);min-height:calc(100dvh - 62px - 62px);display:flex;align-items:center;justify-content:center;padding-bottom:9vh}
.clave{width:100%;max-width:420px;padding:24px}
.clave h2{font-size:18px;margin-bottom:16px}
.clave p.sub{font-size:14px;color:var(--text2);margin:-10px 0 16px}
.clave label.l small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--text3);font-size:11.5px}
.clave .error{margin-top:12px}

/* Menú del panel */
.aviso-ok{background:#E3F5EE;border:1px solid #bfe6d6;color:#137a55;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.aviso-ok{max-width:860px;width:100%;margin:0 auto;text-align:center}
/* Portada del panel: mismo estilo que el index de Dashboard (título, rayita y tarjetas con ícono) */
.portada{min-height:calc(100vh - 62px - 62px);min-height:calc(100dvh - 62px - 62px);display:flex;align-items:center;justify-content:center;padding-bottom:6vh}
.cover{max-width:860px;width:100%;text-align:center}
.headline{font-size:clamp(32px,5.5vw,48px);font-weight:700;letter-spacing:-1.2px;line-height:1.08}
.rule{width:42px;height:3px;border-radius:2px;background:#39745E;margin:1.4rem auto 2.6rem}
.grupo + .grupo{margin-top:2.2rem}
.grupo h3{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
/* hasta 3 por renglón; si el último renglón queda incompleto, sus tarjetas van centradas */
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:812px;margin:0 auto}
.grid .tile{flex:0 1 260px}
@media (max-width:680px){.grid .tile{flex:0 1 calc(50% - 8px)}}
@media (max-width:420px){.grid .tile{flex:1 1 100%}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:#fff;border:1px solid #E2DED6;border-radius:18px;padding:2rem 1rem 1.6rem;text-decoration:none;color:inherit;box-shadow:0 4px 20px rgba(26,23,20,.06),0 1px 3px rgba(26,23,20,.05);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.tile:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(26,23,20,.10),0 2px 6px rgba(26,23,20,.06);border-color:#D0CBCB}
.tile-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tile-icon svg{width:26px;height:26px;fill:none;stroke-width:1.6}
.tile-name{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.acc-teal .tile-icon{background:#DCEDE4}.acc-teal .tile-icon svg{stroke:#39745E}
.acc-blue .tile-icon{background:#DDECF4}.acc-blue .tile-icon svg{stroke:#346A92}
.acc-amber .tile-icon{background:#F5E4CF}.acc-amber .tile-icon svg{stroke:#9A642A}
.acc-violet .tile-icon{background:#E5DDF0}.acc-violet .tile-icon svg{stroke:#6C5790}
.vacio{color:var(--text3);font-size:15px}
.pantalla-cargando{min-height:100vh;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<header id="barra" hidden></header>

<div class="pantalla-cargando" id="vCargando"><div class="cargando"><div class="rueda"></div>Cargando información</div></div>

<!-- Login -->
<div class="centro" id="vLogin" hidden>
  <form class="login" id="fLogin" autocomplete="on">
    <img class="logo" src="assets/logo-ciemsa.png" alt="CIEMSA">
    <label class="l" for="usuario">Usuario</label>
    <input class="in num" id="usuario" name="username" inputmode="numeric" autocomplete="username" required>
    <label class="l" for="clave">Contraseña</label>
    <input class="in" id="clave" name="password" type="password" autocomplete="current-password" required>
    <button class="btn ancho" id="entrar">Entrar</button>
    <div class="error" id="errLogin" hidden></div>
  </form>
</div>

<main class="wrap" id="vApp" hidden>
  <!-- Cambio de contraseña (obligatorio en el primer ingreso) -->
  <div class="centro-clave" id="vClave" hidden>
  <form class="card clave" id="fClave">
    <h2 id="claveTitulo">Cambiar contraseña</h2>
    <p class="sub" id="claveSub" hidden>Es tu primer ingreso: cambiá la contraseña que te dieron por una tuya.</p>
    <label class="l" for="cActual">Contraseña actual</label>
    <input class="in" id="cActual" type="password" autocomplete="current-password" required>
    <label class="l" for="cNueva">Contraseña nueva <small>(mín. 8, con letras y números)</small></label>
    <input class="in" id="cNueva" type="password" autocomplete="new-password" required>
    <label class="l" for="cRepite">Repetí la contraseña nueva</label>
    <input class="in" id="cRepite" type="password" autocomplete="new-password" required>
    <button class="btn ancho" id="guardarClave">Guardar contraseña</button>
    <div class="error" id="errClave" hidden></div>
  </form>
  </div>

  <!-- Menú del panel elegido -->
  <section id="vMenu" hidden>
    <div class="aviso-ok" id="okClave" hidden>Contraseña cambiada.</div>
    <div class="portada"><div class="cover">
      <h1 class="headline" id="tituloPanel"></h1>
      <div class="rule"></div>
      <div id="menu"></div>
    </div></div>
  </section>
</main>

<div class="centro" id="vError" hidden>
  <div class="login" style="text-align:center">
    <img class="logo" src="assets/logo-ciemsa.png" alt="CIEMSA">
    <p class="error" id="errGeneral"></p>
    <button class="btn ancho" type="button" onclick="location.reload()">Reintentar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/comun.js?v=202611100928"></script>
<script>
const { sb, esc } = COM2;
const DOMINIO = '@com.local';   // el usuario es la cédula; por dentro, cédula@com.local
const $ = id => document.getElementById(id);
let perfil = null, panel = null, secciones = null;

function ver(v) {
  ['vCargando', 'vLogin', 'vError'].forEach(x => $(x).hidden = x !== v);
  $('vApp').hidden = !['vClave', 'vMenu'].includes(v);
  $('vClave').hidden = v !== 'vClave';
  $('vMenu').hidden = v !== 'vMenu';
  if (!['vClave', 'vMenu'].includes(v)) $('barra').hidden = true;
}
function error(el, msg) { $(el).textContent = msg || ''; $(el).hidden = !msg; }
function dibujarBarra() {
  COM2.barra({ perfil, panel, paneles: !perfil.debe_cambiar_clave, alCambiarPanel: p => { panel = p; mostrarMenu(); }, alCambiarClave: () => mostrarClave(false) });
}

async function arrancar() {
  ver('vCargando');
  try {
    perfil = await COM2.perfil();
    if (!perfil) return ver('vLogin');
    panel = COM2.panelInicial(perfil);
    dibujarBarra();
    if (perfil.debe_cambiar_clave) return mostrarClave(true);
    if (new URLSearchParams(location.search).get('clave')) { history.replaceState(null, '', './'); return mostrarClave(false); }
    await mostrarMenu();
  } catch (e) {
    console.error(e);
    if (e.sinAcceso) { ver('vLogin'); return error('errLogin', e.message); }
    error('errGeneral', 'No se pudo cargar. Revisá la conexión e intentá de nuevo.');
    ver('vError');
  }
}

// ---- Login ----
$('fLogin').addEventListener('submit', async ev => {
  ev.preventDefault();
  error('errLogin');
  const u = $('usuario').value.replace(/\D/g, '');
  if (u.length < 7) return error('errLogin', 'Usuario o contraseña incorrectos.');
  $('entrar').disabled = true; $('entrar').textContent = 'Entrando…';
  const { error: e } = await sb.auth.signInWithPassword({ email: u + DOMINIO, password: $('clave').value });
  $('entrar').disabled = false; $('entrar').textContent = 'Entrar';
  if (e) return error('errLogin', /invalid|banned/i.test(e.message) ? 'Usuario o contraseña incorrectos.' : 'No se pudo entrar. Revisá la conexión.');
  $('clave').value = '';
  arrancar();
});

// ---- Cambio de contraseña ----
function mostrarClave(obligatorio) {
  $('fClave').reset(); error('errClave'); $('okClave').hidden = true;
  $('claveTitulo').textContent = obligatorio ? 'Elegí tu contraseña' : 'Cambiar contraseña';
  $('claveSub').hidden = !obligatorio;   // solo en el primer ingreso se explica por qué
  ver('vClave');
}
$('fClave').addEventListener('submit', async ev => {
  ev.preventDefault();
  error('errClave');
  const actual = $('cActual').value, nueva = $('cNueva').value;
  if (nueva.length < 8 || !/[a-zA-Z]/.test(nueva) || !/\d/.test(nueva)) return error('errClave', 'La contraseña nueva tiene que tener al menos 8 caracteres, con letras y números.');
  if (nueva !== $('cRepite').value) return error('errClave', 'Las dos contraseñas nuevas no coinciden.');
  if (nueva === actual) return error('errClave', 'La contraseña nueva tiene que ser distinta de la actual.');
  $('guardarClave').disabled = true; $('guardarClave').textContent = 'Guardando…';
  try {
    // Supabase exige la contraseña actual (current_password) para cambiarla.
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(COM2.URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { apikey: COM2.KEY, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: nueva, current_password: actual })
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      const msg = { current_password_invalid: 'La contraseña actual no es correcta.', weak_password: 'La contraseña nueva es muy débil: usá al menos 8 caracteres, con letras y números.', same_password: 'La contraseña nueva tiene que ser distinta de la actual.' }[j.error_code];
      throw new Error(msg || j.msg || 'No se pudo cambiar la contraseña.');
    }
    if (perfil.debe_cambiar_clave) {
      await sb.rpc('clave_cambiada');
      perfil.debe_cambiar_clave = false;
      dibujarBarra();   // ahora sí, con los paneles
    }
    await mostrarMenu();
    $('okClave').hidden = false;
  } catch (e) {
    error('errClave', e.message);
  } finally {
    $('guardarClave').disabled = false; $('guardarClave').textContent = 'Guardar contraseña';
  }
});

// ---- Menú ----
async function mostrarMenu() {
  if (!secciones) {
    const { data, error: e } = await sb.from('secciones').select('nombre,archivo,grupo,orden,panel,icono,color').order('grupo').order('orden').order('nombre');
    if (e) throw e;
    secciones = data;
  }
  dibujarMenu();
  ver('vMenu');
}
const TITULO_PANEL = { operador: 'Operación', supervisor: 'Supervisión', admin: 'Administración' };
function dibujarMenu() {
  $('okClave').hidden = true;
  $('tituloPanel').textContent = TITULO_PANEL[panel];
  const del = secciones ? secciones.filter(s => s.panel === panel) : [];
  if (!del.length) { $('menu').innerHTML = '<p class="vacio">Todavía no hay nada en este panel.</p>'; return; }
  const grupos = {};
  del.forEach(s => (grupos[s.grupo] ||= []).push(s));
  const conTitulos = Object.keys(grupos).length > 1;   // con un solo grupo no hace falta el subtítulo
  $('menu').innerHTML = Object.entries(grupos).map(([g, ss]) =>
    `<div class="grupo">${conTitulos ? `<h3>${esc(g)}</h3>` : ''}<div class="grid">${ss.map(s =>
      `<a class="tile acc-${esc(s.color)}" href="${esc(s.archivo)}"><div class="tile-icon">${COM2.icono(s.icono)}</div><div class="tile-name">${esc(s.nombre)}</div></a>`).join('')}</div></div>`
  ).join('');
}

arrancar();
</script>
</body>
</html>
