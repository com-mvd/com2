<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16213e">
<title>COM 2</title>
<link rel="icon" type="image/png" href="assets/logo-ciemsa.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/comun.css?v=202611132330">
<link rel="stylesheet" href="assets/carga.css?v=202611131600">
<style>
/* COM 2: login con cédula + contraseña (Supabase Auth) y menú por paneles (Operador / Supervisor / Admin).
   El menú sale de la tabla secciones; cada rol ve su panel y los de abajo (lo controla RLS en la base). */

/* Login: solo el recuadro blanco, centrado en la pantalla.
   Un poco por encima del centro exacto: centrado al milímetro se ve más abajo. */
.centro{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 20px calc(20px + 9vh)}
.login{width:100%;max-width:380px;background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:0 10px 40px rgba(26,23,20,.08);padding:30px 26px 26px}
.login .logo{display:block;height:58px;margin:0 auto 22px}
label.l{display:block;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}
label.l:first-of-type{margin-top:0}
.in{font-size:16px;padding:12px 13px}
.btn.ancho{width:100%;margin-top:22px;padding:14px;font-size:16px}
.login .error{margin-top:14px;text-align:center}

/* Cambio de contraseña */
/* centrado en el espacio debajo de la barra, igual que el login */
.centro-clave{min-height:calc(100vh - 62px - 62px);min-height:calc(100dvh - 62px - 62px);display:flex;align-items:center;justify-content:center;padding-bottom:9vh}
.clave{width:100%;max-width:420px;padding:24px}
.clave h2{font-size:18px;margin-bottom:16px}
.clave p.sub{font-size:14px;color:var(--text2);margin:-10px 0 16px}
.clave label.l small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--text3);font-size:11.5px}
.clave .error{margin-top:12px}

/* Menú del panel */
.aviso-ok{background:#E3F5EE;border:1px solid #bfe6d6;color:#137a55;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.aviso-ok{max-width:860px;width:100%;margin:0 auto;text-align:center}
/* Portada del panel: tarjetas con ícono como el index de Dashboard, sin título */
.portada{min-height:calc(100vh - 62px - 62px);min-height:calc(100dvh - 62px - 62px);display:flex;align-items:center;justify-content:center;padding-bottom:6vh}
.cover{max-width:860px;width:100%;text-align:center}
.grupo + .grupo{margin-top:2.2rem}
.grupo h3{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
/* hasta 3 por renglón; si el último renglón queda incompleto, sus tarjetas van centradas */
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:812px;margin:0 auto}
.grid .tile{flex:0 1 260px}
@media (max-width:680px){.grid .tile{flex:0 1 calc(50% - 8px)}}
@media (max-width:420px){.grid .tile{flex:1 1 100%}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:#fff;border:1px solid #E2DED6;border-radius:18px;padding:2rem 1rem 1.6rem;text-decoration:none;color:inherit;box-shadow:0 4px 20px rgba(26,23,20,.06),0 1px 3px rgba(26,23,20,.05);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.tile:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(26,23,20,.10),0 2px 6px rgba(26,23,20,.06);border-color:#D0CBCB}
.tile-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tile-icon svg{width:26px;height:26px;fill:none;stroke-width:1.6}
.tile-name{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.acc-teal .tile-icon{background:#DCEDE4}.acc-teal .tile-icon svg{stroke:#39745E}
.acc-blue .tile-icon{background:#DDECF4}.acc-blue .tile-icon svg{stroke:#346A92}
.acc-amber .tile-icon{background:#F5E4CF}.acc-amber .tile-icon svg{stroke:#9A642A}
.acc-violet .tile-icon{background:#E5DDF0}.acc-violet .tile-icon svg{stroke:#6C5790}
.vacio{color:var(--text3);font-size:15px}

/* Panel Supervisor: un recuadro por servicio con su Actualizar, la hora de la última subida y sus páginas.
   Mismo dibujo que la portada del repo com (10/11/2026): botones chicos, cuadros semitransparentes, páginas en lista.
   El botón Actualizar GPS se sacó a pedido del usuario (10/11): se verá más adelante si se agrega. */
.sup{width:100%;margin:0 auto;padding:0 0 2.5rem}   /* arriba, los 14 px de .wrap: igual que en todas las páginas (13/11) */
.btn-act{display:inline-flex;align-items:center;gap:4px;flex:none;background:#fff;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font:600 10.5px 'DM Sans',system-ui,sans-serif;cursor:pointer;transition:border-color .15s,background-color .15s}
.btn-act:hover{border-color:#D0CBCB;background:#FBFAF8}
.btn-act:disabled{cursor:default}
.btn-act svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-act.girando svg{animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.sup .estado{font-size:10px;color:var(--text3);white-space:nowrap;font-variant-numeric:tabular-nums}
.sup .estado.err{color:#B02020}
.servicios{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start;text-align:left}
@media (max-width:960px){.servicios{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.servicios{grid-template-columns:1fr}}
.serv{background:rgba(255,255,255,.55);border:1px solid var(--border);border-radius:18px;padding:1rem .85rem;box-shadow:0 4px 20px rgba(26,23,20,.06),0 1px 3px rgba(26,23,20,.05)}
.serv-h{margin-bottom:.8rem;padding-bottom:.8rem;border-bottom:1px solid var(--border)}
.serv-t{display:flex;align-items:center;gap:8px}
.serv-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.serv-n{font-size:17px;font-weight:700;letter-spacing:-.2px}
.serv-a{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;margin-top:.55rem}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:.65rem;background:#fff;border:1px solid var(--border);border-radius:14px;padding:.7rem .75rem;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(26,23,20,.05);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.item:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(26,23,20,.10),0 2px 6px rgba(26,23,20,.06);border-color:#D0CBCB}
.item-icon{flex:none;width:36px;height:36px;border-radius:10px;background:var(--cb);display:flex;align-items:center;justify-content:center}
.item-icon svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.item-name{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.1px;line-height:1.25}
.item-arrow{flex:none;color:var(--text3);font-size:18px}
.sin{font-size:13px;color:var(--text3);padding:.4rem .2rem}
.sup .grupo{margin-top:2.4rem}
.cover:has(.sup){max-width:none}
.portada:has(.sup){align-items:flex-start;padding-bottom:0}
</style>
</head>
<body>
<header id="barra" hidden></header>

<div class="com2-carga" id="vCargando" role="status" aria-live="polite"><div class="com2-rueda"></div><div class="com2-carga-t">Cargando información</div></div>

<!-- Login -->
<div class="centro" id="vLogin" hidden>
  <form class="login" id="fLogin" autocomplete="on">
    <img class="logo" src="assets/logo-ciemsa.png" alt="CIEMSA">
    <label class="l" for="usuario">Usuario</label>
    <input class="in num" id="usuario" name="username" inputmode="numeric" autocomplete="username" required>
    <label class="l" for="clave">Contraseña</label>
    <input class="in" id="clave" name="password" type="password" autocomplete="current-password" required>
    <button class="btn ancho" id="entrar">Entrar</button>
    <div class="error" id="errLogin" hidden></div>
  </form>
</div>

<main class="wrap" id="vApp" hidden>
  <!-- Cambio de contraseña (obligatorio en el primer ingreso) -->
  <div class="centro-clave" id="vClave" hidden>
  <form class="card clave" id="fClave">
    <h2 id="claveTitulo">Cambiar contraseña</h2>
    <p class="sub" id="claveSub" hidden>Es tu primer ingreso: cambiá la contraseña que te dieron por una tuya.</p>
    <label class="l" for="cActual">Contraseña actual</label>
    <input class="in" id="cActual" type="password" autocomplete="current-password" required>
    <label class="l" for="cNueva">Contraseña nueva <small>(mín. 8, con letras y números)</small></label>
    <input class="in" id="cNueva" type="password" autocomplete="new-password" required>
    <label class="l" for="cRepite">Repetí la contraseña nueva</label>
    <input class="in" id="cRepite" type="password" autocomplete="new-password" required>
    <button class="btn ancho" id="guardarClave">Guardar contraseña</button>
    <div class="error" id="errClave" hidden></div>
  </form>
  </div>

  <!-- Menú del panel elegido -->
  <section id="vMenu" hidden>
    <div class="aviso-ok" id="okClave" hidden>Contraseña cambiada.</div>
    <div class="portada"><div class="cover">
      <div id="menu"></div>
    </div></div>
  </section>
</main>

<div class="centro" id="vError" hidden>
  <div class="login" style="text-align:center">
    <img class="logo" src="assets/logo-ciemsa.png" alt="CIEMSA">
    <p class="error" id="errGeneral"></p>
    <button class="btn ancho" type="button" onclick="location.reload()">Reintentar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/comun.js?v=202611132310"></script>
<script>
const { sb, esc } = COM2;
const DOMINIO = '@com.local';   // el usuario es la cédula; por dentro, cédula@com.local
const $ = id => document.getElementById(id);
let perfil = null, panel = null, secciones = null;

function ver(v) {
  ['vCargando', 'vLogin', 'vError'].forEach(x => $(x).hidden = x !== v);
  $('vApp').hidden = !['vClave', 'vMenu'].includes(v);
  $('vClave').hidden = v !== 'vClave';
  $('vMenu').hidden = v !== 'vMenu';
  // Mientras carga, la barra queda como esté (dibujada con el perfil guardado, o escondida si no hay)
  if (!['vClave', 'vMenu', 'vCargando'].includes(v)) $('barra').hidden = true;
}
function error(el, msg) { $(el).textContent = msg || ''; $(el).hidden = !msg; }
function dibujarBarra() {
  COM2.barra({ perfil, panel, paneles: !perfil.debe_cambiar_clave, alCambiarPanel: p => { panel = p; mostrarMenu(); }, alCambiarClave: () => mostrarClave(false) });
}

async function arrancar() {
  // Con el perfil guardado en este navegador, la barra sale enseguida; después se confirma con Supabase
  const guardado = COM2.perfilGuardado();
  if (guardado && !perfil) { perfil = guardado; panel = COM2.panelInicial(perfil); dibujarBarra(); }
  ver('vCargando');
  try {
    perfil = await COM2.perfil();
    if (!perfil) return ver('vLogin');
    panel = COM2.panelInicial(perfil);
    dibujarBarra();
    if (perfil.debe_cambiar_clave) return mostrarClave(true);
    if (new URLSearchParams(location.search).get('clave')) { history.replaceState(null, '', './'); return mostrarClave(false); }
    await mostrarMenu();
  } catch (e) {
    console.error(e);
    if (e.sinAcceso) { ver('vLogin'); return error('errLogin', e.message); }
    error('errGeneral', 'No se pudo cargar. Revisá la conexión e intentá de nuevo.');
    ver('vError');
  }
}

// ---- Login ----
$('fLogin').addEventListener('submit', async ev => {
  ev.preventDefault();
  error('errLogin');
  const u = $('usuario').value.replace(/\D/g, '');
  if (u.length < 7) return error('errLogin', 'Usuario o contraseña incorrectos.');
  $('entrar').disabled = true; $('entrar').textContent = 'Entrando…';
  const { error: e } = await sb.auth.signInWithPassword({ email: u + DOMINIO, password: $('clave').value });
  $('entrar').disabled = false; $('entrar').textContent = 'Entrar';
  if (e) return error('errLogin', /invalid|banned/i.test(e.message) ? 'Usuario o contraseña incorrectos.' : 'No se pudo entrar. Revisá la conexión.');
  $('clave').value = '';
  arrancar();
});

// ---- Cambio de contraseña ----
function mostrarClave(obligatorio) {
  $('fClave').reset(); error('errClave'); $('okClave').hidden = true;
  $('claveTitulo').textContent = obligatorio ? 'Elegí tu contraseña' : 'Cambiar contraseña';
  $('claveSub').hidden = !obligatorio;   // solo en el primer ingreso se explica por qué
  ver('vClave');
}
$('fClave').addEventListener('submit', async ev => {
  ev.preventDefault();
  error('errClave');
  const actual = $('cActual').value, nueva = $('cNueva').value;
  if (nueva.length < 8 || !/[a-zA-Z]/.test(nueva) || !/\d/.test(nueva)) return error('errClave', 'La contraseña nueva tiene que tener al menos 8 caracteres, con letras y números.');
  if (nueva !== $('cRepite').value) return error('errClave', 'Las dos contraseñas nuevas no coinciden.');
  if (nueva === actual) return error('errClave', 'La contraseña nueva tiene que ser distinta de la actual.');
  $('guardarClave').disabled = true; $('guardarClave').textContent = 'Guardando…';
  try {
    // Supabase exige la contraseña actual (current_password) para cambiarla.
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(COM2.URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { apikey: COM2.KEY, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: nueva, current_password: actual })
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      const msg = { current_password_invalid: 'La contraseña actual no es correcta.', weak_password: 'La contraseña nueva es muy débil: usá al menos 8 caracteres, con letras y números.', same_password: 'La contraseña nueva tiene que ser distinta de la actual.' }[j.error_code];
      throw new Error(msg || j.msg || 'No se pudo cambiar la contraseña.');
    }
    if (perfil.debe_cambiar_clave) {
      await sb.rpc('clave_cambiada');
      perfil.debe_cambiar_clave = false;
      dibujarBarra();   // ahora sí, con los paneles
    }
    await mostrarMenu();
    $('okClave').hidden = false;
  } catch (e) {
    error('errClave', e.message);
  } finally {
    $('guardarClave').disabled = false; $('guardarClave').textContent = 'Guardar contraseña';
  }
});

// ---- Menú ----
async function mostrarMenu() {
  if (!secciones) {
    const { data, error: e } = await sb.from('secciones').select('nombre,archivo,grupo,orden,panel,icono,color').order('grupo').order('orden').order('nombre');
    if (e) throw e;
    secciones = data;
  }
  dibujarMenu();
  ver('vMenu');
}
// ---- Panel Supervisor: servicios con las bases del Grafana ----
// Cada servicio tiene una base que regenera n8n (en la PC del COM, por ngrok) y sube a Supabase Storage.
// Sus páginas son las filas de secciones con panel 'supervisor' y grupo = nombre del servicio.
const BASES = COM2.URL + '/storage/v1/object/public/bases/';
const N8N = 'https://blatancy-scouting-virtuous.ngrok-free.dev/webhook/';
const SERVICIOS = [   // colores de la portada de com: c = punto e ícono, cb = fondo del ícono
  { id: 'bolsones', nombre: 'Bolsones', c: '#D2691E', cb: '#FCE3CD' },
  { id: 'agenda', nombre: 'Agenda', c: '#346A92', cb: '#DDECF4' },
  { id: 'zona-limpia', nombre: 'Zona Limpia', c: '#39745E', cb: '#DCEDE4' },
  { id: 'reclamos', nombre: 'Reclamos', c: '#39745E', cb: '#DCEDE4' },
];
const ICONO_ACT = '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>';

// "10/11 12:33" en hora de Montevideo
function horaLocal(iso) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('es-UY', { timeZone: 'America/Montevideo', day: '2-digit', month: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(iso)).map(x => [x.type, x.value]));
  return `${p.day}/${p.month} ${p.hour}:${p.minute}`;
}
// Hora de la última subida de cada servicio, como la anota n8n en actualizado.json
async function subidas() {
  const r = await fetch(BASES + 'actualizado.json?t=' + Date.now(), { cache: 'no-store' });
  return r.ok ? r.json() : {};
}
function estado(el, texto, err) { el.textContent = texto; el.classList.toggle('err', !!err); }

function dibujarSupervisor(del) {
  const paginas = nombre => del.filter(s => s.grupo === nombre);
  const otros = del.filter(s => !SERVICIOS.some(x => x.nombre === s.grupo));
  const otrosGrupos = {};
  otros.forEach(s => (otrosGrupos[s.grupo] ||= []).push(s));
  $('menu').innerHTML = `<div class="sup">
    <div class="servicios">${SERVICIOS.map(s => {
      const ps = paginas(s.nombre);
      return `<section class="serv" data-id="${s.id}" style="--c:${s.c};--cb:${s.cb}">
        <div class="serv-h">
          <div class="serv-t"><span class="serv-dot"></span><h2 class="serv-n">${esc(s.nombre)}</h2></div>
          <div class="serv-a"><button type="button" class="btn-act">${ICONO_ACT}Actualizar</button><span class="estado">…</span></div>
        </div>
        <div class="list">${ps.length ? ps.map(p => `<a class="item" href="${esc(p.archivo)}">
          <div class="item-icon">${COM2.icono(p.icono)}</div><div class="item-name">${esc(p.nombre)}</div><div class="item-arrow">›</div></a>`).join('')
          : '<div class="sin">Todavía no hay páginas.</div>'}</div>
      </section>`;
    }).join('')}</div>
    ${Object.entries(otrosGrupos).map(([g, ss]) => `<div class="grupo"><h3>${esc(g)}</h3><div class="grid">${ss.map(s =>
      `<a class="tile acc-${esc(s.color)}" href="${esc(s.archivo)}"><div class="tile-icon">${COM2.icono(s.icono)}</div><div class="tile-name">${esc(s.nombre)}</div></a>`).join('')}</div></div>`).join('')}
  </div>`;
  $('menu').querySelectorAll('.serv').forEach(sec => {
    const s = SERVICIOS.find(x => x.id === sec.dataset.id);
    sec.querySelector('.btn-act').onclick = () => actualizar(s, sec);
  });
  mostrarHoras();
}
async function mostrarHoras() {
  const h = await subidas().catch(() => null);
  $('menu').querySelectorAll('.serv').forEach(sec => {
    const est = sec.querySelector('.estado');
    if (!h) return estado(est, 'No se pudo leer la base', true);
    estado(est, h[sec.dataset.id] ? 'Actualizado ' + horaLocal(h[sec.dataset.id]) : 'Sin datos');
  });
}

// Pide a n8n que regenere la base y la suba. Queda publicada al instante; por las dudas se consulta
// actualizado.json cada 3 s, hasta 30 s, hasta que tenga la hora de esta subida.
async function actualizar(s, sec) {
  const b = sec.querySelector('.btn-act'), est = sec.querySelector('.estado');
  b.disabled = true; b.classList.add('girando');
  estado(est, 'Actualizando...');
  try {
    let r;
    try {
      // ngrok gratis muestra una página de aviso a los navegadores; este encabezado la saltea
      const res = await fetch(N8N + s.id + '-actualizar', { method: 'POST', headers: { 'ngrok-skip-browser-warning': '1' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      r = await res.json();
    } catch (e) { return estado(est, 'No se pudo conectar con la PC del COM', true); }
    if (!r.actualizado || !r.subida) return mostrarHoras();
    for (let i = 0; i < 10; i++) {
      if ((await subidas().catch(() => ({})))[s.id] === r.subida) return estado(est, 'Actualizado ' + horaLocal(r.subida));
      await new Promise(ok => setTimeout(ok, 3000));
    }
    estado(est, 'Actualizado; se verá en unos minutos');
  } finally { b.disabled = false; b.classList.remove('girando'); }
}

function dibujarMenu() {
  $('okClave').hidden = true;
  const del = secciones ? secciones.filter(s => s.panel === panel) : [];
  if (panel === 'supervisor') return dibujarSupervisor(del);
  if (!del.length) { $('menu').innerHTML = '<p class="vacio">Todavía no hay nada en este panel.</p>'; return; }
  // Todas las tarjetas juntas, sin títulos de grupo (pedido del usuario, 13/11): hasta 3 por renglón,
  // en el orden de secciones (grupo y orden)
  $('menu').innerHTML = `<div class="grupo"><div class="grid">${del.map(s =>
      `<a class="tile acc-${esc(s.color)}" href="${esc(s.archivo)}"><div class="tile-icon">${COM2.icono(s.icono)}</div><div class="tile-name">${esc(s.nombre)}</div></a>`).join('')}</div></div>`;
}

arrancar();
</script>
</body>
</html>
